      "body": "- Added **`cpt check-language`** with deterministic `LANG001` validation for Markdown content.\r\n- Integrated language checking into the **analyze workflow**, including support for **ignore patterns**.\r\n- Hardened validation and config error reporting: unknown language codes and workspace config issues now surface explicitly.\r\n- Added **Python < 3.11** TOML compatibility via `_tomllib_compat.py`.\r\n\r\n## What's Changed\r\n* feat: Add Python <3.11 compatibility for tomllib imports by @Artifizer in https://github.com/cyberfabric/cyber-pilot/pull/148\r\n* improve guides by @ainetx in https://github.com/cyberfabric/cyber-pilot/pull/147\r\n* feat: add content language validation for markdown artifacts by @teslanika in https://github.com/cyberfabric/cyber-pilot/pull/133\r\n\r\n## New Contributors\r\n* @teslanika made their first contribution in https://github.com/cyberfabric/cyber-pilot/pull/133\r\n\r\n**Full Changelog**: https://github.com/cyberfabric/cyber-pilot/compare/v3.6.0-beta...v3.7.0-beta",
