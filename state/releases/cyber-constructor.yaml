      "tarball_url": "https://api.github.com/repos/cyberfabric/cyber-constructor/tarball/v3.6.0-beta",
      "zipball_url": "https://api.github.com/repos/cyberfabric/cyber-constructor/zipball/v3.6.0-beta",
      "body": "This release focuses on telemetry, agent-generation hardening, skills-location cleanup, and project extensibility fixes.\r\n\r\n### What's Changed\r\n\r\n- Added **non-blocking usage telemetry** in the CLI proxy so optional telemetry collection no longer delays command execution\r\n- Hardened **agent generation**:\r\n  - dry-run previews now include both subagents and `legacy_skills`\r\n  - legacy cleanup now validates frontmatter and workflow targets to prevent accidental over-deletion\r\n  - file detection helpers now handle `UnicodeDecodeError`\r\n  - unified skill frontmatter generation\r\n- Completed **skills location consolidation**:\r\n  - skills now live only in `.claude/skills/` and `.agents/skills/`\r\n  - legacy skill locations were removed\r\n- Fixed several **project extensibility** issues:\r\n  - improved worktree boundary detection\r\n  - improved master-layer source trust handling\r\n  - added `append_file` support for multi-layer pipelines\r\n- Updated **architecture documentation**:\r\n  - consolidated the agent integration model around shared skill stubs\r\n  - documented the relationship between project extensibility and workspace federation\r\n\r\n### Highlights\r\n\r\n- More reliable and safer agent generation\r\n- Cleaner, single-source skill layout\r\n- Better extensibility behavior in layered/project setups\r\n- Improved docs for agent and workspace architecture\r\n\r\n## New Contributors\r\n* @pr0tey made their first contribution in https://github.com/cyberfabric/cyber-pilot/pull/144\r\n\r\n**Full Changelog**: https://github.com/cyberfabric/cyber-pilot/compare/v3.5.1-beta...v3.6.0-beta",
      "mentions_count": 1
    },
