      "zipball_url": "https://api.github.com/repos/cyberfabric/cyberware-obsidian/zipball/1.0.4",
      "body": "- Initial release of Cyberware Repos for Obsidian, a plugin that syncs Cyber Pilot-enabled specifications from GitHub repositories into your Obsidian vault.\r\n- Added automatic linking between related specs, plus generated Artifacts and Undefined pages to help track defined and missing identifiers.\r\n- Includes flexible repository setup with support for owner/repo, full GitHub URLs, branch-specific sync, and per-repository enable/disable controls.\r\n- Added configuration options for personal access tokens, custom sync folder location, and optional auto-sync on Obsidian startup."
