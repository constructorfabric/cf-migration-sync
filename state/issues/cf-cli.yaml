        "body": "Roadman to fulfill https://github.com/hypernetix/hyperspot/issues/312#issuecomment-3801091330\n\nThe idea will be to create a CLI to handle the different use cases that a developer or a user can have. We will organize the main functionality into 5 groups:\n\n1. setup\n2. lint\n3. test\n4. run\n5. build\n\nEach of the groups will have their corresponding CLI command with different functionality:\n\n- [x] `setup`\n  - [x] `tools` install/update required tooling (by default checks in the environment what tools you miss or needs to be upgraded). Ideally each tool should be categorized (maybe someon\n    - [ ] `--upgrade` upgrade your installed tools to the recommended version of the tool\n    - [x] `--install` install a comma separated tools\n    - [x] `--install-yolo` install all tools without asking feedback\n    - [x] `--verbose` add verbosity\n  - [x] `template` generate template for new repo\n    - [x] `init PATH` initialize the barebones for a new cyberfabric project\n    - [x] `add MODULE` generates a new module from a template (you could choose from a list)\n  - [x] `config` handles and validate the configuration file\n- [ ] `lint`\n  - [ ] when you run it without any other params it will run `clippy` (which includes cargo check) + our custom `dylint` rules\n  - [ ] --clippy to just run clippy with our custom set of lints\n  - [ ] --dylint to just run our custom dylint rules\n  - [ ] --pattern used only when dylint is provided, it will run a specific dylint rule from the set\n- [ ] `test` run all available tests\n  - [ ] `--e2e` run only end to end tests\n  - [ ] `--module` run tests for a given module\n  - [ ] `--coverage` run with coverage\n- [x] `run` fire up a hyperspot server with hot-module reload\n  - [x] `-r` in release mode\n  - [x] `-c` configuration to run the server\n- [x] `build`\n  - [x] `-r` in release mode\n  - [x] `-c` configuration to run the server\n- &cross; `deploy` not planned for now",
