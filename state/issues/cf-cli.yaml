        "body": "The basic case for running a project is clear. However, when there's an Out Of Process communication, the development gets a bit complex:\n- https://github.com/cyberfabric/cyberfabric-core/blob/main/config/oop-example-master%2Bfollower.yaml We need to test this example to check whether master+follower works with the CLI\n- The hard part is when we are the follower, and we need the master reference:\n  - https://github.com/cyberfabric/cyberfabric-core/blob/main/config/oop-example-follower.yaml\n  - https://github.com/cyberfabric/cyberfabric-core/blob/main/config/oop-example-master.yaml\n\nThese two requires testing and adapt `run` and `build` based on the oop configurations.",
