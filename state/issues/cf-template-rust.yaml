        "body": "We are going to use `cargo-generate` for the creation of the templates.\n\nBased on the current status of modkit we are going to need templates for the following:\n- [x] Basic - Background module with a tracing info with hello world (Init)\n- [x] Basic - Background module with api request to an external service\n  - [x] client to make request to a random public API ipinfo\n- [x] Normal - REST API host:\n```rust\n#[modkit::module(\n\tname = \"api-gateway\",\n\tcapabilities = [rest_host, stateful],\n\tlifecycle(entry = \"serve\", stop_timeout = \"30s\", await_ready)\n)]\n```\nIn order to achieve this point we are going to need `src/api/routes.rs` and `src/api/dto.rs`\nAlso need configuration feature `src/config.rs`\n- [x] Normal - Along Rest API host , create a REST API handler with authenticated and unauthenticated routes\n  - [ ] authenticated route\n  - [x] unauthenticated route\n  - [x] database example\n```rust\n#[modkit::module(\n    name = \"users-info\",\n    capabilities = [db, rest]\n)]\n```\nsimilar to what we have in the users-info, but just Rest handlers: https://github.com/cyberfabric/cyberfabric-core/tree/main/examples/modkit/users-info/users-info/src and create an sdk with a client to communicate with those endpoints.\n- [ ] Normal - Along cf-api-gateway , create a GRPC handler\n  - [ ] authenticated route\n  - [ ] SSE example\n  - [ ] database example\n- [ ] Advanced - GRPC Host\n- [ ] Advanced - Inter-module communication\n\nFor the handlers we could agree in having different templates for each handler",
