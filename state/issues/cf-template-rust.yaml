        "body": "For fast development, I removed the templating system almost completely and rely on the cli to generate templates.\n\nThe idea is to have either good development experience while modifying the \"templates\" and having a real template (where at least, you can modify the project name, and not having it hardcoded). So the proposal that I thought was to use a tool like https://dystroy.org/bacon/ so we can have the templates in `Init` and `Modules` but everytime we modify something in any of those places, we can have a reference in an ignored folder like `dev`, where we can check in real-time whether we are breaking something.\n\nThis is a topic of discussion.\n\nAnother option is to not rely on the cargo-generate tool and use the CLI(which is already pretty advanced on this topic).",
