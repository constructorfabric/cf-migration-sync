        "body": "Replace the FE's compiled-in `BULLET_DEFS` / `IC_KPI_DEFS` / `METRIC_KEYS` registries with hydration from `POST /catalog/get_metrics` per cyberfabric/cyber-insight metric-catalog DESIGN §3.3.\n\n## Scope\n\n- Add `useCatalog()` hook calling `POST /catalog/get_metrics` once per session-or-TTL (default 5 min); cache per tenant.\n- **Key every metric lookup by `id` (UUIDv7)** — the backend-internal `metric_key` is NOT on the wire and MUST NOT be derived.\n- **Render `label` for display** — no compiled-in display strings.\n- **Handle `schema_status`**: `ok` → render normally; `unchecked` → render normally (validator hasn't run yet); `error` → render with broken-metric indicator, suppress threshold-based coloring (still show the label).\n- **Honor `bounded_by_lock`** as a separate signal from `resolved_from`.\n- **Degrade gracefully** when a previously-seen `id` disappears from a later response (the metric was disabled).\n- Remove `src/screensets/insight/api/thresholdConfig.ts` content (the consts can stay as `{}` if any consumer still imports the file during the transition).\n- Mock factories default to `schema_status = 'ok'` so dev mode still works.\n\n## Acceptance criteria\n\n- [ ] No compiled-in metric metadata in the FE bundle (verify via bundle inspection).\n- [ ] Bullet / KPI rendering byte-for-byte matches pre-migration output (per PRD §12 risk mitigation — frontend-delete held until comparison passes).\n- [ ] Error-state rendering distinct for `schema_status = 'error'` metrics.\n- [ ] Removing `thresholdConfig.ts` (or replacing exports with `{}`) does not break Team or IC dashboards.\n\n## Depends on (cross-repo)\n\n- cyberfabric/cyber-insight: read endpoint implementation (see EPIC parent issue)\n\n## References\n\n- cyberfabric/cyber-insight DESIGN §3.3 (Catalog Read + Consumer Contract)\n- cyberfabric/cyber-insight PRD v1.11 §1.1 (SSOT principle)\n- Parent EPIC: cyberfabric/cyber-insight#526\n",
