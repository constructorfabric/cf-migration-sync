        "body": "1. Scenarios\n\nSpecs:\na. Generate templates for PRD, ADR, DESIGN, SCENARIOS, etc.\nb. Review pre-created/existing documents: PRD, ADR, DESIGN, SCENARIOS, etc. Provide feedback\n\nCode-related:\nc. Create new project / module:\n    - from scratch, including PRD, ADR, etc\n    - started with pre-created PRD, ADR, DESIGN, SCENARIOS, etc\nd. Generate business/arch/tech spec from existing code\ne. Implement new feature(s) in existing code:\n    - from scratch\n    - started with pre-created PRD, ADR, DESIGN, SCENARIOS, etc\nf. actual FEATURE description after latest code changes\n\n2. To consider to have separate quickstart files for scenarios above\n\n3. Explain taxonomy and domain model:\na. Document types and their purpose - BRD, PRD, ADR, DESIGN, SCENARIOS\nb. explain the nature of FEATURE - arch or business system element/block that is always ACTUAL and maps to current implementation\n\n4. To describe global dilema:\n- more docs - bad: conflicts, more sync, parallel universe\n- single large doc - also bad, very context, too hard to understand\n\nto consider to explain FDD value - like to get control on large projects, maybe need to add diagram\n",
