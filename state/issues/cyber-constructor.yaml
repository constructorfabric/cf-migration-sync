        "body": "### Problem\n\n`cypilot validate` tracks code coverage (`Code coverage: X/Y`) but treats it as informational — a project can pass validation with 0/49 coverage. Additionally, unchecked `[ ]` items with `to_code=true` are silently excluded from the coverage denominator, creating a blind spot.\n\n### Current behavior\n\nAll identifier kinds with `to_code=true` in `constraints.toml` (`flow`, `algo`, `state`, `dod`) are expected to have corresponding `@cpt` markers in source code. The table below shows how `cypilot validate` handles each combination:\n\n| Feature doc (artifact) | Source code (`@cpt` marker) | Coverage impact | Validation result |\n|------------------------|----------------------------|-----------------|-------------------|\n| ID defined, checkbox `[x]` | `@cpt` marker present | Counted in X/Y | PASS |\n| ID defined, checkbox `[x]` | `@cpt` marker **missing** | Denominator grows, numerator doesn't → coverage drops | ERROR: `code-no-marker`, `code-inst-missing` |\n| ID defined, checkbox `[ ]` | `@cpt` marker **missing** | **Not counted at all** | **No error, silent skip** |\n| ID defined, checkbox `[ ]` | `@cpt` marker present | Not counted | ERROR: `CODE_TASK_UNCHECKED` |\n| ID **not defined** in docs | `@cpt` marker present | Not counted | ERROR: `code-orphan-ref` |\n\nRow 3 is the blind spot: a `to_code=true` identifier exists in the feature doc with an unchecked checkbox and no implementation in code — `cypilot validate` produces **no error and no coverage impact**. This means:\n- A developer can add a new algo/flow/dod to a feature doc, leave the checkbox unchecked, never implement it, and `cypilot validate` will report 100% coverage.\n- Coverage percentage is misleading — it only reflects checked items, not the total scope of work defined in documentation.\n\n### Workaround (currently in place)\n\nA shell wrapper in `Makefile` parses `cypilot validate` stdout and fails if `covered != total`:\n\n```makefile\n# TODO: replace shell coverage check with native cypilot.py validate --min-coverage 100\ncypilot-validate:\n\t@output=$$(python3 ... validate 2>&1); rc=$$?; \\\n\techo \"$$output\"; \\\n\tif [ $$rc -ne 0 ]; then exit 1; fi; \\\n\tcov=$$(echo \"$$output\" | grep \"Code coverage:\" | sed 's/.*Code coverage: *//'); \\\n\tif [ -n \"$$cov\" ]; then \\\n\t\tcovered=$${cov%%/*}; total=$${cov##*/}; \\\n\t\tif [ \"$$covered\" != \"$$total\" ]; then exit 1; fi; \\\n\tfi\n```\n\nThis is fragile (relies on stdout format) and doesn't address the unchecked-item blind spot.\n\n### Proposed changes\n\n#### 1. `--min-coverage` flag for `cypilot validate`\n\n```bash\ncypilot validate --min-coverage 100\n```\n\n- When provided and coverage is below the threshold, emit an **error** (not warning) and return exit code 2 (FAIL).\n- Default: no threshold (backward compatible).\n- Coverage formula remains `len(code_ids_found & to_code_ids) / len(to_code_ids)`.\n\n#### 2. Include unchecked `to_code` items in coverage reporting\n\nUnchecked `to_code=true` items without code markers should be included in the coverage denominator. Coverage becomes `found / (checked_to_code + unchecked_to_code)`. This makes coverage reflect the true documentation scope — not just the \"already done\" subset.\n\nOutput should show both:\n```\nCode coverage: 49/52 (3 unchecked: cpt-foo-algo-bar, cpt-foo-dod-baz, cpt-foo-flow-qux)\n```\n\nWhen `--min-coverage` is set, the unchecked items naturally reduce coverage below 100% and produce an error.\n\n### Acceptance criteria\n\n- [ ] `cypilot validate --min-coverage 100` fails with an error when coverage < 100%\n- [ ] `cypilot validate --min-coverage 0` always passes (coverage check disabled)\n- [ ] Unchecked `to_code=true` items without code markers are counted in the coverage denominator\n- [ ] Existing behavior without `--min-coverage` is unchanged (backward compatible)\n- [ ] Makefile `TODO` comment can be replaced with native flag\n\n### Context\n\n- `validate.py` line 719: `overall_status = \"PASS\" if not all_errors else \"FAIL\"` — coverage not checked\n- `validate.py` lines 503-513: unchecked items go to `to_code_ids_task_unchecked`, excluded from `to_code_ids`\n- `codebase.py` lines 380-408: `forbidden_code_ids` only catches the reverse case (marker exists, checkbox unchecked)\n- `constraints.toml`: `to_code = true` on `flow`, `algo`, `state`, `dod` identifier kinds\n",
