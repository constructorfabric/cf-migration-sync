        "body": "## Problem\n\nCDSL instructions have a `-` between the checkbox and priority that other artifacts (PRD, DESIGN, DECOMPOSITION, FEATURE DoD) don't:\n\n```\nCDSL (FEATURE flows):  1. [ ] - `p1` - description - `inst-id`\nOther artifacts:       - [ ] `p1` - **ID**: `cpt-...-fr-slug`\n```\n\nThe `-` after `[ ]` is parsed as a nested list marker by Markdown renderers, so numbered CDSL steps display as bullet sub-items — ugly and hard to read.\n\n## Suggestion\n\nRemove the dash from CDSL format to match ID definitions:\n\n```\n1. [ ] `p1` - description - `inst-id`\n```\n\nUpdate spec, validator regex, and examples.",
