        "body": "## Bug: Incorrect version installed via pipx on Windows10\n\nThe latest release is listed as **v3.1.0-beta**, however installing via `pipx` results in an older version being installed.\n\n### Steps to reproduce\n```bash\npipx install git+https://github.com/cyberfabric/cyber-pilot.git\n```\n\n### Actual result\nVersion 3.0.9b0 is installed:\n\ninstalled package cypilot 3.0.9b0, installed using Python 3.14.3\n```\nC:\\Users\\mrAle>pipx install git+https://github.com/cyberfabric/cyber-pilot.git\n←[K  installed package ←[1mcypilot←[0m ←[1m3.0.9b0←[0m, installed using Python 3.14.3''\n  These apps are now available\n    - cpt.exe\ndone! ✨ 🌟 ✨\n```\n\n\n### Additional observation\nAttempting to upgrade also reports that 3.0.9b0 is the latest available version:\n\n```pipx upgrade cypilot```\n\nOutput:\n\ncypilot is already at latest version 3.0.9b0\n```\nC:\\Users\\mrAle>pipx upgrade cypilot\n←[Kcypilot is already at latest version 3.0.9b0 (location: C:\\Users\\mrAle\\pipx\\venvs\\cypilot)\n```\n\n### Expected result\npipx should install or upgrade to v3.1.0-beta, which appears to be the most recent release.\n",
