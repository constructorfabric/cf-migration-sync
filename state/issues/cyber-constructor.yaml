        "body": "## Bug\n\n`cpt validate` and other CLI commands fail on Python 3.10 with:\n\n```\nModuleNotFoundError: No module named 'tomllib'\n```\n\n`tomllib` is a stdlib module added in **Python 3.11**. Four source files import it unconditionally:\n\n- `cypilot/commands/agents.py`\n- `cypilot/utils/artifacts_meta.py` (2 call sites)\n- `cypilot/utils/manifest.py`\n- `cypilot/utils/toml_utils.py`\n\n## Expected behavior\n\nCypilot should work on Python 3.10+ (or declare minimum Python version explicitly).\n\n## Suggested fix\n\nReplace bare `import tomllib` with a try/except fallback to `tomli` (the backport package):\n\n```python\ntry:\n    import tomllib\nexcept ModuleNotFoundError:\n    import tomli as tomllib\n```\n\nAlternatively, declare `python_requires >= 3.11` if Python 3.10 support is not intended.\n\n## Workaround\n\nApplied in cyberfabric/insight#69 — patched all 4 files locally + `pip install tomli`.\n\n## Environment\n\n- Python 3.10.11 (Windows 10)\n- cypilot latest (as of 2026-04-08)",
