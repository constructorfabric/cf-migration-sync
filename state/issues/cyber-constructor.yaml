        "body": "## Summary\n\n`cpt validate` silently re-injects the minimal `<!-- @cpt:root-agents -->` redirect into `CLAUDE.md` on every run. Validation should be read-only.\n\n## Steps to reproduce\n\n1. `cpt init` (injects full navigation block into `AGENTS.md`, minimal redirect into `CLAUDE.md`)\n2. Sync `CLAUDE.md` `@cpt:root-agents` block to match `AGENTS.md`\n3. `cpt validate`\n4. Observe: `CLAUDE.md` is modified — the block is replaced with the minimal redirect\n\n## Expected behavior\n\n`cpt validate` should never modify files. It can check the `@cpt:root-agents` block and report a mismatch as an error, but the fix should be left to `cpt update` or manual action.\n\n## Actual behavior\n\n`cpt validate` overwrites the `@cpt:root-agents` block in `CLAUDE.md` on every run, breaking sync for projects that keep `CLAUDE.md` and `AGENTS.md` identical.\n\n## Version\n\n`cypilot-proxy v3.0.8-beta`",
