          "body": "First of all, thanks for your report! I am not sure that writing of simple hello world scripts is an expected goal for using of cyber pilot =)\nBut, I think it would be nice to have some complexity detector and have some lightweight simple workflows selection instead of smart coding assistant for such tasks. Anyway I believe that oneshot good enough code generation is better than 10x prompts with the same result where it is needed to ask LLM to do N updates in the generated code to achieve expected quality, especially for prompt-based cost (not tokens), like in Windsurf. Coding workflow makes agents to follow common best coding practices which you need to attach in your prompts as a first step or in the next steps after review. That's the idea is to collect all common rules and always follow them focusing on business goals.\n\nI will think about complexity detector and add 3 levels of coding workflows for each complexity level.",
