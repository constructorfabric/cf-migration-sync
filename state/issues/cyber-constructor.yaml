        "body": "## Problem\n\nCypilot navigation is injected into CLAUDE.md, which loads for every agent — including specialized ones defined in `.claude/agents/`. The navigation chain pulls in the full cypilot machinery: artifact schemas, PRD/DESIGN/ADR rules, kit blueprints, validation specs.\n\nA developer agent writing UI components doesn't need ADR authoring rules. A researcher reading code doesn't need artifact validation schemas. Loading everything into every agent wastes context window and adds noise.\n\n## Current state\n\n```\nCLAUDE.md (loaded for ALL agents)\n  → .gen/AGENTS.md (artifact rules, schema refs)\n    → .core/schemas, .core/architecture, kit blueprints...\n```\n\nSchema/template loading is conditional (e.g. `WHEN working with artifacts.toml`), so the heavy files aren't always pulled in. But the conditional rules themselves still sit in every agent's context. A developer agent carries WHEN clauses about artifact schemas it will never touch. Worse, the agent can misfire on a condition and start reading artifact templates/schemas it has no business with — burning tokens and potentially acting on rules meant for a different role.\n\n## Suggestion\n\nCypilot should provide selective entrypoints — scoped subsets of the navigation chain that specialized agents can reference instead of the full block.\n\nEntrypoints should be per-artifact (or per-concern), so agents reference only what they need:\n\n```\n.cypilot/.gen/entrypoints/\n  traceability.md    — @cpt-* markers, code↔spec linking\n  prd.md             — PRD authoring rules\n  design.md          — DESIGN authoring rules\n  adr.md             — ADR authoring rules\n  codebase.md        — codebase conventions, registry\n  ...\n```\n\nUsage in `.claude/agents/`:\n\n```markdown\n# developer agent — only needs code conventions and traceability\n@.cypilot/.gen/entrypoints/codebase.md\n@.cypilot/.gen/entrypoints/traceability.md\n```\n\n```markdown\n# architect agent — needs artifact authoring\n@.cypilot/.gen/entrypoints/prd.md\n@.cypilot/.gen/entrypoints/design.md\n@.cypilot/.gen/entrypoints/adr.md\n```\n\nEach agent picks exactly the pieces it needs instead of inheriting everything.",
