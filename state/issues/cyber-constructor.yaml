        "body": "## Problem\n\n`cpt toc` strips underscores from heading anchors when the heading contains backtick-wrapped identifiers with underscores. This causes a mismatch with GitHub's anchor generation, which preserves underscores.\n\n## Example\n\nHeading:\n```markdown\n### Option B: Separate `person_unmapped` table in person domain\n```\n\n| Generator | Anchor |\n|---|---|\n| `cpt toc` | `#option-b-separate-personunmapped-table-in-person-domain` |\n| GitHub | `#option-b-separate-person_unmapped-table-in-person-domain` |\n\n`cpt validate-toc` passes (internally consistent), but in-page navigation is broken on GitHub.\n\n## Expected behavior\n\n`cpt toc` should preserve underscores in heading anchors, matching GitHub's behavior.\n\n## Affected file\n\n`docs/domain/person/specs/ADR/0001-shared-unmapped-table.md` — line 20 TOC entry for Option B.\n\n## Context\n\nFound during Identity Resolution domain spec work (cyberfabric/insight PR for identity-resolution/person/org-chart domain split).",
