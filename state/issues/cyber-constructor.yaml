        "body": "## Problem\n\n`cpt init` injects into CLAUDE.md:\n\n```\nSTOP and READ `AGENTS.md` in project root before ANY tool calls or skill invocation\n```\n\nFull navigation block (cypilot_path, routing rules) only goes into AGENTS.md.\n\nTwo issues with this:\n\n**1. Context ordering** — Claude Code loads CLAUDE.md as system context (high priority, before user prompt). AGENTS.md content only appears after a Read tool call — after the prompt, as a tool result. Navigation rules end up in a weaker context position than needed. Each new conversation also pays a tool call before any real work.\n\n```\nsystem prompt  →  CLAUDE.md (system context)  →  user prompt  →  Read AGENTS.md (tool result)\n```\n\n**2. Over-opinionated** — CLAUDE.md is a file teams curate with their own conventions and rules. Injecting a \"STOP\" guard at the top hijacks the first instruction the agent sees, forcing cypilot navigation to take priority over project rules.\n\n## Suggested fix\n\nPut the same managed block in both CLAUDE.md and AGENTS.md.\n\n`_compute_claude_block()` should output the full navigation block (same as `_compute_managed_block()`), not just a one-liner pointer.\n\n- Claude Code gets rules in system context — no extra tool call\n- Non-Claude agents using AGENTS.md still work as before\n- No \"STOP\" gate hijacking project CLAUDE.md",
