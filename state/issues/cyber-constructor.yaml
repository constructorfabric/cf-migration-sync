        "body": "During setup for codex I found 2 issues\n\n1 - After generation agents codex has fewer commands/skills than other agents:\n\n![Image](https://github.com/user-attachments/assets/922d0481-0379-4b1d-a4b2-92a702b0fc6a)\n\n2 - In codex CLI warning about incorrect agent role\n\n![Image](https://github.com/user-attachments/assets/abd16de7-7340-452e-9f0c-736416bff966)\n\n\n**How to reproduce:**\n\n1. Create new folder\n2. Run `cpt init`\n3. Run `cpt generate-agents`\n4. Observe agent/skills/commands list\n5. Run `codex`\n6. Observe warning ",
