        "body": "\n# spec-coverage --system `<slug>` returns 0 files for a registered system\n\n## Summary\n\n`cpt --json spec-coverage --system <slug>` reports \"No codebase files\nfound in registry\" and exits with status `PASS` even when the target\nsystem has fully populated `[[systems.children.codebase]]` entries in\n`config/artifacts.toml`. Project-wide `cpt --json spec-coverage` (no\n`--system` filter) sees the same files just fine, so the failure is\nspecific to the `--system` filter resolution path.\n\nThe vacuous PASS is the worst part of the bug: a CI gate that wraps the\ncommand will never fail, but it never measures anything either.\n\n## Affected version\n\n`cpt 3.7.0b0` (`cypilot-proxy 3.7.0b0`, skill kit `v3.7.0-beta`).\n\n## Reproduction\n\nTested on macOS 25.4, Python 3.13, against a workspace with the\nfollowing registry shape (truncated):\n\n```toml\n# cypilot/config/artifacts.toml\n[[systems]]\nname = \"UPilot\"\nslug = \"upilot\"\nkit  = \"sdlc\"\n\n[[systems.children]]\nname = \"Utea\"\nslug = \"utea\"\nkit  = \"sdlc\"\n\n  [[systems.children.codebase]]\n  path       = \".workspace-sources/apps/utea-api/src\"\n  source     = \"utea-api\"\n  extensions = [\"py\"]\n\n  [[systems.children.codebase]]\n  path       = \".workspace-sources/apps/utea-api/tests\"\n  source     = \"utea-api\"\n  extensions = [\"py\"]\n\n  [[systems.children.codebase]]\n  path       = \".workspace-sources/apps/utea-web/src\"\n  source     = \"utea-web\"\n  extensions = [\"ts\", \"tsx\"]\n\n  [[systems.children.codebase]]\n  path       = \".workspace-sources/apps/utea-web/tests\"\n  source     = \"utea-web\"\n  extensions = [\"ts\", \"tsx\"]\n```\n\nFiltered (broken) invocation:\n\n```bash\n$ cpt --json spec-coverage --system utea\n{\n  \"status\": \"PASS\",\n  \"summary\": {\n    \"total_files\": 0,\n    \"covered_files\": 0,\n    \"coverage_pct\": 0.0,\n    \"granularity_score\": 0.0\n  },\n  \"message\": \"No codebase files found in registry\"\n}\n$ echo $?\n0\n```\n\nProject-wide invocation (works):\n\n```bash\n$ cpt --json spec-coverage | jq '.summary'\n{\n  \"total_files\": 113,\n  \"covered_files\": 113,\n  ...\n}\n```\n\n`cpt --json info` confirms the registry is healthy — the four\n`utea` codebase entries are present and resolve to existing\ndirectories. There is no error or warning emitted by `info`.\n\n## Expected vs actual\n\n| | Expected | Actual |\n| --- | --- | --- |\n| `summary.total_files` | Number of `.py`/`.ts`/`.tsx` files under the four `utea` codebase paths (113 in this workspace) | `0` |\n| `message` | absent OR `\"<N> files scanned\"` | `\"No codebase files found in registry\"` |\n| Exit status | `PASS` if coverage threshold met, `FAIL` if not | `PASS` (vacuous — measures nothing) |\n\nThe vacuous PASS is a CI-correctness hazard: a downstream gate that\nwraps `cpt --json spec-coverage --system <slug> --min-coverage 80` will\n*never* fail because `total_files = 0`, even when coverage on the real\nfiles has dropped to zero.\n\n## Workaround we used\n\nIn our SDLC remediation plan we ran the project-wide\n`cpt --json spec-coverage`, captured the per-file output, and filtered\non `.workspace-sources/apps/utea-api/src/` (and `utea-web/src/`) in jq\nto recover the per-system view. This is fine for an interactive audit\nbut is unsuitable as a CI gate.\n\n## Proposed fix paths (for triage discussion)\n\n1. Make `--system <slug>` traverse `config/artifacts.toml` and resolve\n   every `[[systems.children.codebase]]` block whose ancestor system\n   matches the slug (recursively). Today it appears to look for a\n   top-level system match only.\n2. If the lookup matches zero codebase entries, exit `FAIL` (not\n   `PASS`) with a clear message — vacuous PASS is the actual hazard.\n3. As a complementary diagnostic, `cpt --json info` could surface a\n   `coverage_resolution_test` field that pre-checks each registered\n   system slug against the `--system` filter and reports the resolved\n   file count, so misconfiguration is visible before a CI run.\n\n## Cross-reference\n\n- Cypilot remediation plan that surfaced the issue:\n  `architecture/utea/remediation-DELTA.md` § Validate gate (gate 7,\n  DEFERRED tooling caveat)\n- ADR documenting the FULL traceability scope and pointing here:\n  `architecture/utea/ADR/0012-code-traceability-scope.md`\n",
