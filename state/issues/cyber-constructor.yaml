        "body": "## Bug\n\nRunning `cpt update` copies Cypilot's internal Architecture Decision Records (ADRs) into user projects at `.cypilot/.core/architecture/ADR/`.\n\nThese 14 files (`0001-cpt-cypilot-adr-remove-blueprint-system-v1.md` through `0014-cpt-cypilot-adr-remove-system-from-core-toml-v1.md`) document Cypilot's own design decisions and have no relevance to the user's project.\n\n## Root Cause\n\n`cache.py` → `copy_from_local()` (lines 142-148) copies **everything** from the Cypilot repo root to `~/.cypilot/cache/` with no exclusion list:\n\n```python\nfor item in source.iterdir():\n    dst = cache_dir / item.name\n    if item.is_dir():\n        shutil.copytree(item, dst)\n    elif item.is_file():\n        shutil.copy2(item, dst)\n```\n\nSince `architecture/` is in `COPY_DIRS` (init.py line 17), the update command then copies `cache/architecture/` → `.cypilot/.core/architecture/`, which now includes the `ADR/` subdirectory from the Cypilot source repo.\n\n## Expected Behavior\n\nCypilot's own ADRs should not be distributed to user projects. Only architecture specs and feature documents relevant to the user's project should be copied.\n\n## Suggested Fix\n\nEither:\n- **A.** Add an exclusion list to `copy_from_local()` to skip non-distributable directories (`ADR/`, `tests/`, `examples/`, `guides/`, `images/`, etc.)\n- **B.** Move Cypilot's own ADRs out of the `architecture/` directory (e.g., to `docs/adr/` or `internal/adr/`) so they aren't part of the distributable structure\n\n## Repro\n\n1. `cpt update`\n2. Observe `.cypilot/.core/architecture/ADR/` now contains 14 Cypilot-internal ADR files",
