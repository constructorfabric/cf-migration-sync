        "body": "## Problem\n\nCurrent indexing uses flat row dicts keyed by line number (`constraints.py:1057-1113`). This causes:\n\n- **Line-number fragility** — edits shift lines, breaking the index until full re-scan\n- **No semantic link** between code changes and documentation\n- **No incremental updates** — `cross_validate_artifacts()` re-scans everything every time\n- **Disconnected indices** — code markers and doc IDs in separate flat dicts, no unified graph\n\n## Proposed Solution\n\n### P1: Structural Anchoring + Content Hashing\n\nReplace `line` with stable identity that survives line shifts:\n\n- **Code:** tree-sitter AST nodes (function/class/block) instead of line numbers\n- **Docs:** heading-tree path instead of line-indexed snapshot\n- **Content hash** per `@cpt-` block to detect changes without full re-parse\n\n### P2: Incremental Diff-Aware Index\n\n- Detect changed files via git diff\n- Re-parse only changed files, patch index (don't rebuild)\n- Mark stale cross-references for targeted re-validation\n\n### P3: Traceability Graph\n\nReplace `defs_by_id` / `refs_by_id` flat dicts with node/edge graph:\n\n- **Nodes:** Artifact, Section, Definition, Reference, CodeBlock\n- **Edges:** DEFINES, REFERENCES, IMPLEMENTS, CONTAINS\n\nEnables: \"this function changed → which docs are affected?\" and \"is this PRD item fully implemented?\"\n\n### P4: Real-Time Session Sync\n\n- Watch buffer changes for modified `@cpt-` markers\n- Push stale notifications: \"code under `cpt-X` changed — doc may need update\"\n\n## Market Context\n\nCursor, Cody, Copilot, Aider all use AST-based indexing with incremental updates. Cypilot's unique advantage is the `@cpt-` marker system — no competitor has explicit code↔doc traceability. Upgrading the index infrastructure makes this best-in-class.\n\n| Capability | Industry tools | Cypilot now | Cypilot proposed |\n|-----------|---------------|-------------|-----------------|\n| AST-aware indexing | Yes | No (line-based) | Yes (tree-sitter) |\n| Incremental updates | Yes | No (full rescan) | Yes (diff-aware) |\n| Code↔Doc linking | No | Yes (`@cpt-`) | Yes (graph edges) |\n| Drift detection | No | Partial | Yes (content hash) |",
        "closed_by": null,
