        "body": "`_infer_kind` in `cypilot/scripts/cypilot/commands/list_ids.py` walks every dash-separated segment of\n   an ID and keeps the **last** segment that matches a known kind. The canonical Cypilot ID grammar is\n  `cpt-{system}-{kind}-{slug}`, where `kind` is the first segment after the system prefix and the slug\n  may contain arbitrary words — including words that happen to coincide with other kind names (e.g.\n  `type-registry`, `component-registry`, `parent-child-import`). Last-match wins therefore returns the\n  wrong kind whenever the slug contains a kind keyword.\n\n  This breaks any consumer that aggregates IDs by kind (`list-id-kinds` counts, allocation matrices for\n   DECOMPOSITION, etc.).\n\n  ## Reproduction\n\n  Given a kit with kinds `component`, `interface`, `type`, `seq`, `fr`, ... (e.g. the SDLC kit) and a\n  system slug `acme`, the following IDs are reported with the wrong kind:\n\n  ```bash\n  cpt --json list-ids --pattern interface-component-registry\n  # returns:  {\"kind\": \"component\", ...}        ← should be \"interface\"\n\n  cpt --json list-ids --pattern component-type-registry\n  # returns:  {\"kind\": \"type\", ...}             ← should be \"component\"\n\n  cpt --json list-ids --pattern component-no-parent-type-import\n  # returns:  {\"kind\": \"type\", ...}             ← should be \"component\"\n\n  ┌──────────────────────────────────────────┬────────────┬────────────┬───────────────────────────┐\n  │                    ID                    │ Expected   │ Reported   │       Why it breaks       │\n  │                                          │    kind    │    kind    │                           │\n  ├──────────────────────────────────────────┼────────────┼────────────┼───────────────────────────┤\n  │ cpt-acme-interface-component-registry    │ interface  │ component  │ slug component-registry   │\n  │                                          │            │            │ contains component        │\n  ├──────────────────────────────────────────┼────────────┼────────────┼───────────────────────────┤\n  │ cpt-acme-component-type-registry         │ component  │ type       │ slug type-registry        │\n  │                                          │            │            │ contains type             │\n  ├──────────────────────────────────────────┼────────────┼────────────┼───────────────────────────┤\n  │ cpt-acme-component-no-parent-type-import │ component  │ type       │ slug contains type        │\n  └──────────────────────────────────────────┴────────────┴────────────┴───────────────────────────┘\n\n  Expected behavior\n\n  Per the canonical ID grammar cpt-{system}-{kind}-{slug}, kind = the first segment after the system\n  prefix. So:\n  - cpt-acme-interface-component-registry → kind interface, slug component-registry\n  - cpt-acme-component-type-registry → kind component, slug type-registry\n  - cpt-acme-component-no-parent-type-import → kind component, slug no-parent-type-import\n\n  Root cause\n\n  cypilot/scripts/cypilot/commands/list_ids.py lines 129-146:\n\n  def _infer_kind(cpt_id: str) -> Optional[str]:\n      sys_slug = _match_system_prefix(cpt_id)\n      if not sys_slug:\n          return None\n      remainder = cpt_id[len(f\"cpt-{sys_slug}-\"):]\n      if not remainder:\n          return None\n      parts = [p for p in remainder.split(\"-\") if p]\n      if not parts:\n          return None\n      # Prefer latest known kind token in composite IDs\n      best = None\n      for part in parts:\n          k = part.lower()\n          if known_kinds and k not in known_kinds:\n              continue\n          best = k                  # ← keeps overwriting; last match wins\n      return best\n\n  The comment \"Prefer latest known kind token in composite IDs\" intends to handle composite IDs, but\n  the resulting policy contradicts the documented grammar. Last-match wins is never correct when the\n  slug can contain kind-shaped tokens.\n\n  Impact\n\n  - list-ids returns the wrong kind for any ID whose slug contains a kind keyword. The slug appearing\n  later in the dash-separated form silently overrides the real kind.\n  - list-id-kinds aggregate counts are skewed in any project with interface-component-*,\n  component-type-*, or component-*-type-* style IDs.\n  - Downstream tooling that selects IDs by kind (allocation matrices, traceability reports, agent\n  prompts) operates on misclassified data.\n  - cpt validate is not affected — it parses kinds from the heading scope where each ID is defined, not\n   from the ID string. The bug is isolated to _infer_kind.\n\n  Proposed fix\n\n  Pick the first matching kind token (left-to-right), per the canonical grammar:\n\n  def _infer_kind(cpt_id: str) -> Optional[str]:\n      sys_slug = _match_system_prefix(cpt_id)\n      if not sys_slug:\n          return None\n      remainder = cpt_id[len(f\"cpt-{sys_slug}-\"):]\n      if not remainder:\n          return None\n      parts = [p for p in remainder.split(\"-\") if p]\n      if not parts:\n          return None\n      # Kind is the first segment after the system prefix; the slug may contain\n      # words that coincide with other kind names, so left-to-right wins.\n      for part in parts:\n          k = part.lower()\n          if known_kinds and k in known_kinds:\n              return k\n      return None\n\n  Behavior change:\n  - cpt-acme-interface-component-registry → interface (was component)\n  - cpt-acme-component-type-registry → component (was type)\n  - cpt-acme-component-no-parent-type-import → component (was type)\n\n  Existing IDs whose first-after-prefix segment is the only kind token in the slug are unaffected.\n\n  Suggested test cases\n\n  @pytest.mark.parametrize(\"cpt_id, expected\", [\n      (\"cpt-acme-component-x\",                          \"component\"),\n      (\"cpt-acme-interface-component-registry\",         \"interface\"),\n      (\"cpt-acme-component-type-registry\",              \"component\"),\n      (\"cpt-acme-component-no-parent-type-import\",      \"component\"),\n      (\"cpt-acme-seq-trace-pipeline\",                   \"seq\"),\n      (\"cpt-acme-fr-cli-binary\",                        \"fr\"),\n  ])\n  def test_infer_kind_uses_first_kind_token(cpt_id, expected):\n      assert _infer_kind(\n          cpt_id,\n          known_kinds={\"component\", \"interface\", \"type\", \"seq\", \"fr\"},\n      ) == expected\n\n  Workaround (until fix lands)\n\n  For consumers that need a correct kind, either:\n  - Parse the ID directly: after stripping the cpt-{system}- prefix, take the first dash-separated\n  segment of the remainder.\n  - Fall back to inspecting the heading scope where the ID is defined (what cpt validate does).\n\n  Environment\n\n  - cpt installed via pipx install git+https://github.com/cyberfabric/cyber-pilot.git\n  - Kit: sdlc (any kit with overlapping kind tokens in slugs reproduces it)\n  - Project ID grammar: cpt-{system}-{kind}-{slug} (kebab-case throughout)\n  - Pure-Python parser logic — reproducible on any platform.",
