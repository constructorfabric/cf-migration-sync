        "body": "When cypilot runs `cpt --json validate --artifact path/to/doc` to validate a feature document, it attempts to clone/sync all configured workspaces, including those unrelated to the feature being validated.\n\nThis causes unnecessary overhead and makes the validation process less efficient, especially in environments with multiple large workspaces.\n\n**Expected behavior:**\nOnly the workspace(s) relevant to the provided feature document should be cloned/synced for validation.\n\n**Current version:** cypilot-proxy 3.0.9b0",
