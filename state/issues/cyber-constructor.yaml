        "body": "## Problem\n\nAGENTS.md navigation rules use \"ALWAYS open and follow\" instructions:\n\n```\nALWAYS open and follow `{cypilot_path}/.gen/AGENTS.md` FIRST\nALWAYS open and follow `{cypilot_path}/config/AGENTS.md` WHEN it exists\n```\n\nThis relies on the agent making Read tool calls at runtime — extra cost, weaker context position, and one more thing that can go wrong (agent might skip it, or content gets compacted later).\n\n## Claude Code supports native imports\n\nCLAUDE.md supports `@path/to/file` syntax that auto-inlines referenced files into system context at launch. No tool call, no delay, highest priority context.\n\nExample:\n\n```markdown\n@.cypilot/.gen/AGENTS.md\n@.cypilot/config/AGENTS.md\n```\n\nThese would be expanded and loaded alongside CLAUDE.md before any user prompt.\n\n## Suggestion\n\nWhen generating agent integration files, detect the agent platform and use its native import mechanism where available.\n\nFor Claude Code (`cpt generate-agents --agent claude`):\n\n- Use `@path` references in CLAUDE.md instead of \"ALWAYS open and follow\" instructions\n- Referenced files get inlined as system context automatically\n- Supports relative paths, recursive imports (up to 5 levels deep)\n\nOther platforms may have their own include mechanisms — same principle applies.",
