          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Fall back to the generic copy for unmapped HTTP statuses.**\n\n`STATUS_KEY[code]` is only defined for 401/403/404. If this component gets another status like 500, `base` becomes `undefined` and the UI renders missing translation keys instead of the generic message.\n \n\n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-  const base = code !== null ? STATUS_KEY[code] : GENERIC_KEY;\n+  const base = code !== null ? (STATUS_KEY[code] ?? GENERIC_KEY) : GENERIC_KEY;\n```\n</details>\n\n<!-- suggestion_start -->\n\n<details>\n<summary>📝 Committable suggestion</summary>\n\n> ‼️ **IMPORTANT**\n> Carefully review the code before committing. Ensure that it accurately replaces the highlighted code, contains no missing lines, and has no issues with indentation. Thoroughly test & benchmark the code to ensure it meets the requirements.\n\n```suggestion\n  const base = code !== null ? (STATUS_KEY[code] ?? GENERIC_KEY) : GENERIC_KEY;\n\n  return (\n    <div className=\"flex-1 flex flex-col items-center justify-center px-8 py-12 text-center\">\n      <StatusIcon code={code} />\n      <h2 className=\"mt-4 text-lg font-semibold text-foreground\">\n        {t(`${base}.title`)}\n      </h2>\n      <p className=\"mt-2 max-w-md text-sm text-muted-foreground\">\n        {t(`${base}.description`)}\n      </p>\n    </div>\n  );\n```\n\n</details>\n\n<!-- suggestion_end -->\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/components/file/FileStatus.tsx` around lines 44 - 53, The computed\n`base` can become undefined for unmapped status codes (e.g., 500) because\nSTATUS_KEY only contains 401/403/404; change the assignment of `base` in\nFileStatus so it falls back to GENERIC_KEY when STATUS_KEY[code] is missing\n(e.g., use a conditional or nullish-coalescing check on STATUS_KEY[code] rather\nthan relying only on code !== null) so the t(`${base}.title`) and\nt(`${base}.description`) always use the generic copy for unmapped statuses.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commits df0c0fb to a942ff6",
