ead the event's mode and bail out unless it matches the current\n> viewMode (or component state variable named mode/viewMode) before calling\n> spliceChildren, setTree, setTreeLoading, or setTreeError; do the same guard for\n> the other listener around lines 437-443 so only payloads whose mode === current\n> viewMode update the tree.\n> ```\n> \n> </details>\n> \n> </blockquote></details>\n> \n> </blockquote></details>\n\n<details>\n<summary>🧹 Nitpick comments (2)</summary><blockquote>\n\n<details>\n<summary>src/app/components/file-mapping/FileMappingConfiguration.tsx (2)</summary><blockquote>\n\n`152-160`: _⚖️ Poor tradeoff_\n\n**Scroll restoration fires on every tree update, not just reloads.**\n\nThe effect depends on `[devTree, documentTree]`, so it runs whenever either tree changes (including subtree splices from lazy loading). While `pendingScrollRef.current` guards against unwanted restoration, this coupling is fragile — a future change might set `pendingScrollRef` without intending full scroll restoration.\n\nConsider using a dedicated flag or counter that only increments on explicit reloads.\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@src/app/components/file-mapping/FileMappingConfiguration.tsx` around lines\n152 - 160, The effect that restores scroll uses [devTree, documentTree] so it\nruns on any tree change; instead introduce a dedicated reload trigger (e.g. a\nreloadCounter state or reloadToken ref) that's incremented/updated only when an\nexplicit reload is triggered, then change the useEffect to depend on that\ntrigger rather than devTree/documentTree; inside the effect continue to read\npendingScrollRef.current and set configScrollRef.current.scrollTop and\npreviewScrollRef.current.scrollTop as before and clear pendingScrollRef.current,\nand update the reload trigger at the point where reloads are initiated so\nrestoration only runs for explicit reloads.\n```\n\n</details>\n\n---\n\n`172-178`: _💤 Low value_\n\n**Type assertion `as never` is a code smell.**\n\nThe `as never` cast on line 175 suppresses type checking entirely. This usually indicates a type mismatch between what `updateSpace` expects and what's being passed. Consider fixing the type definition or using a proper partial type.\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@src/app/components/file-mapping/FileMappingConfiguration.tsx` around lines\n172 - 178, The use of the `as never` cast in persistFilters masks a real type\nmismatch between what updateSpace expects and the object you're passing; remove\nthe `as never` and pass a correctly typed partial update (e.g., use the proper\nPartial/Update type for the space patch) to updateSpace so TypeScript can\nvalidate the shape — adjust updateSpace's parameter type or call signature if\nneeded so updateSpace(space.slug, { filters: next }) is correctly typed;\nreferences: persistFilters, updateSpace, setFilters, space.slug.\n```\n\n</details>\n\n</blockquote></details>\n\n</blockquote></details>\n\n<details>\n<summary>🤖 Prompt for all review comments with AI agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nInline comments:\nIn `@src/app/components/file-mapping/FileMappingConfigPanel.tsx`:\n- Around line 340-345: dropdownValue uses a string literal 'filename' for folder\nfallback which can mismatch the enum used by FOLDER_SOURCE_OPTIONS; change the\nfallback to the enum constant so the dropdown value matches the options.\nSpecifically, when computing dropdownValue (using mapping?.display_name_source\nand isFolder), replace the string 'filename' with Di