ramework RestResponseContext request identification correlation`\n\n💡 Result:\n\nCyberfabric is a modular Rust framework (cyberfabric-core on GitHub) for building enterprise SaaS services with ModKit, providing REST APIs, OpenAPI, observability, and structured logging/distributed tracing. No explicit mentions of \"RestResponseContext\" were found in available docs or crates.io pages. Request identification and correlation likely use ModKit's observability features (OTel tracing, structured logging) and SecurityContext (request-scoped context propagated via ClientHub and WithSecurityContext wrapper). Correlation IDs are standard in such systems for tracing requests across modules/services, typically extracted from headers (e.g., X-Correlation-ID) and injected into spans/logs via tracing context/baggage.\n\nCitations:\n\n- 1: https://github.com/cyberfabric/cyberfabric-core/blob/main/docs/ARCHITECTURE_MANIFEST.md\n- 2: https://github.com/cyberfabric/cyberfabric-core\n- 3: https://crates.io/crates/cf-modkit-http\n- 4: https://crates.io/crates/cf-modkit\n- 5: https://crates.io/crates/cf-modkit-sdk\n- 6: https://crates.io/crates/cf-modkit-security\n\n---\n\n🏁 Script executed:\n\n```shell\n# Search for test files related to PerformancePlugin\nfd -t f \".*test\\|.*spec\" | xargs grep -l \"PerformancePlugin\" 2>/dev/null\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 56\n\n---\n\n🏁 Script executed:\n\n```shell\n# Look for concurrent API usage patterns\nrg \"Promise\\.all|Promise\\.race|Promise\\.any\" src/app --context 2 | head -30\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 830\n\n---\n\n🏁 Script executed:\n\n```shell\n# Search for any request ID or correlation mechanisms in API services\nrg \"requestId|correlationId|traceId|x-request-id|x-correlation-id\" src/app --context 2\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 54\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check if there are multiple concurrent requests possible\nrg \"fetch|request|http.*concurrent|parallel\" src/app/api | head -20\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 799\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check how PerformancePlugin is registered\nrg \"PerformancePlugin\" src/app --context 5\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 2631\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check initApp.ts to see plugin registration\nfd -t f \"initApp.ts\" -exec cat {} \\;\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 260\n\n---\n\n🏁 Script executed:\n\n```shell\n# Verify if the plugin is global or per-service\nrg \"RestPlugin|registerPlugin|plugin\" src/app/main.tsx src/app/initApp.ts 2>/dev/null | head -30\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 434\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check RestResponseContext type to see if it has any request field\nrg \"interface RestResponseContext|type RestResponseContext\" . --context 10\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 54\n\n---\n\n🏁 Script executed:\n\n```shell\n# One more check - see if context carries any metadata across hooks\nrg \"context\\.\" src/app/api/PerformancePlugin.ts\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 295\n\n---\n\n\n\n</details>\n\n**Don't correlate request/response pairs with a global FIFO queue.**\n\nThis stays correct only if responses always arrive in request order. Since the codebase uses `Promise.all()` for concurrent requests, response B can finish before response A, causing `shift()` to pair B's response with A's `start`/`url`, so the recorded duration, status, URL, and payload size are all wrong. Use a request-specific identifier to pair timings instead; if `@cyberfabric/react` preserves custom metadata between hooks, attach the timing there, otherwise the correlation needs to move down to a layer where request and response are coupled.\n\nAlso 