          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Avoid dropping space enrichments due to a subscription race.**\n\n`loadSpaceEnrichments(space.slug)` is triggered immediately after selection, but this listener is scoped to `selectedSpace` and can still be bound to the previous value when the event arrives. That can silently discard a valid payload.\n\n \n\n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-import React, { useState, useEffect, useCallback, useMemo } from 'react';\n+import React, { useState, useEffect, useCallback, useMemo, useRef } from 'react';\n\n+const selectedSpaceSlugRef = useRef<string | null>(null);\n+useEffect(() => {\n+  selectedSpaceSlugRef.current = selectedSpace?.slug ?? null;\n+}, [selectedSpace?.slug]);\n\n useEffect(() => {\n   const loaded = eventBus.on('wiki/space-enrichments/loaded', (payload) => {\n-    if (!selectedSpace || payload.spaceSlug !== selectedSpace.slug) return;\n+    if (payload.spaceSlug !== selectedSpaceSlugRef.current) return;\n     setSpaceEnrichments(payload.enrichments ?? {});\n   });\n   const failed = eventBus.on('wiki/space-enrichments/error', (payload) => {\n-    if (!selectedSpace || payload.spaceSlug !== selectedSpace.slug) return;\n+    if (payload.spaceSlug !== selectedSpaceSlugRef.current) return;\n     setSpaceEnrichments({});\n   });\n   return () => {\n     loaded.unsubscribe();\n     failed.unsubscribe();\n   };\n-}, [selectedSpace]);\n+}, []);\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@src/app/pages/SpaceViewPage.tsx` around lines 124 - 150, The subscription\nhandlers for 'wiki/space-enrichments/loaded' and 'wiki/space-enrichments/error'\ncan race with the 'wiki/space/selected' listener because they compare\npayload.spaceSlug against the mutable selectedSpace state; fix by tracking the\ncurrently-requested space slug in a stable ref and comparing payload.spaceSlug\nto that ref instead of selectedSpace. Add a useRef like currentSpaceSlugRef, set\ncurrentSpaceSlugRef.current = space.slug inside the 'wiki/space/selected'\nhandler (where loadSpaceEnrichments(space.slug) is called), and update the two\nevent handlers to check payload.spaceSlug === currentSpaceSlugRef.current before\ncalling setSpaceEnrichments; this ensures responses from the earlier\nsubscription aren’t dropped or mistakenly applied to the wrong selection.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:hawk -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
