          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Cap the metrics store before both append paths.**\n\nThe rules/docs describe this as a ring buffer, but both `trackPerformance` and `pushMetric` append forever. With request-level instrumentation enabled, a long-lived session can grow this array without bound.\n\n\n\n\n<details>\n<summary>Suggested fix</summary>\n\n```diff\n const SLOW_THRESHOLD_MS = 1000;\n+const MAX_METRICS = 500;\n const metrics: PerformanceMetric[] = [];\n+\n+function appendMetric(metric: PerformanceMetric): void {\n+  metrics.push(metric);\n+  if (metrics.length > MAX_METRICS) {\n+    metrics.splice(0, metrics.length - MAX_METRICS);\n+  }\n+}\n ...\n-    metrics.push({\n+    appendMetric({\n       operation,\n       duration,\n       dataSize,\n       timestamp: startTimestamp,\n       url,\n     });\n ...\n export function pushMetric(metric: PerformanceMetric): void {\n   if (!perfLogEnabled) return;\n-  metrics.push(metric);\n+  appendMetric(metric);\n }\n```\n</details>\n\nBased on learnings, `.ai/rules/cyberwiki-front.md` defines this metrics store as a ring-buffer.\n\n\nAlso applies to: 117-119\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/lib/performanceTracker.ts` around lines 74 - 80, The metrics array is\nunbounded (metrics.push in pushMetric and the append path in trackPerformance),\nbut should behave as a ring buffer; introduce a RING_BUFFER_SIZE constant and\nenforce it in both pushMetric and trackPerformance: when adding a new metric, if\nmetrics.length < RING_BUFFER_SIZE push as before, otherwise either overwrite the\noldest entry using a tracked writeIndex (circular index) or remove the oldest\nentry (metrics.shift()) before pushing so the array never grows past\nRING_BUFFER_SIZE; update/initialize the writeIndex (or use length checks) in the\nsame module so both pushMetric and trackPerformance use the same bounded\nbehavior.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:2c1be9d8-3633-4c8e-86be-71ed738b9bd4 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
