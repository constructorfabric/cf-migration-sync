        "body": "The previous manualChunks() split routed react -> vendor-react, react-dom -> vendor-react-dom and left scheduler in the catch-all vendor chunk. react and react-dom both import scheduler, while other vendor modules import react, producing circular chunk deps:\r\n\r\n  vendor -> vendor-react -> vendor\r\n  vendor -> vendor-react -> vendor-react-dom -> vendor\r\n\r\nRollup still emits the bundles but with non-deterministic init order, so in production scheduler runs against a not-yet-initialized export object and crashes the SPA with:\r\n\r\n  Uncaught TypeError: Cannot set properties of undefined (setting 'unstable_now')\r\n\r\nFolding all three packages into a single vendor-react chunk removes the cycle (the React-runtime triangle is now intra-chunk) and the production build no longer warns about circular chunks.\n\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n\n## Summary by CodeRabbit\n\n* **Chores**\n  * Optimized the build bundling configuration to group core framework libraries more efficiently, potentially improving build consistency and performance.\n\n<!-- review_stack_entry_start -->\n\n[![Review Change Stack](https://storage.googleapis.com/coderabbit_public_assets/review-stack-in-coderabbit-ui.svg)](https://app.coderabbit.ai/change-stack/cyberfabric/cyber-wiki-front/pull/5?utm_source=github_walkthrough&utm_medium=github&utm_campaign=change_stack)\n\n<!-- review_stack_entry_end -->\n\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
