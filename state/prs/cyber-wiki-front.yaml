          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Theme detection is too narrow for the app’s dark themes.**\n\n`ThemeProvider.tsx` maps `dark`, `dracula`, and `dracula-large` to the `.dark` class, but this hook only treats `data-theme === 'dark'` as dark. Monaco will stay on the light theme for the other dark modes.\n\n<details>\n<summary>♻️ Suggested fix</summary>\n\n```diff\n function read(): MonacoTheme {\n-  return document.documentElement.getAttribute(THEME_ATTR) === 'dark'\n+  return document.documentElement.classList.contains('dark')\n     ? MonacoTheme.Dark\n     : MonacoTheme.Light;\n }\n```\n\n</details>\n\n<!-- suggestion_start -->\n\n<details>\n<summary>📝 Committable suggestion</summary>\n\n> ‼️ **IMPORTANT**\n> Carefully review the code before committing. Ensure that it accurately replaces the highlighted code, contains no missing lines, and has no issues with indentation. Thoroughly test & benchmark the code to ensure it meets the requirements.\n\n```suggestion\nfunction read(): MonacoTheme {\n  return document.documentElement.classList.contains('dark')\n    ? MonacoTheme.Dark\n    : MonacoTheme.Light;\n}\n```\n\n</details>\n\n<!-- suggestion_end -->\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/components/primitives/useMonacoTheme.ts` around lines 18 - 21, The\nread() function in useMonacoTheme.ts only treats THEME_ATTR === 'dark' as a dark\nmode, but ThemeProvider.tsx maps 'dark', 'dracula', and 'dracula-large' to the\n.dark class so Monaco stays light for those other dark themes; update read() to\ndetect dark mode by either checking\ndocument.documentElement.classList.contains('dark') or treating THEME_ATTR\nvalues 'dark', 'dracula', and 'dracula-large' as dark and return\nMonacoTheme.Dark in those cases (otherwise return MonacoTheme.Light), keeping\nreferences to THEME_ATTR and MonacoTheme.\n```\n\n</details>\n\n<!-- fin