          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _🏗️ Heavy lift_\n\n**Don’t reuse one PR result for every commit on the branch.**\n\n`buildCommitEntries()` keys `pr.create.auto` by `space_slug/branch_name` only, then applies that single PR outcome to every commit row on the branch. As soon as a branch has multiple commits or a retry, older rows can show the wrong badge and wrong available actions.\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/components/changes/RecentCommitsPanel.tsx` around lines 54 - 101, The\nbug is reusing a single branch-level PR result for every commit; change\nbuildCommitEntries to map pr.create.auto entries by the commit identifier (use\npayload.commit_sha) instead of space_slug/branch_name, then when iterating\ncommits look up the PR by the commit's payload.commit_sha (fall back to\nbranch-level lookup only if no commit-specific PR exists). Update the prByBranch\nvariable/name (e.g., prByCommit) and the lookup logic in the loop that builds\nCommitEntry objects so each commit gets the PR result that matches its\npayload.commit_sha (keep existing handling of status/message unchanged).\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:ocelot:69cc8c9f-9dce-4777-a210-6d8eaf9dd123 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
