          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**The seconds-vs-milliseconds heuristic misparses old millisecond timestamps.**\n\nA valid millisecond epoch like `915148800000` (`1999-01-01T00:00:00Z`) is `< 1e12`, so Line 30 multiplies it by `1000` and turns it into a far-future date. That will silently break older repo history and fixtures.\n \n\n<details>\n<summary>🛠️ Safer cutoff example</summary>\n\n```diff\n-    const ms = input < 1e12 ? input * 1000 : input;\n+    const ms = Math.abs(input) < 1e10 ? input * 1000 : input;\n```\n</details>\n\nIf you need to support truly ambiguous numeric inputs, making the unit explicit at call sites is even safer.\n\n<!-- suggestion_start -->\n\n<details>\n<summary>📝 Committable suggestion</summary>\n\n> ‼️ **IMPORTANT**\n> Carefully review the code before committing. Ensure that it accurately replaces the highlighted code, contains no missing lines, and has no issues with indentation. Thoroughly test & benchmark the code to ensure it meets the requirements.\n\n```suggestion\n  if (typeof input === 'number') {\n    const ms = Math.abs(input) < 1e10 ? input * 1000 : input;\n    const d = new Date(ms);\n    return Number.isNaN(d.getTime()) ? null : d;\n  }\n```\n\n</details>\n\n<!-- suggestion_end -->\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/lib/formatDate.ts` around lines 29 - 33, The numeric timestamp\nheuristic in formatDate (the number-handling branch) uses 1e12 and wrongly\ntreats valid millisecond timestamps like 915148800000 as seconds; change the\ncutoff to detect seconds vs milliseconds more reliably (for example: treat\nvalues with absolute magnitude < 1e11 as seconds and multiply by 1000, otherwise\ntreat as milliseconds), or alternatively detect by digit count using Math.abs\nand comparisons; update the numeric branch (the const ms = input < 1e12 ? input\n* 1000 : input; line) in formatDate.ts to use Math.abs(input) < 1e11 (or an\nequivalent digit-count check) before multiplying so old millisecond timestamps\nare not mis-parsed.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:ocelot:9bb449dd-1750-4bb2-9ca9-76c7b9c442b9 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
