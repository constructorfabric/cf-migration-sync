          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _🏗️ Heavy lift_\n\n**Track batch commit/discard progress per request, not with a single page-level state.**\n\n`handleCommitSelected()` fans out one `commitDrafts()` call per space and `handleDiscardSelected()` fans out one `discardDraft()` per id, but the subscriptions drop `busy` on the first `wiki/draft/committed`/`wiki/draft/discarded` event and keep only one `lastCommitPr`. In a multi-space batch, the UI can re-enable while other mutations are still in flight, and later commit responses overwrite the banner for earlier spaces, which hides partial failures and makes duplicate follow-up actions possible. Please either serialize the batch or track outstanding operations/results per space until the whole batch settles.  \n\n\nAlso applies to: 121-154, 250-269, 281-288\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/pages/ChangesPage.tsx` around lines 97 - 107, The current page-level\nstate lastCommitPr and the subscription handlers cause premature clearing of\nbusy and overwrite results when handleCommitSelected (which calls commitDrafts\nper space) or handleDiscardSelected (which calls discardDraft per id) launch\nmultiple concurrent requests; change to track progress/results per request key\ninstead: replace single lastCommitPr with a Map-like state (e.g.,\ncommitStatusBySpaceId/draftId) keyed by spaceId for commitDrafts and draftId for\ndiscardDraft, mark each entry busy when its request starts, update that entry on\nwiki/draft/committed and wiki/draft/discarded events, and only clear overall UI\nbusy when all map entries are settled (or serialize the batch by awaiting each\ncommitDrafts/discardDraft sequentially inside\nhandleCommitSelected/handleDiscardSelected); update any UI consumers to read\nfrom the per-key map so results and errors cannot be overwritten by later\nresponses.\n```\n\n</details>\n\n<!-