          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _🏗️ Heavy lift_\n\n**These row actions need the clicked row’s branch identifier.**\n\nHere `unstageBranch()` and `createPullRequest()` are called without a `branchId`, but the branch-specific flow in `ChangesTab` passes one. From this panel, “revert” / “retry PR” can only hit whatever branch the backend defaults to, not necessarily the commit row the user selected.\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/components/changes/RecentCommitsPanel.tsx` around lines 253 - 272,\nThe handlers handleRevert and handleRetryPr are calling unstageBranch() and\ncreatePullRequest() without the clicked row’s branch identifier so they act on a\nbackend default; update these handlers to pass the branch id from the commit row\n(e.g. use c.branchId or c.branch if that’s the property on the commit object)\nwhen calling unstageBranch(branchId) and createPullRequest({ spaceId, branchId\n}). If the handlers are shared, change their signatures to accept branchId (or\ncapture it in the closure when creating the menu for a row), and ensure the\ntarget functions’ typings match the new parameter.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:ocelot:69cc8c9f-9dce-4777-a210-6d8eaf9dd123 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
