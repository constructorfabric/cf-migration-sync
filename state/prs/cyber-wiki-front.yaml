        "body": "New features:\r\n- Add LogsPage with git-ops log and performance metrics panels\r\n- Add BlameView component (per-line git blame with commit-run collapsing)\r\n- Add GitOpsLogPanel and GitOpsLogApiService for commit/PR debugging\r\n- Add PerformancePlugin (REST plugin auto-recording API metrics)\r\n- Add useDebugMode hook driven by Profile toggle\r\n\r\nEnhancements:\r\n- FileViewer: blame view mode, inline commit dialog, post-commit PR banner\r\n- FileViewer: LCS-based draft change highlighting with CRLF normalization\r\n- EnrichmentPanel: Debug tab with GitOpsLogPanel (gated by debug mode)\r\n- ChangesPage: recent commits panel with PR status badges\r\n- Header: Logs link (debug-only), token health indicator\r\n- Menu: Changes and PRs nav items, space colors\r\n- ProfilePage: debug mode toggle, cache settings section\r\n- SpaceConfigurationPage: page_count column, filters/fork info\r\n- SpaceViewPage: file tree toggle, deep-link improvements\r\n\r\nInfrastructure:\r\n- Add .ai/ rules and commands (source of truth)\r\n- Add CI workflow (lint, type-check, test, arch:check)\r\n- Add pre-commit hooks config\r\n- Remove obsolete .github/copilot-commands/ and copilot-instructions.md\r\n- Add thin pointers for CLAUDE.md and Windsurf workflows\n\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n## Summary by CodeRabbit\n\n* **New Features**\n  * App-wide internationalization with English message catalog; Logs page, Git blame view, GitOps log viewer, recent-commits panel, Monaco-based editor/viewer, PR auto-creation with status banners and retry, performance metrics and debug toggle\n\n* **Bug Fixes**\n  * Improved error handling, localized fallback messages, and more robust upstream error detection\n\n* **Chores**\n  * Stricter CI/pre-commit checks and consolidated workflow/rules docs; unified modal primitive and editor dependency updates\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
