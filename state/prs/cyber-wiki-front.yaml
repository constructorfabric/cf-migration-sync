          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Include the repo’s other required checks before auto-committing.**\n\nThis workflow currently treats `lint` + `type-check` as sufficient, so an agent following it can still create a commit that fails `test`, `arch:check`, or the eslint-disable guard introduced in this PR.\n\n<details>\n<summary>Suggested update</summary>\n\n```diff\n-```bash\n-npm run lint && npm run type-check\n-```\n+```bash\n+npm run lint \\\n+  && npm run lint:check-disables \\\n+  && npm run type-check \\\n+  && npm run test \\\n+  && npm run arch:check\n+```\n\n **Required Checks:**\n - [ ] ESLint passes (no linting errors)\n+- [ ] ESLint disable guard passes\n - [ ] TypeScript compiles (no type errors)\n+- [ ] Tests pass\n+- [ ] Architecture checks pass\n - [ ] No console.log or debugger statements in production code\n - [ ] No hardcoded secrets or credentials\n```\n</details>\n\nBased on learnings, `.ai/commands/review-and-commit.md` is the reference workflow for the review-and-commit command.\n \n\n\nAlso applies to: 237-240\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn @.ai/commands/review-and-commit.md around lines 99 - 118, The Step 2\n“Validate Code Quality” workflow only runs npm run lint && npm run type-check\nand misses other repo-required checks; update the command sequence in the \"Step\n2: Validate Code Quality\" section to run the full set: include npm run\nlint:check-disables, npm run test, and npm run arch:check in the chain (so the\nagent will run lint -> lint:check-disables -> type-check -> test -> arch:check)\nand update the \"Required Checks\" checklist to add \"ESLint disable guard passes\",\n\"Tests pass\", and \"Architecture checks pass\"; also apply the same\nchecklist/command changes to the other occurrence referenced (lines ~237-240) so\nboth places enforce the same checks.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:ocelot:69cc8c9f-9dce-4777-a210-6d8eaf9dd123 -->\n\n<!-- d98c2f50 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commit 675d2e6",
