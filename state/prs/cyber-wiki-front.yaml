          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Only show the post-commit toast for commits started from this viewer.**\n\nThese global handlers react to every `wiki/draft/committed` / `wiki/pr/created` / `wiki/branch/error` event, so an unrelated commit elsewhere in the app can overwrite this file's banner. The retry path then calls `createPullRequest()` with whatever `spaceId` that external event last wrote.\n\n\n<details>\n<summary>Suggested fix</summary>\n\n```diff\n+  const awaitingInlineCommitRef = useRef(false);\n+\n   useEffect(() => {\n     const subs = [\n       eventBus.on('wiki/draft/committed', ({ pr, prError, prStatus, spaceId: committedSpaceId }) => {\n+        if (!awaitingInlineCommitRef.current) return;\n         setPostCommitToast({\n           status: prStatus ?? (pr ? PRStatus.Existing : PRStatus.NotAttempted),\n           url: pr?.prUrl ?? null,\n           error: prError ?? null,\n           spaceId: committedSpaceId,\n           retrying: false,\n         });\n       }),\n```\n\n```diff\n               onClick={() => {\n                 const message = trim(commitMessage);\n                 if (!message) return;\n+                awaitingInlineCommitRef.current = true;\n                 commitDrafts([draftId], message);\n                 setCommitOpen(false);\n               }}\n```\n\nClear the ref when the toast is dismissed or when the retry flow finishes.\n</details>\n\n\nAlso applies to: 595-599\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/components/file/FileViewer.tsx` around lines 434 - 460, The global\nevent handlers in the useEffect (the eventBus.on listeners) set post-commit\nstate for any commit in the app, allowing unrelated commits to overwrite this\nviewer's toast; modify the flow so handlers only update this viewer's toast when\nthe event originates from this viewer by adding a local identifier or token to\ncommits you start (e.g., set a viewerCommitId when invoking createPullRequest())\nand include that id in setPostCommitToast state, then in each listener\n(wiki/draft/committed, wiki/pr/created, wiki/branch/error) check the incoming\nevent's spaceId or commit id against the stored viewerCommitId before calling\nsetPostCommitToast; also clear/reset that viewerCommitId when the toast is\ndismissed or when the retry flow finishes to avoid stale matches.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:10e9f236-7cf6-40e0-93a7-c5585958fd56 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
