          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nThis PR adds space-level enrichments loading, extends file tree loading with optional filters, reengineers FileTree component capabilities, and substantially rewrites file mapping configuration UI with inheritance resolution and dual-tree preview support. New space-tree row renderers display enrichment metrics in wide/narrow modes, and SpaceViewPage integrates enrichments display alongside a new wide-tree sidebar mode visible when no file is open.\n\n## Changes\n\n**Space enrichments, tree filtering, and file mapping enhancements**\n\n| Layer / File(s) | Summary |\n|---|---|\n| **Space-level enrichments infrastructure** <br> `src/app/actions/enrichmentActions.ts`, `src/app/api/EnrichmentsApiService.ts`, `src/app/api/index.ts`, `src/app/api/wikiTypes.ts`, `src/app/events/enrichmentEvents.ts`, `src/app/effects/enrichmentEffects.ts` | New `loadSpaceEnrichments` action, `EnrichmentsApiService.getSpaceEnrichments` method, `SpaceEnrichmentsResponse` type mapping file paths to enrichment data, and effect handler that fetches and emits space enrichments keyed by `spaceSlug`. |\n| **File tree filtering support** <br> `src/app/actions/wikiActions.ts`, `src/app/events/wikiEvents.ts`, `src/app/effects/wikiEffects.ts` | `loadFileTree` action and event extended with optional `filters?: string[]` parameter; `wiki/tree/loaded` event now includes `mode` for proper routing; old `wiki/git-tree/load` event removed in favor of unified backend-driven tree loading. |\n| **FileTree component expansion and styling** <br> `src/app/components/file/FileTree.tsx` | FileTree now supports controlled expansion via `expandedPaths` prop, per-row styling via `getRowClassName` callback, and raw vs. mapped name display via `useRawNames` flag; compareNodes and node rendering updated to respect these configurations. |\n| **File mapping configuration rewrite** <br> `src/app/api/wikiTypes.ts`, `src/app/components/file-mapping/FileMappingConfigPanel.tsx`, `src/app/components/file-mapping/FileMappingConfiguration.tsx`, `src/app/components/file-mapping/FileMappingPreview.tsx` | `FileMappingCreate` makes `display_name_source` optional/nullable with inherited-from-parent semantics and adds optional `children_display_name_source`; FileMappingConfigPanel completely rewritten to compute effective source/visibility/children-source via inheritance resolver, render rich per-row controls (source dropdown, for-children dropdown, custom-name input, inheritance badge), and lazy-load subfolders; FileMappingConfiguration maintains separate dev and document trees with subtree splicing and scroll-position preservation; FileMappingPreview refactored to receive `viewMode` from parent. |\n| **Space tree row renderers for enrichments display** <br> `src/app/components/space/spaceTreeRowExtras.tsx` | New module exports `renderNarrowRow` (compact badges for comments/PRs/drafts on non-directories) and `renderWideRow` (expanded metrics including comment count, PR numbers, local changes, edits, commits, formatted file size, and draft marker), both keyed by `node.path` in `spaceEnrichments`. |\n| **SpaceTree and SpaceViewPage integration** <br> `src/app/components/space/SpaceTree.tsx`, `src/app/pages/SpaceViewPage.tsx` | SpaceTree gains optional `filters` prop with effect to load filtered trees; SpaceViewPage tracks `spaceEnrichments` state, loads enrichments on space selection, implements wide-tree sidebar mode (with wide header/row renderers and FileTree) when no file is open, lazy-loads subtrees via `loadFileTree` with `path` and `filters`, and reloads tree on view-mode changes with filters. |\n| **Localization strings** <br> `src/app/locales/en.json` | Added translation keys for file mapping preview column label, file mapping config panel inheritance/status display, custom-name placeholder, children-source dropdown label, and space-view tree metrics (comments, PRs, local changes, edits, commits, size column). |\n\n## Estimated code review effort\n\n🎯 4 (Complex) | ⏱️ ~75 minutes\n\n## Suggested reviewers\n\n- Mitriyweb\n- Artifizer\n\n> 🐰 A rabbit's tale of nested folders and enriched views,  \n> Where filters bloom and mappings find their truths,  \n> Wide trees dance in columns bright with counts,  \n> While space-wide gems adorn each file path found,  \n> Inheritance resolved—a nested work of art! ✨\n\n</details>\n\n<!-- walkthrough_end -->\n<!-- pre_merge_checks_walkthrough_start -->\n\n<details>\n<summary>🚥 Pre-merge checks | ✅ 3 | ❌ 2</summary>\n\n### ❌ Failed checks (1 warning, 1 inconclusive)\n\n|     Check name     | Status         | Explanation                                                                                                                                                                                                                                                    | Resolution                                                                                                                                                                                                                        |\n| :----------------: | :------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| Docstring Coverage | ⚠️ Warning     | Docstring coverage is 0.00% which is insufficient. The required threshold is 80.00%.                                                                                                                                                                           | Write docstrings for the functions missing them to satisfy the coverage threshold.                                                                                                                                                |\n|     Title check    | ❓ Inconclusive | The title is vague and does not clearly convey the scope of changes. 'Dialog fix' and 'misc improvement' are non-descriptive terms that don't meaningfully summarize the extensive refactoring and new features added across multiple components and services. | Consider a more specific title that highlights the main changes, such as 'Add space-level enrichments support and refactor FileMappingConfiguration UI' or similar, to better reflect the substantial scope of this pull request. |\n\n<details>\n<summary>✅ Passed checks (3 passed)</summary>\n\n|         Check name         | Status   | Explanation                                                              |\n| :------------------------: | :------- | :----------------------------------------------------------------------- |\n|      Description Check     | ✅ Passed | Check skipped - CodeRabbit’s high-level summary is enabled.              |\n|     Linked Issues check    | ✅ Passed | Check skipped because no linked issues were found for this pull request. |\n| Out of Scope Changes check | ✅ Passed | Check skipped because no linked issues were found for this pull request. |\n\n</details>\n\n<sub>✏️ Tip: You can configure your own custom pre-merge checks in the settings.</sub>\n\n</details>\n\n<!-- pre_merge_checks_walkthrough_end -->\n<!-- tips_start -->\n\n---\n\n\n\n\n<sub>Comment `@coderabbitai help` to get the list of available commands and usage tips.</sub>\n\n<!-- tips_end -->\n<!-- internal state start -->\n\n\n<!--  -->\n\n<!-- internal state end -->",
