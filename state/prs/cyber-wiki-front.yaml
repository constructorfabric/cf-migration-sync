          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**Avoid re-fetch loops after unsupported or failed blame loads.**\n\nThis effect only stops once `blame.length > 0`, so `supported=false` responses and error responses immediately retrigger `loadBlame()` on the next render. That turns an unsupported repo or transient failure into a tight request loop.\n\n\n<details>\n<summary>Suggested fix</summary>\n\n```diff\n+  const [blameRequested, setBlameRequested] = useState(false);\n+\n   useEffect(() => {\n     if (viewMode !== FileViewMode.Blame) return;\n     if (!space) return;\n-    if (blame.length > 0 || blameLoading) return;\n+    if (blameRequested || blameLoading) return;\n+    setBlameRequested(true);\n     setBlameLoading(true);\n     setBlameError(null);\n     loadBlame(space, filePath);\n-  }, [viewMode, space, filePath, blame.length, blameLoading]);\n+  }, [viewMode, space, filePath, blameRequested, blameLoading]);\n```\n\nAlso reset `blameRequested` in the file-change reset effect.\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:10e9f236-7cf6-40e0-93a7-c5585958fd56 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
