          "body": "_⚠️ Potential issue_ | _🟠 Major_ | _⚡ Quick win_\n\n**New anti-pattern guidance contradicts unchanged content in the same file.**\n\nThe new \"Where Model Selection Actually Lives\" section correctly explains that putting model selection instructions in `CLAUDE.md` is an anti-pattern (Lines 172, 221–222). However, two unchanged passages in this same file directly contradict this:\n\n- **Line 471** (Cost Audit, score 3): `\"Model selection encoded in CLAUDE.md\"` is described as a positive score-3 criterion.\n- **Lines 491, 494** (Exercise): the reader is instructed to add a `## Model Selection Guidelines` section to `CLAUDE.md`, and the artifact is defined as \"CLAUDE.md with... model selection guidelines.\"\n\nA reader who follows the chapter in sequence will read the anti-pattern warning at line 221, then reach line 471 describing the same practice as *good*, then at line 491 be asked to do the very thing called an anti-pattern.\n\nThe minimal fix is to update the audit score-3 label and the exercise step/artifact to align with the new guidance — e.g., direct model selection to skill/subagent frontmatter and the team README instead.\n\n \n\n<details>\n<summary>✏️ Suggested fixes</summary>\n\n**Line 471 — audit score 3:**\n```diff\n-<span class=\"audit-label\">All caching patterns applied. Model selection encoded in CLAUDE.md. Monthly cost reviews. Cache hit rate above 70%.</span>\n+<span class=\"audit-label\">All caching patterns applied. Model selection declared in skill/subagent frontmatter (<code>model:</code> field); human cheat-sheet in README. Monthly cost reviews. Cache hit rate above 70%.</span>\n```\n\n**Line 491 — exercise step 4:**\n```diff\n-<li>Add a \"## Model Selection Guidelines\" section with per-task-type recommendations</li>\n+<li>For each architecture/review skill, add a <code>model: claude-opus-4-7</code> (or appropriate model) field to its frontmatter; add a short model-selection cheat-sheet to <code>README.md</code> (not CLAUDE.md) for developers</li>\n```\n\n**Line 494 — artifact description:**\n```diff\n-<p><strong>Artifact:</strong> Caching-optimized CLAUDE.md with stable-first ordering and model selection guidelines.</p>\n+<p><strong>Artifact:</strong> Caching-optimized CLAUDE.md with stable-first ordering; model selection encoded in skill frontmatter and README.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@AI-Engineering/chapters/10-cost-engineering.html` around lines 170 - 222,\nUpdate the contradictory audit and exercise text so it matches the new \"Where\nModel Selection Actually Lives\" guidance: replace the audit label \"Model\nselection encoded in CLAUDE.md\" with a positive criterion that recommends\nencoding model choices in skill/subagent frontmatter or a team README\n(referencing the phrase \"Model selection encoded in CLAUDE.md\"), change the\nexercise step that asks readers to add \"## Model Selection Guidelines\" to\nCLAUDE.md to instead instruct them to add a brief team-facing model pick note to\nthe README and to set model: frontmatter on relevant skills/subagents (update\nthe exercise step text that mentions \"## Model Selection Guidelines\"), and\nupdate the artifact description that currently says \"CLAUDE.md with... model\nselection guidelines\" to say \"team README note + skills/subagents with model:\nfrontmatter\" (replace the artifact phrase mentioning CLAUDE.md).\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:churro:1c6390da-32cd-464c-b8c7-7cb222177bf5 -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commit 9d248db",
