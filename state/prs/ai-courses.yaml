          "diff_hunk": "@@ -0,0 +1,429 @@\n+<!DOCTYPE html>\n+<html lang=\"en\">\n+<head>\n+  <meta charset=\"UTF-8\">\n+  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n+  <title>Chapter 7: Pressure-Testing Your Spec &mdash; Spec Craft With AI</title>\n+  <link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>\">\n+  <link rel=\"stylesheet\" href=\"assets/style.css\">\n+</head>\n+<body>\n+\n+  <nav class=\"top-nav\">\n+    <span class=\"nav-title\">Spec Craft With AI</span>\n+    <div class=\"nav-links\">\n+      <a href=\"../../index.html\">Home</a>\n+      <a href=\"index.html\">Contents</a>\n+      <a href=\"06-acceptance-criteria.html\">&larr; Prev</a>\n+      <a href=\"08-seven-smell-tests.html\">Next &rarr;</a>\n+      <a href=\"maps/07-pressure-testing-map.html\">🧠 Map</a>\n+      <button class=\"theme-toggle\" aria-label=\"Toggle theme\">🌙</button>\n+    </div>\n+  </nav>\n+\n+  <header class=\"chapter-header\">\n+    <div class=\"chapter-number\">Chapter 7</div>\n+    <h1>Pressure-Testing Your Spec</h1>\n+    <p class=\"subtitle\">Be your own toughest reviewer before engineering is. Use AI to wear six different hats &mdash; engineer, designer, legal, support, security, finance &mdash; and find the holes while the spec is still cheap to change.</p>\n+  </header>\n+\n+  <main>\n+\n+    <h2>The cheapest review pass you&rsquo;ll ever run</h2>\n+\n+    <p>You closed chapter 6 with a clean Acceptance Criteria section, a triaged edge-case list, and a Definition of Done the team agreed to. The spec is, on paper, in good shape. The version on your screen could be shared right now and would survive a polite reading. That&rsquo;s the moment to stop and not share it yet.</p>\n+\n+    <p>Every spec ships through the same gauntlet. An engineer reads it and asks what happens at the edges. A designer reads it and asks where the empty state lives. Legal reads it and asks where the data goes. Support reads it and asks who picks up the phone when the flow breaks. You can meet that gauntlet in a one-hour review with seven people in a room, or you can simulate most of it in twenty minutes with an AI tool the night before. The simulated pass won&rsquo;t catch everything. It will catch enough that the real review becomes a conversation about substance, not a scramble to patch obvious holes.</p>\n+\n+    <p>That&rsquo;s pressure-testing. It&rsquo;s the cheapest review pass you&rsquo;ll ever run, and it&rsquo;s entirely yours &mdash; no calendars to coordinate, no apologies for taking people&rsquo;s time, no ego on the line because no one else has read the draft yet. The whole point is that mistakes are private here. You find them, you fix them, and the version that lands in your team&rsquo;s inbox is already a draft or two better than the one you would have sent.</p>\n+\n+    <h2>Why this earns trust with engineering</h2>\n+\n+    <p>Engineers can tell, almost on the first paragraph, whether a spec has been pressure-tested. The signal is small &mdash; assumptions are named explicitly, the unhappy paths get airtime, the risk section has actual risks instead of placeholders. The signal isn&rsquo;t that the spec is perfect. It&rsquo;s that someone tried to break it before sending it. That signal does most of the work in the first ten minutes of a review.</p>\n+\n+    <p>The opposite signal is also easy to spot. A spec that hasn&rsquo;t been pressure-tested reads as a happy-path narrative with the word &ldquo;robust&rdquo; sprinkled near the end. Engineering reads that, files the questions in their head, and either burns review time surfacing them in writing or quietly builds around them. Either way, you pay for the missing pass &mdash; in trust, in cycle time, or in scope creep at the worst moment.</p>\n+\n+    <p>Doing the pressure-test pass yourself, with AI as the reviewer, flips the dynamic. You arrive at engineering review with a list of the holes you already found, the ones you decided to leave open, and the reasons. That&rsquo;s a meeting that runs short.</p>\n+\n+    <h2>What pressure-testing isn&rsquo;t</h2>\n+\n+    <p>It&rsquo;s easy to confuse pressure-testing with two adjacent activities, both useful but different. Pressure-testing is not <em>polishing</em>: you&rsquo;re not asking AI to tighten the prose, fix typos, or improve the headings. Polishing is a separate pass that comes later, and the prompt for it looks completely different. Asking a polish prompt to do a pressure-test gives you a beautifully worded spec with the same holes it had before.</p>\n+\n+    <p>It&rsquo;s also not a <em>scope review</em>. Scope reviews ask &ldquo;is this the right thing to build?&rdquo; Pressure-testing assumes you&rsquo;ve already answered that question and asks &ldquo;will this thing, as written, survive contact with the team and the user?&rdquo; Mixing the two muddles the output: every reviewer hat will start drifting into &ldquo;maybe you shouldn&rsquo;t build this at all&rdquo; mode, which is a fair question for a different conversation.</p>\n+\n+    <p>The cleanest way to keep pressure-testing focused is to say so in the prompt: <em>&ldquo;Assume the decision to build this has been made. Don&rsquo;t question scope. Find what&rsquo;s missing, risky, or underspecified <strong>about the spec as written</strong>.&rdquo;</em> Two sentences of framing, much less drift in the output.</p>\n+\n+    <h2>The cast of reviewers</h2>\n+\n+    <p>Pressure-testing works because real specs get reviewed by people with very different jobs. AI is happy to play any of them, one at a time, if you tell it which hat to put on. Six roles cover most products. Not every spec needs all six &mdash; pick the three or four that map to your domain.</p>\n+\n+    <div class=\"tool-card\">\n+      <div class=\"tool-icon\">🛠️</div>\n+      <div class=\"tool-info\">\n+        <div class=\"tool-name\">Senior engineer</div>\n+        <div class=\"tool-desc\">Sniffs for state machines, race conditions, missing error handling, scope hidden behind innocent verbs (&ldquo;sync&rdquo;, &ldquo;refresh&rdquo;, &ldquo;just&rdquo;).</div>\n+      </div>\n+    </div>\n+\n+    <div class=\"tool-card\">\n+      <div class=\"tool-icon\">🎨</div>\n+      <div class=\"tool-info\">\n+        <div class=\"tool-name\">Designer</div>\n+        <div class=\"tool-desc\">Sniffs for empty states, error states, mid-flow interruptions, mobile vs. desktop differences, accessibility gaps.</div>\n+      </div>\n+    </div>\n+\n+    <div class=\"tool-card\">\n+      <div class=\"tool-icon\">⚖️</div>\n+      <div class=\"tool-info\">\n+        <div class=\"tool-name\">Legal &amp; compliance</div>\n+        <div class=\"tool-desc\">Sniffs for personal data flows, cross-tenant leakage, consent prompts, retention rules, terms-of-service implications.</div>\n+      </div>\n+    </div>\n+\n+    <div class=\"tool-card\">\n+      <div class=\"tool-icon\">🎧</div>\n+      <div class=\"tool-info\">\n+        <div class=\"tool-name\">Customer support</div>\n+        <div class=\"tool-desc\">Sniffs for unrecoverable states, who picks up the phone, what the macro will say, how to undo a wrong action.</div>\n+      </div>\n+    </div>\n+\n+    <div class=\"tool-card\">\n+      <div class=\"tool-icon\">🔐</div>\n+      <div class=\"tool-info\">\n+        <div class=\"tool-name\">Security</div>\n+        <div class=\"tool-desc\">Sniffs for token expiry, permission escalation, replay risk, who can see what, what happens when an account is compromised.</div>\n+      </div>\n+    </div>\n+\n+    <div class=\"tool-card\">\n+      <div class=\"tool-icon\">💰</div>\n+      <div class=\"tool-info\">\n+        <div class=\"tool-name\">Finance &amp; ops</div>\n+        <div class=\"tool-desc\">Sniffs for billing edges, refund paths, seat-count drift, currency rounding, what shows up on the invoice.</div>\n+      </div>\n+    </div>\n+\n+    <p>Each role is a lens, not a person. Even if your team has no dedicated legal or finance reviewer, the lens still finds things, because the lens is a different question shape, not a different mood.</p>\n+\n+    <h2>The shape of a red-team prompt</h2>\n+\n+    <p>A working reviewer prompt has four ingredients: a clear role, a clear job (not just &ldquo;review this&rdquo;), the spec itself as input, and an output shape that&rsquo;s easier to triage than free-form prose. The same four-part shape works in Claude, ChatGPT, Gemini, Copilot Chat, or anything else. Vary the wording; keep the structure.</p>\n+\n+    <div class=\"comparison\">\n+      <div class=\"prompt-example bad\">\n+        <div class=\"prompt-label\">Underspecified</div>\n+        <p>&ldquo;Review this spec and tell me what&rsquo;s wrong.&rdquo;</p>\n+      </div>\n+      <div class=\"prompt-example good\">\n+        <div class=\"prompt-label\">Pressure-test ready</div>\n+        <p>&ldquo;You&rsquo;re a senior backend engineer at a SaaS company. Read this spec for a workspace invitation flow. Give me three lists: <em>what&rsquo;s missing</em> (questions an engineer would ask before estimating), <em>what&rsquo;s risky</em> (assumptions that look fragile), and <em>what&rsquo;s underspecified</em> (sentences that could justify two different builds). Be specific. Quote the line you&rsquo;re reacting to. No general advice.&rdquo;</p>\n+      </div>\n+    </div>\n+\n+    <p>The underspecified version produces a polite, generic critique that blends &ldquo;you should add a metrics section&rdquo; with &ldquo;what about accessibility?&rdquo; with &ldquo;consider performance.&rdquo; It&rsquo;s not wrong; it&rsquo;s not actionable. The pressure-test version produces a list of questions tied to specific lines, which is something you can either fix or consciously defer.</p>\n+\n+    <p>One more rule that earns its keep: ask for the AI to <em>quote the line it&rsquo;s reacting to</em>. That single instruction turns vague feedback into traceable feedback, and it makes the next step &mdash; converting findings into edits &mdash; almost mechanical.</p>\n+\n+    <h2>Reviewers in sequence: a worked example</h2>\n+\n+    <p>Let&rsquo;s walk through a small spec under three different reviewer hats, back-to-back. The product is a feature that lets workspace admins invite new members by email. The PRD is roughly one page. We&rsquo;ll use Gemini for this run, but the same dialogue would unfold in Claude or ChatGPT with no changes.</p>\n+\n+    <div class=\"dialogue-box\">\n+      <div class=\"dialogue-pm\">You&rsquo;re a senior backend engineer at a B2B SaaS. Here&rsquo;s the workspace invitation spec [pasted]. Give me three lists: missing, risky, underspecified. Quote the line you&rsquo;re reacting to. No general advice.</div>\n+      <div class=\"dialogue-ai\">Missing: (1) &ldquo;Invite expires after a reasonable period&rdquo; &mdash; what counts as reasonable? Hours? Days? (2) Nothing on what happens if the same email is invited twice. (3) No mention of rate limits on the invite endpoint. Risky: (4) &ldquo;The invitee accepts and is added to the workspace&rdquo; assumes the invitee already has an account &mdash; what about new sign-ups via invite? (5) The role assigned at acceptance is implied to be &ldquo;Member&rdquo; but never stated. Underspecified: (6) &ldquo;Admin can revoke an invite&rdquo; &mdash; revoke before acceptance, after, or both?</div>\n+      <div class=\"dialogue-pm\">Good. Same spec. Now you&rsquo;re a legal &amp; compliance reviewer at a company subject to GDPR. Same three lists. Same rule: quote the line.</div>\n+      <div class=\"dialogue-ai\">Missing: (1) Nothing about consent &mdash; the invitee&rsquo;s email is processed without their prior knowledge. (2) No retention policy on pending invites. Risky: (3) &ldquo;Invite includes the inviter&rsquo;s name and workspace name&rdquo; &mdash; if the invite is sent to a wrong address, you&rsquo;ve disclosed company affiliation to a stranger. (4) No mention of data residency for invitee email storage. Underspecified: (5) &ldquo;Audit logs are kept&rdquo; &mdash; for how long, accessible to whom?</div>\n+      <div class=\"dialogue-pm\">Now: customer support lead. You&rsquo;ve been on the support desk for five years. Same three lists.</div>\n+      <div class=\"dialogue-ai\">Missing: (1) No story for &ldquo;I never got the email.&rdquo; Resend? Check spam? Generate a link to share manually? (2) Nothing on lockout: if the only admin loses access, can support recover the workspace? Risky: (3) &ldquo;Invite link is single-use&rdquo; &mdash; a frequent support ticket will be &ldquo;I clicked the link from my work computer to preview, then tried on phone and it was dead.&rdquo; Underspecified: (4) &ldquo;Members can be removed&rdquo; &mdash; does the removed person see anything? Get an email? Lose their drafts?</div>\n+      <div class=\"dialogue-pm\">One more hat: security engineer at a company that&rsquo;s had one breach already this year. Same three lists.</div>\n+      <div class=\"dialogue-ai\">Missing: (1) No mention of token format, length, or entropy &mdash; the spec just says &ldquo;invite link.&rdquo; (2) Nothing on what happens if an invite is accepted from an unexpected IP or geography. Risky: (3) &ldquo;Invite includes a link the user clicks to accept&rdquo; &mdash; phishing payload, indistinguishable from a real one to an automated email scanner. (4) Pending invites tied to email but not to device; a stolen mailbox grants workspace access. Underspecified: (5) &ldquo;Audit log records acceptances&rdquo; &mdash; does it record failed acceptance attempts too? That&rsquo;s the signal you actually want.</div>\n+      <div class=\"dialogue-pm\">Combine all four passes. Give me a deduped list of the top eight findings, ranked by &ldquo;how badly does this hurt if we ship without addressing it.&rdquo;</div>\n+      <div class=\"dialogue-ai\">[returns ranked list]</div>\n+    </div>",
