          "diff_hunk": "@@ -306,6 +306,11 @@ <h3>Defending Against Prompt Injection</h3>\n       Prompt injection defenses are not foolproof. The LLM fundamentally treats all text as potential instructions. The rules above make attacks harder but not impossible. This is why the <strong>approval-required permission model</strong> is your real safety net &mdash; even if the agent gets confused by injected text, it still can't take dangerous actions without your explicit confirmation.\n     </div>\n \n+    <div class=\"privacy-box\">\n+      <h3>Developer Workflow Analogy</h3>\n+      <p>In developer tools, <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>'s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/skills/cypilot/SKILL.md\" target=\"_blank\">agent-safe invocation rules</a> use explicit confirmation gates before write-capable actions. Your personal agent needs the same shape: read-only by default, approval before changing the world, and logs that show what happened.</p>\n+    </div>",
