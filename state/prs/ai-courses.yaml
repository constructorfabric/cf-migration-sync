t or changing it to an in-scope link\n(e.g., a relative chapter-level link) and ensure the remaining links (e.g., the\nactive \"Contents\" anchor) continue to render correctly.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:hawk:c8b0c83b-e3a7-44c1-83b9-588f39d7042f -->\n\n<!-- 4e71b3a2 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
