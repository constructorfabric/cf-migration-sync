          "diff_hunk": "@@ -0,0 +1,407 @@\n+<!DOCTYPE html>\n+<html lang=\"en\">\n+<head>\n+  <meta charset=\"UTF-8\">\n+  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n+  <title>Chapter 2: The Driving Seat &mdash; Spec Craft With AI</title>\n+  <link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>\">\n+  <link rel=\"stylesheet\" href=\"assets/style.css\">\n+</head>\n+<body>\n+\n+  <nav class=\"top-nav\">\n+    <span class=\"nav-title\">Spec Craft With AI</span>\n+    <div class=\"nav-links\">\n+      <a href=\"../../index.html\">Home</a>\n+      <a href=\"index.html\">Contents</a>\n+      <a href=\"01-pm-in-2026.html\">&larr; Prev</a>\n+      <a href=\"03-fuzzy-to-sharp.html\">Next &rarr;</a>\n+      <a href=\"maps/02-the-driving-seat-map.html\">🧠 Map</a>\n+      <button class=\"theme-toggle\" aria-label=\"Toggle theme\">🌙</button>\n+    </div>\n+  </nav>\n+\n+  <header class=\"chapter-header\">\n+    <div class=\"chapter-number\">Chapter 2</div>\n+    <h1>The Driving Seat: 5 Decisions Only You Make</h1>\n+    <p class=\"subtitle\">Problem, user, scope, success, ship &mdash; the irreducible PM decisions, and how to use AI as a sounding board for each without quietly handing the wheel over.</p>\n+  </header>\n+\n+  <main>\n+\n+    <h2>The polished spec that decides nothing</h2>\n+\n+    <p>Picture this. It's a Wednesday afternoon. You have forty-five minutes before your next meeting, and a half-formed feature idea in your head: \"we should let teams export their dashboards.\" You open Claude in a fresh tab, type a one-line prompt, and ask for a draft PRD.</p>\n+\n+    <p>Eight seconds later you have something genuinely impressive. Headings, user stories, acceptance criteria, even a small risks section. It looks like a spec. You feel productive. You almost paste it into the ticket.</p>\n+\n+    <p>Then you stop, because you notice something. The draft assumes a user persona you never picked. It assumes an export format you never decided on. It assumes success means \"users can export\" &mdash; not \"support tickets about manual screenshots drop by half.\" None of those calls were yours. The draft <em>looks</em> like a spec, but the actual decisions are still missing.</p>\n+\n+    <p>That gap &mdash; between something that reads like a spec and something that <em>is</em> a spec &mdash; is the entire subject of this chapter. We're going to name the five decisions that make a spec real. Not as a checklist to memorize, but as the thing you steer the AI around.</p>\n+\n+    <h2>Decisions before prompts</h2>\n+\n+    <p>A useful habit: before you open any AI tool to draft, expand, or summarize anything spec-shaped, you can say in one sentence what call you're about to make. Not what you're going to write &mdash; what you're going to <em>decide</em>.</p>\n+\n+    <p>Think of it like asking someone for directions. If you don't know your destination, no one &mdash; human or AI &mdash; can help you get there. They'll just produce plausible-sounding routes to nowhere in particular. The AI is brilliant at producing the route. You name the destination.</p>\n+\n+    <p>The five decisions below show up in every spec, in every product, in every team. AI tools can help you think about each of them. None of them can take any of these decisions for you &mdash; not because the technology isn't good enough, but because of what these decisions <em>are</em>. They commit you to something. They create accountability. That accountability is the thing you signed up for when you took the role.</p>\n+\n+    <div class=\"tip-box\">\n+      A small reframing helps when the deadline is breathing on your neck. The five decisions don't all need long answers &mdash; they need <em>any</em> answer. A two-sentence pass on each beats a thirty-minute pass on one and a blank on the other four. You're not writing a treatise; you're putting a stake in the ground for each decision so the AI has something to build around. Deeper work happens later, in chapters 3 through 7.\n+    </div>\n+\n+    <h2>Decision 1: Is this problem worth solving?</h2>\n+\n+    <p>Of all the problems your users have, of all the things your competitors are doing, of all the ideas in your backlog &mdash; which one earns a slice of your team's quarter? That's the decision.</p>\n+\n+    <p>AI tools are excellent at <em>listing</em> problems. Ask ChatGPT for ten things that might be wrong with your onboarding flow, and you'll get ten plausible candidates in seconds. Most of them will sound reasonable. A few will be sharp. One or two will be irrelevant to your actual product reality. The list is not the decision. Picking which one your team will sweat over for the next six weeks &mdash; that's the decision.</p>\n+\n+    <p>What helps: bring the AI candidates, not consequences. Treat the list as raw material. Then ask the AI to stress-test the candidate <em>you're already leaning toward</em>. That conversation is useful. Asking the AI to \"pick the most important one\" is not, because the AI doesn't know your roadmap, your CEO's anxieties, your team's last incident, or your ARR concentration.</p>\n+\n+    <div class=\"dialogue-box\">\n+      <div class=\"dialogue-pm\">\n+        I'm choosing between three problems for next quarter: (1) admins can't bulk-invite users, (2) reports take 30+ seconds to load on large workspaces, (3) we have no audit log for compliance customers. Which one would you push back on me investing in, and why?\n+      </div>\n+      <div class=\"dialogue-ai\">\n+        Happy to push back. The bulk-invite problem feels small &mdash; admins likely solve it once during onboarding, then never think about it. The report-load problem affects daily usage but you've already shipped two perf improvements this year and may be hitting diminishing returns. The audit-log gap is the one I'd push you to interrogate hardest: it's binary (you either have it or you don't), it unblocks specific deals, and the cost is mostly known. So my pushback is on (1). What's making you consider it?\n+      </div>\n+      <div class=\"dialogue-pm\">\n+        Honestly, recency bias &mdash; three customers complained last week. But you're right, we'd build it once and they'd forget about it. Audit log it is. Help me write the problem statement for that one.\n+      </div>\n+    </div>\n+\n+    <p>Notice what the AI did and didn't do. It compared, it pushed back, it asked a follow-up. It did not say \"go build the audit log.\" The PM made that call. The AI was a sounding board for a decision the PM was already orbiting.</p>\n+\n+    <div class=\"driver-box\">\n+      <strong>Yours to decide:</strong> which of the candidates is worth a quarter of your team's time. AI can rank them on stated criteria. Only you carry the weight of the consequences.\n+    </div>",
