ll-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@AI-Workflow/chapters/03-custom-skills.html` at line 360, The two anchor\nelements in the paragraph that use target=\"_blank\" (the links to \"Cyber\nConstructor\" and to \"kit management\") must be hardened against tabnabbing by\nadding rel=\"noopener noreferrer\" to each; update the <a> tags that currently\ninclude target=\"_blank\" so they also include rel=\"noopener noreferrer\" to ensure\nopened pages cannot access window.opener.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>PM-SpecCraft/chapters/06-acceptance-criteria.html-270-270 (1)</summary><blockquote>\n\n`270-270`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Harden `_blank` links in the new tip-box.**\n\nLine 270 has external links with `target=\"_blank\"` but no `rel=\"noopener noreferrer\"`.\n \n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-      <strong>Engineering-side proof:</strong> Some teams pair a DoD with deterministic checks, so the standing bar is not only remembered but actually run. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>'s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/traceability-validation.md\" target=\"_blank\">validation model</a> is one example: it can check configured artifact structure, links, IDs, and traceability, while the PM still owns whether the AC describe the right product outcome.\n+      <strong>Engineering-side proof:</strong> Some teams pair a DoD with deterministic checks, so the standing bar is not only remembered but actually run. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>'s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/traceability-validation.md\" target=\"_blank\" rel=\"noopener noreferrer\">validation model</a> is one example: it can check configured artifact structure, links, IDs, and traceability, while the PM still owns whether the AC describe the right product outcome.\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@PM-SpecCraft/chapters/06-acceptance-criteria.html` at line 270, The two\nanchor elements that open external sites with target=\"_blank\" (\"Cyber\nConstructor\" and the \"validation model\" link) are missing the rel attribute;\nupdate those <a> tags to include rel=\"noopener noreferrer\" (i.e., add\nrel=\"noopener noreferrer\" to the anchor elements around the Cyber Constructor\nand validation model links) to harden the links against window.opener security\nand performance issues.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>PM-SpecCraft/chapters/05-writing-the-prd.html-73-73 (1)</summary><blockquote>\n\n`73-73`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Add `rel=\"noopener noreferrer\"` to external links opened with `target=\"_blank\"`.**\n\nLine 73 opens external pages in a new tab without `rel`, which leaves a reverse-tabnabbing surface.\n \n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-      <p><strong>When the PRD needs a stronger backbone:</strong> Some teams wrap this outline in a file-backed delivery system so requirements, design notes, plans, and validation results stay visible in the repo. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/README.md\" target=\"_blank\">repo-attached delivery model</a> is one example; treat it as team process around the PRD, not a replacement for the product calls you own.</p>\n+      <p><strong>When the PRD needs a stronger backbone:</strong> Some teams wrap this outline in a file-backed delivery system so requirements, design notes, plans, and validation results stay visible in the repo. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/README.md\" target=\"_blank\" rel=\"noopener noreferrer\">repo-attached delivery model</a> is one example; treat it as team process around the PRD, not a replacement for the product calls you own.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@PM-SpecCraft/chapters/05-writing-the-prd.html` at line 73, Update the two\nanchor elements that use target=\"_blank\" in the paragraph (the links with\nvisible text \"Cyber Constructor\" and \"repo-attached delivery model\") to include\nrel=\"noopener noreferrer\" so external links opened in a new tab mitigate\nreverse-tabnabbing risks; ensure both <a> elements that currently have\ntarget=\"_blank\" also set rel=\"noopener noreferrer\".\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>Claude-Power/chapters/05-claude-md-memory.html-205-208 (1)</summary><blockquote>\n\n`205-208`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Clarify the connection to the target audience or reconsider placement.**\n\nThe external GitHub links are valid and accurately referenced in the README. However, the power tip introduces enterprise-level infrastructure concepts (\"repo-attached delivery model,\" \"generated host files,\" \"validation surfaces\") that may be too advanced for readers still learning the `.claude/` directory basics.\n\nThe callout positions Cyber Constructor as a \"larger pattern\" but doesn't explain why a learner at this stage should care about infrastructure scaling patterns. For a \"For Dummies\" course, consider either:\n- Adding 1-2 sentences explaining the relevance to their current workflow, or\n- Moving this callout to a later chapter on team/enterprise workflows\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@Claude-Power/chapters/05-claude-md-memory.html` around lines 205 - 208, This\ncallout cites Cyber Constructor and the \"repo-attached delivery model\" alongside\nthe .claude/ note but introduces advanced enterprise concepts too quickly;\neither add 1–2 sentences inside the same <div class=\"power-tip\"> explaining why\nrepo-attached delivery patterns (e.g., generated host files, user-editable\nconfig, validation surfaces) matter for an individual learning .claude/—tie it\nto a simple example like keeping workflow bits version-controlled and\nreviewable—or move this entire <div class=\"power-tip\"> to a later chapter about\nteam/enterprise workflows so readers first master the basics of .claude/.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>AI-PromptEng/chapters/02-anatomy-of-a-prompt.html-51-51 (1)</summary><blockquote>\n\n`51-51`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Add `rel=\"noopener noreferrer\"` on both external links on line 51.**\n\nBoth links opening in a new tab (`target=\"_blank\"`) are missing the `rel=\"noopener noreferrer\"` attribute, which prevents the opened page from accessing the `window.opener` property. This is a security best practice for external links.\n\nUpdate both links:\n- `<a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>`\n- `<a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/skills/cypilot/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\">workflow routing instructions</a>`\n\n<details>\n<