          "body": "**Actionable comments posted: 18**\n\n> [!NOTE]\n> Due to the large number of review comments, Critical, Major severity comments were prioritized as inline comments.\n\n<details>\n<summary>🟡 Minor comments (20)</summary><blockquote>\n\n<details>\n<summary>AI-Workflow/chapters/14-subagents.html-198-198 (1)</summary><blockquote>\n\n`198-198`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Add `rel=\"noopener noreferrer\"` to external links opened in new tabs.**\n\nBoth external anchors use `target=\"_blank\"` without `rel`, which leaves a reverse-tabnabbing risk.\n\n \n<details>\n<summary>Suggested patch</summary>\n\n```diff\n-      <p><strong>Some teams generate their specialist wiring.</strong> <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/agent-integration.md\" target=\"_blank\">agent integration feature</a> turns shared workflow definitions into agent-native entry points, including named specialist roles. For Claude Code-heavy teams, that pattern keeps the subagent files aligned with the workflow rules instead of letting every project drift by hand.</p>\n+      <p><strong>Some teams generate their specialist wiring.</strong> <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/agent-integration.md\" target=\"_blank\" rel=\"noopener noreferrer\">agent integration feature</a> turns shared workflow definitions into agent-native entry points, including named specialist roles. For Claude Code-heavy teams, that pattern keeps the subagent files aligned with the workflow rules instead of letting every project drift by hand.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@AI-Workflow/chapters/14-subagents.html` at line 198, Add rel=\"noopener\nnoreferrer\" to the two external anchor tags that use target=\"_blank\" (the \"Cyber\nConstructor\" link and the \"agent integration feature\" link in\nAI-Workflow/chapters/14-subagents.html) to prevent reverse-tabnabbing; locate\nthe <a ... target=\"_blank\"> elements for those exact link texts and append\nrel=\"noopener noreferrer\" to each tag.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>Claude-Power/chapters/14-subagents.html-362-362 (1)</summary><blockquote>\n\n`362-362`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Harden external new-tab links with `rel=\"noopener noreferrer\"`.**\n\nThe new external links use `target=\"_blank\"` without `rel`, which is avoidable browser-side security risk.\n\n \n<details>\n<summary>Suggested patch</summary>\n\n```diff\n-      <p>For repeatable team workflows, hand-writing every specialist agent gets old fast. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/subagent-registration.md\" target=\"_blank\">subagent-registration design</a> shows a production pattern: generate role-specific agents such as codegen and PR review with scoped tools, prompts, and host-specific file locations.</p>\n+      <p>For repeatable team workflows, hand-writing every specialist agent gets old fast. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/subagent-registration.md\" target=\"_blank\" rel=\"noopener noreferrer\">subagent-registration design</a> shows a production pattern: generate role-specific agents such as codegen and PR review with scoped tools, prompts, and host-specific file locations.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@Claude-Power/chapters/14-subagents.html` at line 362, The external links in\nthe paragraph that open in a new tab (the anchor elements containing \"Cyber\nConstructor\" and \"subagent-registration design\") use target=\"_blank\" but lack\nrel=\"noopener noreferrer\"; update those two <a> tags to include rel=\"noopener\nnoreferrer\" so the external links are hardened against tab-nabbing and leaking\nwindow.opener.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>PM-SpecCraft/chapters/09-engineering-handoff.html-53-53 (1)</summary><blockquote>\n\n`53-53`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Use `rel=\"noopener noreferrer\"` on both new external anchors.**\n\nLine 53 opens third-party pages in a new tab without `rel`, which should be hardened.\n \n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-      <p><strong>For heavier handoffs:</strong> Some engineering teams use stable IDs and links so a requirement, design choice, and implementation change can point back to one another. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/specs/traceability.md\" target=\"_blank\">traceability format</a> is an engineering-facing version of the same idea: give people durable anchors, not just polished prose.</p>\n+      <p><strong>For heavier handoffs:</strong> Some engineering teams use stable IDs and links so a requirement, design choice, and implementation change can point back to one another. <a href=\"https://github.com/cyberfabric/cyber-constructor\" tar