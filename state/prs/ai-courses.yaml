          "diff_hunk": "@@ -0,0 +1,395 @@\n+<!DOCTYPE html>\n+<html lang=\"en\">\n+<head>\n+  <meta charset=\"UTF-8\">\n+  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n+  <title>Memory Map &mdash; Chapter 8: Validating AI Output: 7 Smell Tests</title>\n+  <link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>\">\n+  <link rel=\"stylesheet\" href=\"../assets/style.css\">\n+</head>\n+<body>\n+\n+  <nav class=\"top-nav\">\n+    <span class=\"nav-title\">Spec Craft With AI</span>\n+    <div class=\"nav-links\">\n+      <a href=\"../index.html\">Contents</a>\n+      <a href=\"../08-seven-smell-tests.html\">Chapter</a>\n+      <a href=\"07-pressure-testing-map.html\">&larr; Prev Map</a>\n+      <a href=\"09-engineering-handoff-map.html\">Next Map &rarr;</a>\n+      <button class=\"theme-toggle\" aria-label=\"Toggle theme\">🌙</button>\n+    </div>\n+  </nav>\n+\n+  <header class=\"map-header\">\n+    <span class=\"chapter-number\">Chapter 8</span>\n+    <h1>Validating AI Output: 7 Smell Tests</h1>\n+    <span class=\"map-badge\">Memory Map</span>\n+  </header>\n+\n+  <main>\n+\n+    <div class=\"map-big-idea\">\n+      <span class=\"big-idea-icon\">👃</span>\n+      <h3>The Big Idea</h3>\n+      <p><strong>Confidence is not correctness.</strong> AI prose reads with the same calm authority whether it&rsquo;s grounded in your repo and your tickets or invented because the conversation seemed to want a sentence. Tone is not a signal of truth. Seven quick smell tests train your eye to spot the difference &mdash; in seconds, before the paragraph reaches engineering. <strong>The smells are yours to catch; the model can&rsquo;t reliably catch its own.</strong></p>\n+    </div>\n+\n+    <h2>👃 The Seven Smell Tests at a Glance</h2>\n+\n+    <div class=\"map-grid\">\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🪄</span>\n+        <div class=\"map-card-title\">1. Generic-language tells</div>\n+        <div class=\"map-card-desc\"><em>Leverage, robust, seamless, scalable, delight, streamline.</em> Words that sound substantive and evaporate the moment you ask what they mean. <strong>Check:</strong> could two engineers build two different things from this sentence?</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🎭</span>\n+        <div class=\"map-card-title\">2. Fabricated specifics</div>\n+        <div class=\"map-card-desc\">A screen name, version, customer, table, or feature flag you don&rsquo;t recognize from your own product or context. The shape of authority without the source. <strong>Check:</strong> grep your repo / Jira / CRM. If absent, ask the model which it invented.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🎯</span>\n+        <div class=\"map-card-title\">3. Suspiciously round numbers</div>\n+        <div class=\"map-card-desc\"><em>30% improvement. 50% of users. 10x faster.</em> Numbers ending in 0 or 5, no source, no method, no baseline. <strong>Check:</strong> where would I look this afternoon to verify this? If &ldquo;nowhere&rdquo;, it&rsquo;s a guess in evidence&rsquo;s clothing.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🫥</span>\n+        <div class=\"map-card-title\">4. Missing context</div>\n+        <div class=\"map-card-desc\">The paragraph would survive being pasted into a competitor&rsquo;s spec with only the product name swapped. No platform, no team norm, no real constraint. <strong>Check:</strong> remove the product name &mdash; could a stranger tell who wrote this?</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">📉</span>\n+        <div class=\"map-card-title\">5. Hallucinated metrics</div>\n+        <div class=\"map-card-desc\"><em>&ldquo;Engagement uplift.&rdquo; &ldquo;Activation velocity.&rdquo;</em> Sounds like a metric; isn&rsquo;t one you can observe today. <strong>Check:</strong> which event, query, or dashboard produces today&rsquo;s value? If &ldquo;we&rsquo;d have to instrument it&rdquo;, that&rsquo;s scope &mdash; or the metric must change.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🌫️</span>\n+        <div class=\"map-card-title\">6. Vague verbs</div>\n+        <div class=\"map-card-desc\"><em>Improve, optimize, ensure, enhance, streamline, support.</em> Direction without destination. <strong>Check:</strong> can a QA engineer write a one-line test for this AC? If not, the verb is doing too much heavy lifting.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🪞</span>\n+        <div class=\"map-card-title\">7. Uncanny consensus</div>\n+        <div class=\"map-card-desc\">The AI agrees with you immediately, in language that mirrors your own. Mirror, not sounding board. <strong>Check:</strong> ask for the strongest counter-case &mdash; &ldquo;the three best reasons I&rsquo;m wrong, persuasively.&rdquo; If it&rsquo;s as strong as the original, you weren&rsquo;t as sure as you felt.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🪶</span>\n+        <div class=\"map-card-title\">+1. The &ldquo;describe back&rdquo; prompt</div>\n+        <div class=\"map-card-desc\">When a section feels off but no specific tell fires: paste it back in a fresh thread &mdash; <em>&ldquo;describe what this commits to in your own words; list anything vague, missing a source, or open to two readings.&rdquo;</em> Catches what the seven miss.</div>\n+      </div>\n+    </div>\n+\n+    <h2>🧪 Each Test Has Three Parts</h2>\n+\n+    <div class=\"map-flow\">\n+      <div class=\"map-flow-step\">👁️ <strong>The tell</strong><br><small>What you notice in the output</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">🔍 <strong>The check</strong><br><small>The 5-second test you run on it</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">🔁 <strong>The re-prompt</strong><br><small>What you ask the AI to do about it</small></div>\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">After the first week, the tells light up automatically. <strong>You don&rsquo;t open a checklist; you read a paragraph, an eye catches a tell, you re-prompt, you keep moving.</strong> The cost drops from minutes to seconds.</p>\n+\n+    <h2>🚦 Patch vs. Delete-and-Restart &mdash; The Two-Criterion Rule</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>Situation</th>\n+          <th>What to do</th>\n+          <th>Why</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td><strong>1 or 2 tells fire</strong>, structurally sound paragraph</td>\n+          <td>🩹 <strong>Patch</strong> &mdash; re-prompt for sharper language, swap the bad bits, keep the bones</td>\n+          <td>The structure is fine; the language was just lazy</td>\n+        </tr>\n+        <tr>\n+          <td><strong>3+ tells fire</strong>, OR any single tell is &ldquo;the underlying claim is invented&rdquo;</td>\n+          <td>♻️ <strong>Delete and restart</strong> with more context attached and a tighter prompt</td>\n+          <td>Patching a generic template leaves the generic structure intact &mdash; restarting is faster every time</td>\n+        </tr>\n+        <tr>\n+          <td><strong>Tie-breaker:</strong> count the sentences you&rsquo;d need to rewrite</td>\n+          <td>2 of 5 &rarr; patch. 4 of 5 &rarr; restart.</td>\n+          <td>Spares you the most common time-sink: rewriting a generic paragraph one sentence at a time</td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <h2>🎬 The Loop in Real Time &mdash; Two Tells, One Re-prompt</h2>\n+\n+    <ol class=\"map-timeline\">\n+      <li class=\"map-timeline-item\" data-step=\"1\">\n+        <h4>AI returns &ldquo;Goals&rdquo; section</h4>\n+        <p><em>&ldquo;Empower workspace admins to seamlessly onboard&hellip; drive a 30% increase in seat utilization.&rdquo;</em> &mdash; smell tests <strong>1 (generic)</strong> and <strong>3 (round number, no source)</strong> fire.</p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"2\">\n+        <h4>PM names the tells, asks for honesty</h4>\n+        <p>&ldquo;Goals 1 and 2 are mostly marketing words. Goal 3 has a 30% number with no source. Where did that come from?&rdquo;</p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"3\">\n+        <h4>AI self-discloses</h4>\n+        <p>&ldquo;Goals 1 and 2 are templates, not derived from your context. The 30% is an estimate; I have no source. I should have said so.&rdquo; <strong>That self-disclosure is the actual win.</strong></p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"4\">\n+        <h4>PM re-attaches real context, re-prompts</h4>\n+        <p>&ldquo;Today, only 40% of invited members complete sign-up because of spam/expiry. Rewrite the goals using only behaviors we can observe in our analytics, drop unsourced numbers.&rdquo;</p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"5\">\n+        <h4>AI returns measurable, grounded goals</h4>\n+        <p>Goals tied to the invite-funnel report; instrumentation gaps flagged explicitly (&ldquo;Goal 2 requires new instrumentation&rdquo;). <strong>Total time: under three minutes.</strong></p>\n+      </li>\n+    </ol>\n+\n+    <h2>🎚️ Calibrating Tests to Spec Stage</h2>\n+\n+    <div class=\"map-relationships\">\n+      <div class=\"map-rel-node\">📝 <strong>Early draft:</strong><br>tests 4 &amp; 7<br><small>(missing context, uncanny consensus)</small></div>\n+      <div class=\"map-rel-center\">Test 2<br><small>(fabricated specifics)</small><br>matters at <em>every</em> stage</div>\n+      <div class=\"map-rel-node\">📤 <strong>Near-final:</strong><br>tests 1, 3, 5, 6<br><small>(generic words, round numbers, hallucinated metrics, vague verbs)</small></div>\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">When drafting, run the tests <strong>softly</strong>; placeholders are fine while you&rsquo;re still exploring shape. When polishing for share, run them <strong>hard</strong>. The reflex stays the same; the tolerance changes. <strong>A fabricated specific is a landmine no matter when it ships</strong> &mdash; that one never gets a free pass.</p>\n+\n+    <h2>🧰 The Smell-Test Reminder &mdash; Paste at the Top of Long Sessions</h2>\n+\n+    <div class=\"spec-snippet\">\n+<strong>Self-prompt for the model</strong>\n+\n+When generating spec text, avoid these patterns and self-flag them\n+when they happen:\n+1. Generic words (leverage, robust, seamless, scalable, streamline)\n+2. Fabricated specifics (invented names, screens, version numbers)\n+3. Round numbers without sources (30%, 50%, 10x)\n+4. Generic-product language (could fit any SaaS, no context grip)\n+5. Metrics not currently measurable in this product\n+6. Vague verbs in AC (improve, optimize, ensure, enhance)\n+7. Premature agreement; mirroring my framing back\n+\n+If a sentence depends on any of these, mark it explicitly rather\n+than smoothing it over.\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">Works in Claude, ChatGPT, Gemini, Copilot Chat, Windsurf&rsquo;s Cascade. Doesn&rsquo;t eliminate the patterns &mdash; <strong>makes the model self-disclose them faster</strong>. That self-disclosure cuts your re-prompting in half.</p>\n+\n+    <h2>🎯 What the Tests Catch &mdash; And What They Don&rsquo;t</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>Catches</th>\n+          <th>Doesn&rsquo;t catch</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>Confidently generic prose entering the spec without a fight</td>\n+          <td>A wrong product decision dressed up in clean prose</td>\n+        </tr>\n+        <tr>\n+          <td>Hallucinated metrics that look measurable</td>\n+          <td>A misread of the customer</td>\n+        </tr>\n+        <tr>\n+          <td>Round numbers with no source</td>\n+          <td>A perfectly measurable metric tracking the wrong thing</td>\n+        </tr>\n+        <tr>\n+          <td>Vague verbs that aren&rsquo;t testable</td>\n+          <td>Scope decisions made for the wrong reason</td>\n+        </tr>\n+        <tr>\n+          <td>Generic templates dressed up to look bespoke</td>\n+          <td>Whether the spec is solving the right problem at all</td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">The tests are about <strong>language</strong>, not judgment. The bigger questions live in chapters 2 (deciding), 3 (sharpening), and 7 (pressure-testing). <strong>What the tests do catch &mdash; sloppy language &mdash; costs trust with engineering fastest, so the small reflex pays off big.</strong></p>\n+\n+    <div class=\"driver-box\">\n+      <p><strong>What&rsquo;s yours: the smell tests are <em>your</em> job, not the AI&rsquo;s.</strong> The model can&rsquo;t reliably catch its own generic language, can&rsquo;t tell you which numbers it invented, and can&rsquo;t notice that it&rsquo;s describing a generic SaaS rather than your product. The same statistical reflex that produces the prose is what produces the smells. You&rsquo;re the only one in the conversation who knows your product, your users, and what counts as a real number in your dashboard. <strong>When a sentence ships in your spec with a hallucinated metric in it, the byline is yours, not the model&rsquo;s.</strong></p>\n+    </div>\n+\n+    <h2>📒 Key Terms</h2>\n+\n+    <dl class=\"map-terms\">\n+      <dt>Smell test</dt>\n+      <dd>A 5-second reflex check on AI output. Each one targets one predictable way spec prose slides &mdash; vague where it should be concrete, invented where it sounds specific.</dd>\n+\n+      <dt>The tell</dt>\n+      <dd>The visible pattern in the output that triggers the test. <em>&ldquo;Leverage&rdquo;, &ldquo;30%&rdquo;, &ldquo;robust&rdquo;</em> &mdash; the words and shapes that should make your eye catch.</dd>\n+\n+      <dt>The check</dt>\n+      <dd>A quick mental test you can run on the sentence in seconds &mdash; e.g., &ldquo;could two engineers build two different things from this?&rdquo; or &ldquo;can a QA engineer write a one-line test for it?&rdquo;</dd>\n+\n+      <dt>The re-prompt</dt>\n+      <dd>What you actually paste back to the AI to fix the issue &mdash; usually a sharpening request with explicit permission to admit it doesn&rsquo;t know.</dd>\n+\n+      <dt>Patch vs. delete-and-restart</dt>\n+      <dd>1&ndash;2 tells = patch. 3+ tells, or any invented underlying claim = restart with more context. Restarting is almost always faster than rewriting a generic paragraph one sentence at a time.</dd>\n+\n+      <dt>Fabricated specifics</dt>\n+      <dd>Names, version numbers, screens, customers that <em>sound</em> grounded but came from the model&rsquo;s defaults rather than from your context. The most dangerous tell because it mimics authority.</dd>\n+\n+      <dt>Hallucinated metric</dt>\n+      <dd>A success metric the AI suggests that you cannot, today, point at a dashboard, query, or event for. Either the metric needs new instrumentation (and that becomes part of the scope) or the metric must change.</dd>\n+\n+      <dt>Uncanny consensus</dt>\n+      <dd>The AI agreeing with you immediately, in your own framing. The mirror tells you very little. Run smell test 7 by asking for the strongest counter-case.</dd>\n+\n+      <dt>The &ldquo;describe back&rdquo; prompt</dt>\n+      <dd>An eighth, off-list test: paste a section in a fresh thread, ask the model to describe what it commits to and list anything vague or missing. Surfaces gaps the seven tests miss because they&rsquo;re about silence, not about a tell in existing prose.</dd>\n+\n+      <dt>Smell-test reminder</dt>\n+      <dd>A short kit-style prompt pasted at the top of long sessions. Lists the seven patterns and asks the model to self-flag rather than smooth them over. Reduces re-prompting overhead.</dd>\n+\n+      <dt>Calibration to stage</dt>\n+      <dd>Soft testing during early drafts (placeholders OK), hard testing before share. Same reflex, different tolerance &mdash; except for fabricated specifics, which never get a free pass.</dd>\n+    </dl>\n+\n+    <h2>🏷️ Before vs. After &mdash; A Single AC Paragraph</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>&ldquo;Before&rdquo; tells</th>\n+          <th>&ldquo;After&rdquo; commitment</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>&ldquo;Leverage modern web standards&rdquo; <em>(test 1)</em></td>\n+          <td>Specific UI: workspace name, inviter&rsquo;s name, &ldquo;Accept and Sign In&rdquo; button</td>\n+        </tr>\n+        <tr>\n+          <td>&ldquo;Seamless and robust onboarding&rdquo; <em>(test 1)</em></td>\n+          <td>Link works mobile + desktop, valid for 7 days, logged in audit trail</td>\n+        </tr>\n+        <tr>\n+          <td>&ldquo;Drive a 50% improvement in activation&rdquo; <em>(tests 3, 5)</em></td>\n+          <td>Sign-up share: baseline 60%, target 80% (source: invite-funnel report)</td>\n+        </tr>\n+        <tr>\n+          <td>&ldquo;Reduce support load by streamlining&rdquo; <em>(test 6)</em></td>\n+          <td>&ldquo;Invite link expired&rdquo; tickets: baseline 12/wk, target under 3/wk (tag: invite-expiry)</td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">The &ldquo;after&rdquo; is longer, less elegant, and considerably more useful. <strong>Engineering can build from it. QA can test it. Support recognizes their own ticket category in it. Nothing is decorative.</strong></p>\n+\n+    <h2>👃 What the Smells Have in Common</h2>\n+\n+    <div class=\"smell-test\">\n+      <p><strong>None of the seven tests are about catching the AI being &ldquo;wrong.&rdquo; They&rsquo;re about catching language that doesn&rsquo;t commit.</strong></p>\n+      <ul>\n+        <li>Generic verbs don&rsquo;t commit to behavior.</li>\n+        <li>Round numbers don&rsquo;t commit to a source.</li>\n+        <li>Hallucinated metrics don&rsquo;t commit to a measurement.</li>\n+        <li>Missing context doesn&rsquo;t commit to a product.</li>\n+        <li>Uncanny consensus doesn&rsquo;t commit to an opinion.</li>\n+      </ul>\n+      <p>You&rsquo;re not trying to debunk the model &mdash; you&rsquo;re asking each sentence what it&rsquo;s prepared to commit to. <strong>Sentences that commit get to stay. Sentences that don&rsquo;t either get a re-prompt or get cut.</strong></p>\n+    </div>\n+\n+    <h2>❓ Quick Quiz</h2>\n+\n+    <div class=\"map-quiz\">\n+      <details>\n+        <summary>Why is &ldquo;confidence not correctness&rdquo; the framing for this whole chapter?</summary>\n+        <p class=\"quiz-answer\">Because AI output reads with the <strong>same calm authority</strong> regardless of where the words came from &mdash; a sentence grounded in your repo and a sentence the model invented look identical. If you treat tone as a signal of correctness, you will sometimes be right and sometimes be embarrassed, and the second one costs more. The seven tests replace tone-reading with reflex-checking.</p>\n+      </details>\n+      <details>\n+        <summary>What three parts does every smell test have?</summary>\n+        <p class=\"quiz-answer\"><strong>The tell</strong> (what you notice), <strong>the check</strong> (the 5-second test you run on it), and <strong>the re-prompt</strong> (what you ask the AI to do about it). The shape is identical across all seven, which is what lets the reflex generalize.</p>\n+      </details>\n+      <details>\n+        <summary>What&rsquo;s the rule for patch vs. delete-and-restart?</summary>\n+        <p class=\"quiz-answer\"><strong>1 or 2 tells &mdash; patch.</strong> The structure is sound; the language was just lazy. <strong>3+ tells, or any single &ldquo;underlying claim is invented&rdquo; &mdash; delete and restart</strong> with more context and a tighter prompt. Tie-breaker: count the sentences you&rsquo;d need to rewrite. Two of five = patch. Four of five = restart, every time.</p>\n+      </details>\n+      <details>\n+        <summary>Why is fabricated specifics (test 2) sneakier than generic-language tells (test 1)?</summary>\n+        <p class=\"quiz-answer\">Test 1 sounds vague; test 2 sounds <strong>extremely</strong> concrete. A specific screen name, customer name, version number, or feature flag has the shape of authority. To the model, real specifics and invented ones read as equally plausible. <strong>You can&rsquo;t tell from tone &mdash; you have to grep your repo, Jira, or CRM</strong>, or just ask the model plainly which it took from context vs. invented.</p>\n+      </details>\n+      <details>\n+        <summary>What&rsquo;s the test for a hallucinated metric?</summary>\n+        <p class=\"quiz-answer\">For each metric in the spec, ask: <em>&ldquo;which event in our analytics, which row in our database, or which report would tell me the current value of this metric, today, before the build starts?&rdquo;</em> If the answer is &ldquo;we&rsquo;d need to instrument it&rdquo;, that instrumentation is part of the scope &mdash; or the metric needs to change. <strong>Shipping a metric that can&rsquo;t actually be observed makes the success section fiction.</strong></p>\n+      </details>\n+      <details>\n+        <summary>Why is smell test 7 (uncanny consensus) the most consequential?</summary>\n+        <p class=\"quiz-answer\">Because the other six catch <em>language</em>; this one catches a <strong>tilt in the conversation that quietly steers your judgment</strong>. The output feels great in the moment because the model agrees with you and mirrors your framing &mdash; but it tells you very little. The fix: <em>&ldquo;pretend you&rsquo;re a senior PM who disagrees with my last decision; three best reasons I&rsquo;m wrong, persuasively.&rdquo;</em> If you only ever run one test, run this one.</p>\n+      </details>\n+      <details>\n+        <summary>What does the &ldquo;describe back&rdquo; prompt do that the seven tests can&rsquo;t?</summary>\n+        <p class=\"quiz-answer\">Catches <strong>silences</strong> &mdash; what the section <em>doesn&rsquo;t</em> say. Pasted into a fresh thread with &ldquo;describe what this commits to in your own words; list anything vague or missing&rdquo;, the model is unusually good at critiquing prose it didn&rsquo;t generate in the same conversation. Treat it as the eighth test that doesn&rsquo;t fit on the list. Used together, the seven plus &ldquo;describe back&rdquo; find almost everything that matters before the spec leaves your screen.</p>\n+      </details>\n+      <details>\n+        <summary>How does calibration to spec stage work?</summary>\n+        <p class=\"quiz-answer\">Early drafts, while you&rsquo;re still exploring shape: <strong>tests 4 and 7 matter most</strong> (missing context, uncanny consensus &mdash; they catch sections not yet grounded). Near-final drafts: <strong>tests 1, 3, 5, 6 matter most</strong> (generic words, round numbers, hallucinated metrics, vague verbs &mdash; they catch language that reads as careless to engineering). Test 2 (fabricated specifics) <strong>matters at every stage equally</strong> &mdash; it&rsquo;s a landmine whenever it ships.</p>\n+      </details>\n+      <details>\n+        <summary>What do all seven tests have in common at the deepest level?</summary>\n+        <p class=\"quiz-answer\">None of them are about catching the AI being <em>wrong</em>. They&rsquo;re about catching <strong>language that doesn&rsquo;t commit</strong>. Generic verbs don&rsquo;t commit to behavior. Round numbers don&rsquo;t commit to a source. Hallucinated metrics don&rsquo;t commit to a measurement. You&rsquo;re asking each sentence what it&rsquo;s prepared to commit to &mdash; sentences that commit stay; sentences that don&rsquo;t either get a re-prompt or get cut.</p>\n+      </details>\n+    </div>\n+\n+    <div class=\"map-summary\">\n+      <h3>Key Takeaways</h3>\n+      <ul>\n+        <li class=\"map-summary-item\"><strong>Confidence is not correctness</strong> &mdash; AI prose reads the same whether grounded or invented. Tone is not a signal of truth.</li>\n+        <li class=\"map-summary-item\">The seven tests: <strong>generic-language tells, fabricated specifics, suspicious round numbers, missing context, hallucinated metrics, vague verbs, uncanny consensus</strong>.</li>\n+        <li class=\"map-summary-item\">Each test has the same three parts: <strong>the tell, the check, the re-prompt</strong>. The shape generalizes.</li>\n+        <li class=\"map-summary-item\">Fabricated specifics (test 2) is the sneakiest &mdash; <strong>it sounds more concrete, not less</strong>, because the model treats real and invented specifics as equally plausible.</li>\n+        <li class=\"map-summary-item\">For metrics: ask <strong>&ldquo;what event/query/dashboard tells me today&rsquo;s value?&rdquo;</strong> If the answer is &ldquo;none&rdquo;, instrumentation becomes scope or the metric changes.</li>\n+        <li class=\"map-summary-item\">Vague verbs fail because <strong>you can&rsquo;t write a one-line test for them</strong>. AC must be observable, or it isn&rsquo;t AC.</li>\n+        <li class=\"map-summary-item\">Smell test 7 is the most consequential &mdash; <strong>if you only ever run one, run this one</strong>. Ask for the strongest counter-case.</li>\n+        <li class=\"map-summary-item\"><strong>Two-criterion rule:</strong> 1&ndash;2 tells = patch. 3+ tells or any invented claim = delete and restart with more context. Restarting beats sentence-by-sentence rewriting every time.</li>\n+        <li class=\"map-summary-item\">Tie-breaker: count sentences you&rsquo;d rewrite. <strong>Two of five = patch. Four of five = restart.</strong></li>\n+        <li class=\"map-summary-item\">The model can <strong>self-disclose smells when asked</strong> &mdash; honest answers to &ldquo;which specifics did you take from my context vs. invent?&rdquo; surface fabrications fast.</li>\n+        <li class=\"map-summary-item\">Paste the smell-test reminder at the top of long sessions &mdash; the model produces visibly more conservative output and self-flags as it goes.</li>\n+        <li class=\"map-summary-item\">When something feels off but no specific tell fires: use the <strong>&ldquo;describe back&rdquo; prompt</strong> in a fresh thread. It catches gaps about silence, not about prose.</li>\n+        <li class=\"map-summary-item\">Calibrate to stage: tests 4 &amp; 7 dominate early drafts, tests 1/3/5/6 dominate near-final, <strong>test 2 matters at every stage equally</strong>.</li>\n+        <li class=\"map-summary-item\">All seven tests share one purpose: catching <strong>language that doesn&rsquo;t commit</strong>. Sentences that commit stay; sentences that don&rsquo;t get re-prompted or cut.</li>\n+        <li class=\"map-summary-item\">The smells are <strong>your job, not the AI&rsquo;s</strong> &mdash; the same statistical reflex that produces the prose produces the smells. The byline is yours.</li>\n+        <li class=\"map-summary-item\">After a week or two of practice, your own first drafts contain fewer tells &mdash; the seven patterns become fingerprints you can&rsquo;t un-see, in any prose.</li>\n+      </ul>\n+    </div>\n+\n+    <nav class=\"chapter-nav\">\n+      <a href=\"07-pressure-testing-map.html\">\n+        <span class=\"nav-direction\">&larr; Previous map</span>\n+        <span class=\"nav-chapter\">7. Pressure-Testing Your Spec</span>\n+      </a>\n+      <a href=\"09-engineering-handoff-map.html\" class=\"next\">\n+        <span class=\"nav-direction\">Next map</span>\n+        <span class=\"nav-chapter\">9. The Engineering Handoff &rarr;</span>\n+      </a>\n+    </nav>",
