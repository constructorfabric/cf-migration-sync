squo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/kit-management.md\" target=\"_blank\">kit lifecycle</a> is useful to study when you want updates, diffs, and reviewable workflow assets instead of loose files.</p>\n+      <p><strong>Adjacent packaging pattern:</strong> Claude plugins package Claude Code customizations, while <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a> kits package workflow material such as templates, rules, checklists, and validation resources. They are different systems, but <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/kit-management.md\" target=\"_blank\" rel=\"noopener noreferrer\">kit lifecycle</a> is useful to study when you want updates, diffs, and reviewable workflow assets instead of loose files.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@Claude-Power/chapters/15-plugins-marketplace.html` at line 79, The paragraph\ncontaining multiple external anchors with target=\"_blank\" (the two <a> tags\nlinking to \"https://github.com/cyberfabric/cyber-constructor\" and the one\nlinking to \"architecture/features/kit-management.md\") must include rel=\"noopener\nnoreferrer\" on each anchor; update every <a ... target=\"_blank\"> in that\nparagraph to <a ... target=\"_blank\" rel=\"noopener noreferrer\"> so all external\nblank-tab links are secured and consistent.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>Claude-Power/chapters/11-team-patterns.html-123-123 (1)</summary><blockquote>\n\n`123-123`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Add `rel` on the new external links opened in a new tab.**\n\nLine 123 should include `rel=\"noopener noreferrer\"` on both `_blank` anchors.\n \n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-      <p>When a shared skill grows into templates, rules, checklists, and update steps, you are no longer just sharing a prompt &mdash; you are sharing a workflow asset. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/kit-management.md\" target=\"_blank\">kit-management model</a> is a concrete version of that pattern, including install/update discipline and validation for the packaged material.</p>\n+      <p>When a shared skill grows into templates, rules, checklists, and update steps, you are no longer just sharing a prompt &mdash; you are sharing a workflow asset. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/kit-management.md\" target=\"_blank\" rel=\"noopener noreferrer\">kit-management model</a> is a concrete version of that pattern, including install/update discipline and validation for the packaged material.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@Claude-Power/chapters/11-team-patterns.html` at line 123, The two external\nanchor tags that open in a new tab (the Cyber Constructor and kit-management\nlinks in the paragraph) must include rel=\"noopener noreferrer\"; update both <a\n... target=\"_blank\"> elements in that paragraph so each anchor tag includes\nrel=\"noopener noreferrer\" alongside the existing target attribute to prevent\nopener access and improve security/privacy.\n```\n\n</details>\n\n</blockquote></details>\n<details>\n<summary>PM-SpecCraft/chapters/11-your-ai-pm-kit.html-268-268 (1)</summary><blockquote>\n\n`268-268`: _⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**Harden the new external links in this tip callout.**\n\nLine 268 should include `rel=\"noopener noreferrer\"` on each `_blank` link.\n \n<details>\n<summary>Suggested fix</summary>\n\n```diff\n-      <p><strong>Same pattern, bigger scale:</strong> A personal PM kit is a lightweight cousin of team delivery kits that package templates, rules, and checklists for repeat use. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/kit-management.md\" target=\"_blank\">kit-management model</a> shows the engineering-scale version; your version can stay plain text and personal.</p>\n+      <p><strong>Same pattern, bigger scale:</strong> A personal PM kit is a lightweight cousin of team delivery kits that package templates, rules, and checklists for repeat use. <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\" rel=\"noopener noreferrer\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/kit-management.md\" target=\"_blank\" rel=\"noopener noreferrer\">kit-management model</a> shows the engineering-scale version; your version can stay plain text and personal.</p>\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@PM-SpecCraft/chapters/11-your-ai-pm-kit.html` at line 268, The two anchor\nelements in the tip callout that use target=\"_blank\" (the links to \"Cyber\nConstructor\" and to \"kit-