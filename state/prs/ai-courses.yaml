          "diff_hunk": "@@ -248,6 +248,10 @@ <h4>Don&rsquo;t Skip REVIEW.md</h4>\n       <p>Without a REVIEW.md, Claude applies generic correctness checks. With one, it applies <em>your team&rsquo;s</em> correctness checks. The difference is significant. A generic reviewer doesn&rsquo;t know that your project requires integration tests for every new endpoint, or that <code>console.log</code> is banned in production code. A configured reviewer does. Spend 15 minutes writing a REVIEW.md &mdash; it pays for itself on the first review.</p>\n     </div>\n \n+    <div class=\"tip-box\">\n+      <p><strong>Configuration is only useful when it is reviewable.</strong> <a href=\"https://github.com/cyberfabric/cyber-constructor\" target=\"_blank\">Cyber Constructor</a>&rsquo;s <a href=\"https://github.com/cyberfabric/cyber-constructor/blob/main/architecture/features/pr-workflows.md\" target=\"_blank\">PR workflow boundary</a> keeps review and status behavior tied to explicit workflow assets rather than hidden chat habits. Use that same standard for REVIEW.md: version it, review it, and update it when repeated findings reveal a real team rule.</p>",
