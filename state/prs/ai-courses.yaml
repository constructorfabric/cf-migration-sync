          "body": "_⚠️ Potential issue_ | _🟡 Minor_ | _⚡ Quick win_\n\n**`.quality-ribbon` uses hardcoded colors, bypassing the theming system and lacking a dark-mode override.**\n\nEvery other coloured element in this stylesheet uses `var(--color-*)` tokens. Hardcoding `#16a34a`/`#15803d` here means:\n1. The ribbon won't respond to future palette changes via CSS variables.\n2. In dark mode (`.index-hero` becomes `#0d1117`→`#161b22`), the ribbon stays its original green with no adaptation — there is no `[data-theme=\"dark\"] .quality-ribbon` block.\n\nAdditionally, in light mode the ribbon gradient (`#16a34a`, `#15803d`) is nearly identical to the hero background gradient (`#047857`, `#059669`), so visual separation relies solely on `box-shadow`.\n\n<details>\n<summary>🎨 Proposed fix — use CSS variables and add a dark-theme override</summary>\n\n```diff\n .quality-ribbon {\n   ...\n-  background: linear-gradient(135deg, `#16a34a`, `#15803d`);\n+  background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));\n   ...\n }\n+\n+[data-theme=\"dark\"] .quality-ribbon {\n+  background: linear-gradient(135deg, `#16a34a`, `#15803d`);\n+  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);\n+}\n+\n .quality-ribbon--orange { background: linear-gradient(135deg, `#f97316`, `#c2410c`); }\n+[data-theme=\"dark\"] .quality-ribbon--orange { background: linear-gradient(135deg, `#ea580c`, `#9a3412`); }\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@AI-Workflow/chapters/assets/style.css` around lines 1578 - 1597, The\n.quality-ribbon rule currently uses hardcoded hex colors which bypass the theme\ntokens and lacks a dark-mode override; change the gradient to use CSS variables\n(e.g. var(--color-success-600), var(--color-success-700) or your project's\nequivalent) and update .quality-ribbon--orange similarly to use\nvar(--color-warning-*) tokens, then add a [data-theme=\"dark\"] .quality-ribbon\nblock that overrides those variables or the background gradient to\ndarker/high-contrast values so the ribbon adapts to dark mode and to future\npalette changes while preserving existing padding, transform, and z-index.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:churro:ea60efb6-f12a-4c62-9a11-b9973adea6f5 -->\n\n<!-- d98c2f50 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
