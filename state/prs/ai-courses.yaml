          "node_id": "PRRC_kwDOSO0NIM69eAAn",
          "diff_hunk": "@@ -0,0 +1,403 @@\n+<!DOCTYPE html>\n+<html lang=\"en\">\n+<head>\n+  <meta charset=\"UTF-8\">\n+  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n+  <title>Chapter 1: The PM in 2026 &mdash; Spec Craft With AI</title>\n+  <link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>\">\n+  <link rel=\"stylesheet\" href=\"assets/style.css\">\n+</head>\n+<body>\n+\n+  <nav class=\"top-nav\">\n+    <span class=\"nav-title\">Spec Craft With AI</span>\n+    <div class=\"nav-links\">\n+      <a href=\"../../index.html\">Home</a>\n+      <a href=\"index.html\">Contents</a>\n+      <a href=\"02-the-driving-seat.html\">Next &rarr;</a>\n+      <a href=\"maps/01-pm-in-2026-map.html\">🧠 Map</a>\n+      <button class=\"theme-toggle\" aria-label=\"Toggle theme\">🌙</button>\n+    </div>\n+  </nav>\n+\n+  <header class=\"chapter-header\">\n+    <div class=\"chapter-number\">Chapter 1</div>\n+    <h1>The PM in 2026: AI as Co-Pilot, Not Autopilot</h1>\n+    <p class=\"subtitle\">Where AI fits in the PM job, what stays human, and the one-page mental model that runs through this whole course.</p>\n+  </header>\n+\n+  <main>\n+\n+    <h2>Tuesday morning, somewhere in 2026</h2>\n+\n+    <p>It&rsquo;s 8:47 a.m. You&rsquo;re holding a cortado and squinting at a Slack thread. A senior engineer has flagged a subtle problem with last week&rsquo;s onboarding spec. Three product directions could fix it. You have a stand-up at 9:15.</p>\n+\n+    <p>You open your AI tool of choice &mdash; today it happens to be Claude, but on a different day it would be ChatGPT, Copilot, Windsurf, or Gemini, depending on what you&rsquo;re plugged into. You paste the engineer&rsquo;s message and the relevant section of the spec. You ask: <em>&ldquo;Restate the issue back to me in two sentences. Then list the three plausible directions and the trade-off for each.&rdquo;</em></p>\n+\n+    <p>Twelve seconds later, you have a clean restatement. One of the directions is wrong &mdash; it assumes a backend behavior your platform doesn&rsquo;t have. You delete it. The other two are real. You pick one based on what your customer-success colleague told you on Friday about churn in the trial cohort.</p>\n+\n+    <p>By 9:00 you&rsquo;ve drafted a four-line decision note. By 9:10 you&rsquo;ve attached it to the ticket. At 9:15 you walk into stand-up with an answer.</p>\n+\n+    <p>Here&rsquo;s the thing: the AI didn&rsquo;t make the call. It restated the problem, listed options, and surfaced a trade-off you would&rsquo;ve thought of in twenty minutes &mdash; in twelve seconds. <strong>You</strong> rejected the wrong direction. <strong>You</strong> weighed the trade-off against churn. <strong>You</strong> wrote the four-line note.</p>\n+\n+    <p>That&rsquo;s the PM job in 2026. The shape didn&rsquo;t change. The pace did.</p>\n+\n+    <div class=\"highlight-box\">\n+      <h3>The promise of this chapter</h3>\n+      <p>By the time you finish this page, you&rsquo;ll have a clear mental model of how AI fits into spec work today &mdash; what it&rsquo;s genuinely good at, what stays your job, and how to think about the partnership without losing yourself in it.</p>\n+    </div>\n+\n+    <h2>What AI is genuinely good at (in spec work)</h2>\n+\n+    <p>Let&rsquo;s be specific. There are five spec-related tasks where AI delivers real, repeatable leverage today:</p>\n+\n+    <ul>\n+      <li><strong>Drafting.</strong> First-pass language for sections you already know the shape of. Acceptance criteria. User stories. Risk lists. Initial PRD skeletons under a heading you wrote.</li>\n+      <li><strong>Expanding.</strong> &ldquo;Give me twelve edge cases I might be missing.&rdquo; &ldquo;What would break this if a user is on a slow connection?&rdquo; &ldquo;What would a senior engineer ask?&rdquo;</li>\n+      <li><strong>Summarizing.</strong> Twenty pages of research notes into a one-page summary. A noisy thread into three positions. A long meeting transcript into a decision log.</li>\n+      <li><strong>Pressure-testing.</strong> &ldquo;You&rsquo;re a designer reviewing this. What&rsquo;s missing?&rdquo; &ldquo;You&rsquo;re a compliance officer. What worries you?&rdquo; A friendly red-team in twenty seconds.</li>\n+      <li><strong>Formatting.</strong> Same content, three audiences. Eng-flavored, leadership-flavored, sales-flavored. Same spec, three voices.</li>\n+    </ul>\n+\n+    <p>Notice what&rsquo;s on this list: tasks where the input is yours and the output is checkable in seconds. Notice what&rsquo;s <em>not</em> on this list: deciding which problem is worth solving, which user matters most this quarter, what trade-offs you&rsquo;re willing to live with, when the work is good enough to ship.</p>\n+\n+    <h2>The pattern that quietly creeps in</h2>\n+\n+    <p>Here&rsquo;s a pattern many of us have noticed in ourselves at some point: you&rsquo;re short on time. You have a fuzzy idea. You type a one-line prompt &mdash; <em>&ldquo;Write a PRD for an in-app feedback widget&rdquo;</em> &mdash; and the AI returns three pages of confident, well-formatted, plausible-sounding prose. You skim it, fix two typos, and ship.</p>\n+\n+    <p>The output looks like a spec. Each section has the right heading. The acceptance criteria use Given/When/Then. The metrics section even cites round numbers.</p>\n+\n+    <p>And yet, when an engineer reads it, something is off. The customer in the spec doesn&rsquo;t quite match yours. The metrics aren&rsquo;t measurable in your product. The edge cases describe a generic SaaS, not your platform. The whole thing reads like a competent draft of <em>somebody else&rsquo;s</em> feature.</p>\n+\n+    <p>That&rsquo;s the &ldquo;vague brief, AI fills the rest&rdquo; pattern. It&rsquo;s not a moral failing &mdash; it&rsquo;s an entirely rational response to deadline pressure and the speed of these tools. The whole craft you&rsquo;re about to learn is built around recognizing it early and intervening before the spec leaves your hands.</p>\n+\n+    <div class=\"tip-box\">\n+      The tell isn&rsquo;t that the spec is bad. The tell is that the spec could belong to anyone, anywhere, building anything. Your specs should belong to <em>your</em> product, <em>your</em> customers, <em>your</em> team &mdash; and read like it.\n+    </div>\n+\n+    <h2>What stays human in 2026</h2>\n+\n+    <p>Five things didn&rsquo;t change between 2020 and 2026, no matter how good the models got:</p>\n+\n+    <h3>1. Judgment</h3>\n+    <p>Picking which fight to pick. Saying &ldquo;not this quarter&rdquo; to a feature with passionate stakeholders. Holding a small spec against pressure to grow it. AI can list options forever. Closing the list is yours.</p>\n+\n+    <h3>2. Taste</h3>\n+    <p>Knowing when an experience feels right and when it doesn&rsquo;t. Noticing the empty state nobody designed. Hearing &ldquo;technically meets the requirements&rdquo; and answering &ldquo;and yet, this is bad.&rdquo; Taste compounds across products you&rsquo;ve shipped. The model has not shipped any.</p>\n+\n+    <h3>3. Customer truth</h3>\n+    <p>What real users actually do, say, and feel. AI can simulate a persona; it cannot sit in a coffee shop with a real person who is frustrated with your onboarding. The interview, the support ticket, the sales call recording &mdash; those are still ground truth.</p>\n+\n+    <h3>4. Accountability for outcomes</h3>\n+    <p>When the feature ships and doesn&rsquo;t move the metric, there is exactly one person on the team who has to walk into the room and explain it. That person is you. The AI does not attend that meeting.</p>\n+\n+    <h3>5. The right to change your mind</h3>\n+    <p>You can read your own spec on Friday and decide it&rsquo;s wrong. You can pull it back. You can rewrite the problem statement. AI will happily defend whatever you wrote five minutes ago, with equal confidence. You&rsquo;re allowed to overrule both of you.</p>\n+\n+    <div class=\"driver-box\">\n+      Look at the five items above. None of them depend on which AI tool you use. None of them depend on how good prompting becomes next year. They are the irreducible parts of your job &mdash; the part that is yours to do, and yours alone. Everything in this course is designed to keep these five things firmly in your hands while you let AI accelerate the rest.\n+    </div>\n+\n+    <h2>The co-pilot metaphor (and why it matters)</h2>\n+\n+    <p>The mental model that holds this whole course together is borrowed from aviation. In a small plane with two seats, three roles get distributed:</p>\n+\n+    <ul>\n+      <li><strong>Pilot in command.</strong> Decides where the plane is going, what to do in turbulence, when to land, when to declare an emergency. Signs the logbook.</li>\n+      <li><strong>Co-pilot.</strong> Reads checklists aloud, watches instruments, calculates fuel, suggests headings, double-checks the pilot&rsquo;s work. Does not unilaterally change the destination.</li>\n+      <li><strong>Autopilot.</strong> A subsystem the pilot can <em>engage</em> for stretches of routine flight. Does what it&rsquo;s told. Disengages the moment something interesting happens.</li>\n+    </ul>\n+\n+    <p>In 2026, AI in your spec workflow is most healthily understood as a co-pilot. It reads checklists. It watches instruments you might forget. It calculates things faster than you do. It double-checks your work. But it does <em>not</em> decide where you&rsquo;re going.</p>\n+\n+    <p>Autopilot is a different mode &mdash; and it&rsquo;s genuinely useful for short stretches of routine work. &ldquo;Reformat this checklist as Given/When/Then.&rdquo; &ldquo;Translate this AC into the same shape as last week&rsquo;s AC.&rdquo; That&rsquo;s autopilot territory. Engage it knowingly, for a defined window, for a routine task. And when something interesting happens &mdash; a real product question, a tricky trade-off, a decision &mdash; you take the controls back.</p>\n+\n+    <p>The slip happens when autopilot becomes the default mode of flying. That&rsquo;s when specs start reading like nobody&rsquo;s product. We&rsquo;ll come back to this throughout the course; for now, hold the metaphor lightly.</p>\n+\n+    <h2>The mental model: Driver, Co-pilot, Spec</h2>\n+\n+    <p>Here&rsquo;s the diagram you can keep on a sticky note:</p>\n+\n+    <div class=\"workflow-steps\">\n+      <div class=\"step\">Driver (you)</div>\n+      <div class=\"step-arrow\">&harr;</div>\n+      <div class=\"step\">Co-pilot (AI)</div>\n+      <div class=\"step-arrow\">&rarr;</div>\n+      <div class=\"step\">Spec</div>\n+    </div>\n+\n+    <p>Three nodes, two arrows. The two arrows do different work:</p>\n+\n+    <ul>\n+      <li><strong>Driver &harr; Co-pilot</strong> is a conversation. You ask, the model answers. You push back, the model adjusts. You provide context, the model uses it. This loop should run many times per spec.</li>\n+      <li><strong>Co-pilot &rarr; Spec</strong> is a draft. Words appear. Headings populate. Lists grow. None of this is final until <em>you</em> read it, edit it, and put your name on it.</li>\n+    </ul>\n+\n+    <p>Notice what&rsquo;s missing: there is no direct arrow from the model to the final spec without you. If your workflow ever skips that step &mdash; if the AI&rsquo;s output flows straight to the engineering ticket &mdash; the model gets to make product decisions you didn&rsquo;t intend to delegate.</p>\n+\n+    <h2>A concrete example: the in-app feedback widget</h2>\n+\n+    <p>Let&rsquo;s walk through a small, realistic scenario. Your VP says: <em>&ldquo;We need a way for users to send us feedback inside the app. Can you scope it for next sprint?&rdquo;</em></p>\n+\n+    <p>The autopilot version: you open ChatGPT, type &ldquo;Write a PRD for an in-app feedback widget,&rdquo; copy the result into your doc, fix two typos, attach to the ticket. Total time: 8 minutes. The result is generic.</p>\n+\n+    <p>The co-pilot version takes about the same time, but it looks different:</p>\n+\n+    <ul>\n+      <li><em>Minute 1&ndash;2:</em> You write three lines yourself, no AI. <strong>Problem:</strong> we&rsquo;re losing power-user signal. <strong>Users:</strong> the 200 most active accounts. <strong>Success:</strong> we hear from at least 20% of them per quarter. These three lines are <em>your</em> product judgment.</li>\n+      <li><em>Minute 3&ndash;5:</em> You hand those three lines to your AI tool with the prompt: &ldquo;Given this problem framing, draft a PRD outline with Goals, Non-goals, UX shape, AC, and Open questions. Don&rsquo;t fill the sections yet &mdash; just the outline.&rdquo;</li>\n+      <li><em>Minute 5&ndash;7:</em> You review the outline, drop the section that doesn&rsquo;t apply (&ldquo;Localization&rdquo; &mdash; you&rsquo;re English-only this quarter), and ask the AI to fill <em>Open questions</em> only. You write the Goals and Non-goals yourself, in your own voice.</li>\n+      <li><em>Minute 8:</em> You attach the spec to the ticket with a note: &ldquo;Goals and Non-goals are mine. Open-questions list is AI-drafted &mdash; please push back where it&rsquo;s wrong.&rdquo;</li>\n+    </ul>\n+\n+    <p>Same 8 minutes. Wildly different artifact. The second version reads like <em>your</em> product because the parts that hold the product judgment were written by you, in your voice. The AI did the parts where speed matters and judgment doesn&rsquo;t.</p>\n+\n+    <p>To make the difference visible, here&rsquo;s the opening of the autopilot version next to the co-pilot version &mdash; same feature, same eight minutes, two different artifacts:</p>\n+\n+    <div class=\"spec-snippet spec-before\">\n+Feature: In-App Feedback Widget\n+\n+Goal: Build a robust, scalable feedback solution that delights\n+users and drives engagement.\n+\n+Users: All users.\n+\n+Success: Feedback volume increases by 30%.\n+\n+Acceptance criteria:\n+- User can submit feedback from anywhere in the app.\n+- Feedback is saved to the backend.\n+- The widget is accessible.\n+- The widget is performant.\n+    </div>\n+\n+    <div class=\"spec-snippet spec-after\">\n+Feature: Power-User Feedback Capture\n+\n+Problem: Our 200 most active accounts are the source of 80% of\n+our roadmap signal, and we currently have no in-product way to\n+hear from them. They send feedback via support tickets, which\n+means our highest-signal users are routed through a\n+complaint-shaped channel.\n+\n+Users: The 200 accounts with &gt;10 sessions/week. Not free-tier\n+users this quarter (separate spec, Q3).\n+\n+Goals: At least 20% of power-user accounts submit at least one\n+piece of feedback per quarter via the widget.\n+\n+Non-goals: Mobile (web-only this release). Localization\n+(English-only this quarter). Sentiment classification.\n+\n+Open questions [AI-drafted, please push back]:\n+- Should the widget be persistent or contextual?\n+- Do we want feedback tagged by route/page automatically?\n+- What happens when a user submits the same feedback twice?\n+    </div>\n+\n+    <p>The &ldquo;before&rdquo; isn&rsquo;t wrong, exactly &mdash; it&rsquo;s just generic. It could be the spec for any feedback widget, in any product, by any PM. The &ldquo;after&rdquo; could only have been written by someone who knows that <em>this</em> product has 200 power-user accounts, that <em>this</em> team is web-only this quarter, and that the goal isn&rsquo;t volume &mdash; it&rsquo;s coverage of a specific cohort. That&rsquo;s the entire game.</p>\n+\n+    <h2>What changed between 2020 and 2026 (and what didn&rsquo;t)</h2>\n+\n+    <p>To anchor the &ldquo;same shape, different pace&rdquo; idea, here&rsquo;s a quick contrast. The job is recognizable; the leverage is new.</p>\n+\n+    <table>\n+      <thead>\n+        <tr>\n+          <th>Activity</th>\n+          <th>2020 PM</th>\n+          <th>2026 PM with AI co-pilot</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>First-pass PRD draft</td>\n+          <td>2&ndash;4 hours, blank page</td>\n+          <td>20&ndash;40 minutes, outline-driven</td>\n+        </tr>\n+        <tr>\n+          <td>Edge-case enumeration</td>\n+          <td>Whatever you remembered to think of</td>\n+          <td>12 candidates in 30 seconds; you pick 4</td>\n+        </tr>\n+        <tr>\n+          <td>Pressure-test before review</td>\n+          <td>Mostly skipped under deadline</td>\n+          <td>Three reviewer personas in 10 minutes</td>\n+        </tr>\n+        <tr>\n+          <td>Reformat for stakeholders</td>\n+          <td>Manual rewrite per audience</td>\n+          <td>Same content, three versions, in minutes</td>\n+        </tr>\n+        <tr>\n+          <td>Picking the right problem</td>\n+          <td>Yours</td>\n+          <td>Still yours</td>\n+        </tr>\n+        <tr>\n+          <td>Defending the metric you&rsquo;ll be judged on</td>\n+          <td>Yours</td>\n+          <td>Still yours</td>\n+        </tr>\n+        <tr>\n+          <td>Saying &ldquo;not this quarter&rdquo;</td>\n+          <td>Yours</td>\n+          <td>Still yours</td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <p>The bottom three rows haven&rsquo;t moved &mdash; and probably won&rsquo;t. They&rsquo;re what makes the role a role, not a function call.</p>\n+\n+    <h2>Tool-agnostic principles, not tool-specific tricks</h2>\n+\n+    <p>You&rsquo;ll notice this course doesn&rsquo;t teach you Copilot&rsquo;s shortcuts or Claude&rsquo;s slash commands or how to attach a file in Gemini. That&rsquo;s deliberate.</p>\n+\n+    <p>The tools change every quarter. The interface that was state-of-the-art in January is mid-tier by July. Your team might switch from ChatGPT to Windsurf because of a procurement change. A new model arrives and the prompts that worked last month need a tune-up.</p>\n+\n+    <p>What persists is the craft &mdash; the way you frame problems, the questions you ask, the patterns you watch for, the shape of the spec you keep landing on. That&rsquo;s what this course teaches.</p>\n+\n+    <p>So when we say &ldquo;ask your AI tool to&hellip;&rdquo; we mean it. The principle works in Copilot. It works in Claude (chat or Code). It works in ChatGPT. It works in Windsurf. It works in Gemini. If a technique only works in one tool, it&rsquo;s a trick, and we mostly skip it.</p>\n+\n+    <div class=\"tip-box\">\n+      A useful rule of thumb: if a technique stops working when your team switches tools next year, it wasn&rsquo;t really part of your craft. It was a workaround. The craft is the part that survives the migration.\n+    </div>\n+\n+    <h2>What this course does &mdash; and doesn&rsquo;t &mdash; do</h2>\n+\n+    <p>To make the deal honest, here&rsquo;s the scope.</p>\n+\n+    <p><strong>What this course will do:</strong> teach you a repeatable craft for writing specs with AI assistance. We&rsquo;ll cover sharpening fuzzy ideas (chapter 3), discovery conversations (chapter 4), writing PRDs in your voice (chapter 5), generating acceptance criteria and edge cases (chapter 6), pressure-testing your own spec before engineering does (chapter 7), spotting AI-generated noise with seven smell tests (chapter 8), handing specs to engineers transparently (chapter 9), iterating after feedback (chapter 10), building your own personal AI PM kit (chapter 11), and the daily habits that keep the practice sustainable (chapter 12).</p>\n+\n+    <p><strong>What this course won&rsquo;t do:</strong> push a single SDD framework. We won&rsquo;t teach you BMAD, OpenSpec, Shape Up, or any other capital-letter methodology as <em>the</em> way. We&rsquo;ll mention them as one option among many. We won&rsquo;t teach a single tool&rsquo;s UI. And we won&rsquo;t pretend that AI replaces customer interviews, sales conversations, support data, or strategic disagreement with your CEO.</p>\n+\n+    <h2>What &ldquo;in the driver&rsquo;s seat&rdquo; means in practice</h2>\n+\n+    <p>Throughout this course, you&rsquo;ll see boxes labeled <strong>Driver&rsquo;s Seat</strong>. They flag specific moments where the decision is yours and the AI cannot help, only listen. Today, the message of every single one of those boxes is the same:</p>\n+\n+    <p><strong>You sign the spec.</strong></p>\n+\n+    <p>It doesn&rsquo;t matter how much of the prose you wrote yourself versus how much the AI drafted. It doesn&rsquo;t matter whether your stand-up notes were summarized by Gemini and your AC was expanded by Claude. When the spec lands in the ticket, it has your name on it. That signature means: <em>I&rsquo;ve read this, I stand behind this, I will defend this in review, and I will own the outcome.</em></p>\n+\n+    <p>Everything else in this course &mdash; every workflow, every prompt, every smell test &mdash; serves that signature.</p>\n+\n+    <h2>A second vignette: 3 p.m., research synthesis</h2>\n+\n+    <p>Same Tuesday. It&rsquo;s mid-afternoon. You have eleven user-interview transcripts on your desk &mdash; recorded last week by your researcher &mdash; and a director who wants &ldquo;the top three themes&rdquo; before Thursday.</p>\n+\n+    <p>The 2020 version of this task: a yellow legal pad, two highlighters, and most of Thursday morning. You&rsquo;d skim, jot themes, recluster, and probably miss the quietest one.</p>\n+\n+    <p>The 2026 version: you paste each transcript into a workspace &mdash; today it happens to be Gemini, on another day it would be Claude or Copilot Chat. You ask for two things, separately:</p>\n+\n+    <ol>\n+      <li>&ldquo;Across these eleven transcripts, list every distinct pain point. Tag each with the participant ID. Do not cluster yet.&rdquo;</li>\n+      <li>&ldquo;Now group the pain points into 3&ndash;7 themes. For each theme, give me the strongest verbatim quote from the transcripts.&rdquo;</li>\n+    </ol>\n+\n+    <p>Twelve minutes later you have a candidate list of 6 themes with verbatim quotes. You read all of them &mdash; this is non-negotiable. You drop two: one is the model over-generalizing from a single grumpy user, and one is a real concern but for a segment that&rsquo;s out of scope this quarter. You merge two more because they&rsquo;re the same theme dressed up differently.</p>\n+\n+    <p>Final output: three themes, each backed by 2&ndash;4 verbatim quotes pulled directly from real interviews. Time: under an hour. Quality: <em>better</em> than the 2020 version, because the AI surfaced the quietest theme &mdash; the one buried in two transcripts you would&rsquo;ve filed under &ldquo;misc&rdquo; on a hurried Thursday morning.</p>\n+\n+    <p>What the AI did: read fast, listed exhaustively, grouped plausibly, and offered candidate quotes. What you did: validated against real customer voice, removed over-generalizations, scoped to this quarter, and chose the three themes you&rsquo;d defend in front of the director. The synthesis is yours; the legwork wasn&rsquo;t.</p>\n+\n+    <div class=\"warning-box\">\n+      One specific risk worth naming: when an AI tool summarizes interview transcripts, it can subtly &ldquo;clean up&rdquo; quotes &mdash; smoothing grammar, paraphrasing in its own voice, attributing a sentiment a participant never quite said. Always verify quoted material against the source transcript before putting it in front of leadership. The principle is broader than this example: <em>the closer the output is to the customer&rsquo;s actual words, the more carefully you check.</em>\n+    </div>\n+\n+    <h2>A short, honest note on speed</h2>\n+\n+    <p>Some of what AI gives you is speed. Drafting that took an hour now takes ten minutes. Pressure-testing that took a half-day now takes twenty minutes. That&rsquo;s real.</p>\n+\n+    <p>The temptation is to spend the saved time on more specs &mdash; produce more, ship more, fill more tickets. There&rsquo;s a healthier alternative: spend some of the saved time on the parts of the job that AI <em>can&rsquo;t</em> accelerate. Customer calls. Sitting with the data. The walk where you actually think about whether this feature is the right one. Calibrating with one engineer for fifteen minutes. The hard conversation with your stakeholder about scope.</p>\n+\n+    <p>That&rsquo;s the other promise of the co-pilot model: it doesn&rsquo;t just help you write specs faster. It clears space for the parts of your job that mattered most all along.</p>\n+\n+    <h2>Five questions you might be holding right now</h2>\n+\n+    <p>If you&rsquo;re sitting with this material for the first time, a few questions tend to come up. Quick answers; we&rsquo;ll deepen each one in later chapters.</p>\n+\n+    <h3>&ldquo;Should I disclose that AI helped write the spec?&rdquo;</h3>\n+    <p>Yes &mdash; in proportion. You don&rsquo;t need a footnote on every sentence, but where a section is heavily AI-drafted (e.g., &ldquo;edge cases&rdquo; or &ldquo;open questions&rdquo;), a one-line note saying so builds trust with engineers and reviewers. We unpack this in chapter 9 (&ldquo;The Engineering Handoff&rdquo;).</p>\n+\n+    <h3>&ldquo;What if my company hasn&rsquo;t approved a tool yet?&rdquo;</h3>\n+    <p>Use whatever&rsquo;s sanctioned, even if it&rsquo;s not state-of-the-art. The craft in this course works in any modern model. If you&rsquo;re still in approval limbo, the parts you can practice today &mdash; sharpening problem statements (chapter 3), pressure-testing your spec (chapter 7), running smell tests (chapter 8) &mdash; mostly happen in your head and on the page anyway.</p>\n+\n+    <h3>&ldquo;Won&rsquo;t engineers resent AI-augmented specs?&rdquo;</h3>\n+    <p>In practice, what engineers resent is opaque specs &mdash; ones where they can&rsquo;t tell what&rsquo;s confirmed, what&rsquo;s assumed, and what came from where. Transparency dissolves most of that resistance. AI use is fine; AI laundering &mdash; quietly passing off generic output as your considered judgment &mdash; is what erodes trust.</p>\n+\n+    <h3>&ldquo;Am I going to get worse at writing if I lean on AI?&rdquo;</h3>\n+    <p>Only if you stop reading what you ship. The PMs who get worse are the ones who stop noticing the difference between a sentence they&rsquo;d write and a sentence the model writes for them. The PMs who get better treat AI drafts as <em>raw material</em> they edit toward their voice. Chapter 12 covers the daily habits that keep you on the second path.</p>\n+\n+    <h3>&ldquo;Is there a single &lsquo;right&rsquo; tool I should use?&rdquo;</h3>\n+    <p>No. The honest answer is: pick the one your team already pays for, and learn it well. Most spec-craft moves work in Copilot, Windsurf, Claude, ChatGPT, and Gemini. The differences between models matter at the margins, especially for very long context windows or specific integrations &mdash; but the core craft is portable.</p>\n+\n+    <div class=\"exercise-box\">\n+      <p><strong>Try It: The 30% rule, in five minutes.</strong></p>\n+      <p>Pick one spec or document you produced this past week &mdash; a PRD, an AC list, a one-pager, a stakeholder update, anything.</p>\n+      <ol>\n+        <li>Read it through once.</li>\n+        <li>Highlight the sentences that contain your <em>actual product judgment</em> &mdash; calls only you could&rsquo;ve made (e.g., &ldquo;we&rsquo;re not solving this for free users this quarter&rdquo;, &ldquo;the metric we care about is X, not Y&rdquo;).</li>\n+        <li>Estimate roughly what percentage of the document those highlighted sentences are.</li>\n+      </ol>\n+      <p>If it&rsquo;s 30% or more, you&rsquo;re in good shape. If it&rsquo;s under 10%, that&rsquo;s a signal worth noticing &mdash; not a failure, but a pointer. The next eleven chapters are essentially about how to push that number up while keeping AI&rsquo;s leverage. There&rsquo;s no &ldquo;right&rdquo; answer; the exercise is the noticing.</p>\n+    </div>\n+\n+    <h2>Where this leaves us</h2>\n+\n+    <p>You came in knowing AI is part of the PM job now. What we hope you walk out of this chapter with is a clearer sense of <em>which</em> part &mdash; and which part isn&rsquo;t. AI accelerates drafting, expanding, summarizing, pressure-testing, and formatting. It does not pick problems, validate users, decide scope, defend metrics, or sign specs. The rest of this course is the working-out of that distinction across every step of spec craft, with concrete techniques you can practice this week.</p>\n+\n+    <p>If you only remember a few things from this chapter, let them be these:</p>\n+\n+    <ul class=\"checklist\">\n+      <li class=\"checked\">AI in spec work is a <strong>co-pilot</strong>, not an autopilot &mdash; engage and disengage knowingly.</li>\n+      <li class=\"checked\">Five things stay yours: judgment, taste, customer truth, accountability, the right to change your mind.</li>\n+      <li class=\"checked\">The mental model is <em>Driver &harr; Co-pilot &rarr; Spec</em> &mdash; never let the model draft straight to the ticket.</li>\n+      <li class=\"checked\">Specs that read like &ldquo;anyone&rsquo;s product&rdquo; are the early warning sign worth listening for.</li>\n+      <li class=\"checked\">Tool-agnostic principles outlast tool-specific tricks &mdash; we&rsquo;re teaching the principles.</li>\n+      <li class=\"checked\">You sign the spec. That signature is the whole point.</li>\n+    </ul>\n+\n+    <div class=\"tip-box\">\n+      Keep a sticky note near your monitor for the next two weeks with just three words: <strong>Driver. Co-pilot. Spec.</strong> Each time you open an AI tool to work on a spec, glance at it. If you can&rsquo;t articulate which arrow you&rsquo;re currently flying, pause for ten seconds. That tiny habit is most of what keeps this practice honest.\n+    </div>\n+\n+    <h2>Coming up next</h2>\n+\n+    <p>Before we touch any AI tool in earnest, we need to be precise about what &ldquo;your part&rdquo; actually contains. Chapter 2 names the five irreducible decisions only you make on every spec &mdash; problem worth solving, who the user is, scope in/out, what success looks like, when it&rsquo;s good enough to ship. We&rsquo;ll show how to use AI as a sounding board for each, without quietly handing the decision over.</p>\n+\n+    <p>Once those five are crisp in your head, every prompt, every draft, and every review in the rest of the course gets sharper. The chapters after that turn the model into action: sharpening fuzzy ideas, running discovery, writing the PRD, generating AC, pressure-testing, smell-testing AI output, handing off to engineers, iterating on feedback, and ultimately building a personal kit and the daily habits that keep all of this sustainable. Twelve chapters from now, you should have a craft that holds up no matter which tool your team uses next year.</p>\n+\n+    <nav class=\"chapter-nav\">\n+      <a href=\"index.html\">\n+        <span class=\"nav-direction\">&larr; Back to</span>\n+        <span class=\"nav-chapter\">Contents</span>\n+      </a>\n+      <a href=\"02-the-driving-seat.html\" class=\"next\">\n+        <span class=\"nav-direction\">Next chapter</span>\n+        <span class=\"nav-chapter\">2. The Driving Seat: 5 Decisions Only You Make &rarr;</span>\n+      </a>\n+    </nav>\n+\n+  </main>\n+\n+  <footer class=\"site-footer\">\n+    <p>Spec Craft With AI For Dummies &copy; 2026. Built with AI assistance.</p>\n+  </footer>",
