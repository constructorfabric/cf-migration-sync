          "diff_hunk": "@@ -0,0 +1,439 @@\n+<!DOCTYPE html>\n+<html lang=\"en\">\n+<head>\n+  <meta charset=\"UTF-8\">\n+  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n+  <title>Memory Map &mdash; Chapter 9: The Engineering Handoff</title>\n+  <link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>\">\n+  <link rel=\"stylesheet\" href=\"../assets/style.css\">\n+</head>\n+<body>\n+\n+  <nav class=\"top-nav\">\n+    <span class=\"nav-title\">Spec Craft With AI</span>\n+    <div class=\"nav-links\">\n+      <a href=\"../index.html\">Contents</a>\n+      <a href=\"../09-engineering-handoff.html\">Chapter</a>\n+      <a href=\"08-seven-smell-tests-map.html\">&larr; Prev Map</a>\n+      <a href=\"10-iterating-after-feedback-map.html\">Next Map &rarr;</a>\n+      <button class=\"theme-toggle\" aria-label=\"Toggle theme\">🌙</button>\n+    </div>\n+  </nav>\n+\n+  <header class=\"map-header\">\n+    <span class=\"chapter-number\">Chapter 9</span>\n+    <h1>The Engineering Handoff</h1>\n+    <span class=\"map-badge\">Memory Map</span>\n+  </header>\n+\n+  <main>\n+\n+    <div class=\"map-big-idea\">\n+      <span class=\"big-idea-icon\">🤝</span>\n+      <h3>The Big Idea</h3>\n+      <p><strong>The handoff is the moment trust is built or burned.</strong> Engineers in 2026 read every spec with two new silent questions on top of the old ones: <em>where did this come from</em> (provenance) and <em>how sure are you</em> (confidence). The high-leverage move isn&rsquo;t to use less AI &mdash; it&rsquo;s to make the answers to those questions <strong>visible by default</strong> in the document, so engineering doesn&rsquo;t have to play detective. <strong>Honesty beats polish, every time.</strong></p>\n+    </div>\n+\n+    <h2>🎯 What Engineers Actually Want in 2026</h2>\n+\n+    <div class=\"map-relationships\">\n+      <div class=\"map-rel-node\">📋 Clear problem<br><small>(unchanged from 2020)</small></div>\n+      <div class=\"map-rel-node\">📐 Defined scope<br><small>(unchanged)</small></div>\n+      <div class=\"map-rel-center\">+ Two new asks:<br><strong>Provenance</strong><br>+<br><strong>Confidence</strong></div>\n+      <div class=\"map-rel-node\">✅ Testable AC<br><small>(unchanged)</small></div>\n+      <div class=\"map-rel-node\">🧭 Named decisions + reasons<br><small>(unchanged)</small></div>\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">In 2020, the default trust was <em>&ldquo;the PM saw something to write this.&rdquo;</em> In 2026, the default trust is <em>&ldquo;any claim could have come from a model unless the spec says otherwise.&rdquo;</em> <strong>The conventions in this chapter restore the old contract under new conditions.</strong></p>\n+\n+    <h2>🧰 The Four Trust-Building Conventions</h2>\n+\n+    <div class=\"map-grid\">\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">🏷️</span>\n+        <div class=\"map-card-title\">1. Inline annotations</div>\n+        <div class=\"map-card-desc\">Two markers, no taxonomy: <code>[CONFIRMED &mdash; source]</code> and <code>[ASSUMPTION]</code>. Only on load-bearing claims, not every sentence. <strong>Three minutes of marking saves twenty minutes of review.</strong></div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">📣</span>\n+        <div class=\"map-card-title\">2. AI-assistance disclosure</div>\n+        <div class=\"map-card-desc\">One line at the top: <em>&ldquo;AI-assisted draft. Sections marked [DRAFTED-WITH-AI] reviewed and edited by me. All decisions, scope, and metrics are mine.&rdquo;</em> Hiding it costs more than disclosing it.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">❓</span>\n+        <div class=\"map-card-title\">3. Open questions at the top</div>\n+        <div class=\"map-card-desc\">Right after the problem statement &mdash; before AC, scope, or metrics. 3&ndash;5 questions, each with a named owner and (in async) a default behavior if no one weighs in.</div>\n+      </div>\n+      <div class=\"map-card\">\n+        <span class=\"map-card-icon\">📒</span>\n+        <div class=\"map-card-title\">4. Decision log (the receipt)</div>\n+        <div class=\"map-card-desc\">One dated line per change at the top of the spec, in chronological order. <strong>Cuts as well as additions.</strong> ~1 minute per edit. Anyone can re-read and see what shifted, including future-you.</div>\n+      </div>\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">None require tooling &mdash; they&rsquo;re just text patterns. <strong>Roll them out one at a time:</strong> open-questions block first (lowest friction, highest immediate value), then inline markers, then disclosure, then decision log. Trying all four at once feels like process; one at a time, each one proves itself.</p>\n+\n+    <h2>🏷️ Annotated AC &mdash; Before vs. After</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>Pre-annotation (sounds confident)</th>\n+          <th>Annotated for handoff (more useful)</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>&ldquo;Invite link valid for seven days.&rdquo;</td>\n+          <td>&ldquo;Seven days <code>[ASSUMPTION &mdash; matches our other expiry windows]</code>&rdquo;</td>\n+        </tr>\n+        <tr>\n+          <td>&ldquo;Recipient sees workspace + inviter name, then &lsquo;Accept and Sign In&rsquo; button.&rdquo;</td>\n+          <td>Same text + <code>[CONFIRMED &mdash; design review with M., 2026-04-22]</code></td>\n+        </tr>\n+        <tr>\n+          <td>&ldquo;40% of invites fail because of spam.&rdquo;</td>\n+          <td>&ldquo;40% fail <code>[CONFIRMED &mdash; invite-funnel report]</code>; spam attribution <code>[ASSUMPTION]</code>&rdquo;</td>\n+        </tr>\n+        <tr>\n+          <td>&ldquo;The new flow will reduce that to under 10%.&rdquo;</td>\n+          <td>&ldquo;Target under 10% <code>[ASSUMPTION &mdash; aspirational, not derived from a model]</code>&rdquo;</td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">The &ldquo;after&rdquo; is longer and less elegant. <strong>It&rsquo;s also five distinct conversations the meeting won&rsquo;t need to have</strong> to figure out which paragraphs are stable. &ldquo;Assumption&rdquo; isn&rsquo;t a confession &mdash; it&rsquo;s a hand-off saying <em>&ldquo;here&rsquo;s the call I made; I&rsquo;d welcome a better answer.&rdquo;</em></p>\n+\n+    <h2>🗣️ Three Flavors of Engineering Pushback</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>Flavor</th>\n+          <th>Sounds like</th>\n+          <th>Right response</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>🔍 <strong>Provenance</strong></td>\n+          <td><em>&ldquo;Where did this number come from?&rdquo; &ldquo;Did anyone validate this?&rdquo; &ldquo;This AC reads like it was generated.&rdquo;</em></td>\n+          <td>Answer plainly. If real, name the source. If AI brainstorm or your guess, say so and offer to mark it. <strong>One honest sentence solves it.</strong></td>\n+        </tr>\n+        <tr>\n+          <td>📐 <strong>Scope</strong></td>\n+          <td><em>&ldquo;Do we really need this in v1?&rdquo; &ldquo;What if we cut X?&rdquo; &ldquo;This feels like a separate spec.&rdquo;</em></td>\n+          <td>Weigh against the problem statement. If the cut still solves it, take it. If not, explain why the cut breaks the spec. <strong>This is the conversation engineering most wants to have.</strong></td>\n+        </tr>\n+        <tr>\n+          <td>⚙️ <strong>Technical reality</strong></td>\n+          <td><em>&ldquo;Our permissions don&rsquo;t work that way.&rdquo; &ldquo;That edge case can&rsquo;t happen.&rdquo; &ldquo;That metric isn&rsquo;t derivable from our data.&rdquo;</em></td>\n+          <td>Almost always update the spec. They&rsquo;re telling you a fact about the system. <strong>Resist arguing from first principles &mdash; their domain knowledge is exactly the thing AI couldn&rsquo;t give you.</strong></td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">Most reviews mix all three flavors in one conversation. <strong>Label each comment in your head as it arrives</strong> &mdash; provenance, scope, technical reality &mdash; and answer in the shape that fits. The temperature of the room drops when engineers see you responding precisely rather than defensively.</p>\n+\n+    <h2>🚦 Hold or Fold &mdash; Reading Pushback in Real Time</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>✅ They&rsquo;re right &mdash; update the spec</th>\n+          <th>🛡️ Hold the line, politely</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>Names a constraint you didn&rsquo;t know about (existing system, permissions, deployment quirk)</td>\n+          <td>Re-litigates a product decision you already made for product reasons</td>\n+        </tr>\n+        <tr>\n+          <td>Exposes a load-bearing assumption you marked as one &mdash; that&rsquo;s the conversation that&rsquo;s supposed to happen</td>\n+          <td>Would shift scope to a different problem (&ldquo;what if we also did X?&rdquo; = follow-up, not same-spec change)</td>\n+        </tr>\n+        <tr>\n+          <td>Comes with a concrete alternative addressing the same goal at lower cost or risk</td>\n+          <td>Boils down to &ldquo;cheaper if we built less&rdquo; &mdash; sometimes true, often anchoring on cost. Weigh, don&rsquo;t obey.</td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">When you can&rsquo;t tell in the moment: <em>&ldquo;Let me think about this and come back tomorrow.&rdquo;</em> One of the most underused sentences in spec reviews. Costs nothing, signals seriousness, and lets you talk it through with Claude / ChatGPT / Copilot Chat <strong>offline</strong> rather than performing a decision live.</p>\n+\n+    <h2>🚫 Separate the Review from the Rewrite</h2>\n+\n+    <div class=\"map-flow\">\n+      <div class=\"map-flow-step\">📝 Take notes<br><small>during review</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">✅ Acknowledge<br><small>commit to follow-up</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">🪑 Back to your desk<br><small>think + re-prompt</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">👃 Smell-test<br><small>the revision</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">📤 Bring it back<br><small>with a log entry</small></div>\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">Don&rsquo;t live-prompt your AI assistant during the review. The room is there to talk to <em>you</em>, not a chat window. <strong>The cycle is slightly longer; the trust margin is much higher.</strong> Exception: looking up a known fact in your notes is research, not generation. Engineers can usually tell the difference.</p>\n+\n+    <h2>👀 Reading the Room in the First Five Minutes</h2>\n+\n+    <ol class=\"map-timeline\">\n+      <li class=\"map-timeline-item\" data-step=\"1\">\n+        <h4>✅ Landing well: specific questions</h4>\n+        <p><em>&ldquo;On AC 3, what happens if &mdash;&rdquo; &ldquo;Can we instrument that with what we have?&rdquo;</em> Specific questions mean the spec is concrete enough to engage directly. <strong>That&rsquo;s the goal.</strong></p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"2\">\n+        <h4>⚠️ Landing poorly: generic questions</h4>\n+        <p><em>&ldquo;What problem are we solving?&rdquo; &ldquo;Who is this for?&rdquo;</em> The spec didn&rsquo;t answer load-bearing context up front. <strong>Re-frame, don&rsquo;t tweak.</strong> Acknowledge it: <em>&ldquo;framing isn&rsquo;t landing; let me re-do that.&rdquo;</em></p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"3\">\n+        <h4>🪞 Landing as too polished: silence + glances</h4>\n+        <p>Engineers go quiet, exchange glances, then ask provenance questions in clusters. The AI-skepticism reflex is firing. <strong>Name the elephant explicitly:</strong> <em>&ldquo;Anything in here read like AI rather than thought through? Tell me which sections.&rdquo;</em></p>\n+      </li>\n+    </ol>\n+\n+    <h2>💬 Review-Comment Etiquette &mdash; The Two-Sentence Rule</h2>\n+\n+    <div class=\"spec-snippet\">\n+<strong>Async-comment response template</strong>\n+\n+Sentence 1: Acknowledge the specific point.\n+Sentence 2: State your call &mdash; agree+update,\n+            disagree+explain, or defer with a date.\n+\n+That&rsquo;s it. No essay.\n+\n+If the answer needs to be longer because the question is\n+genuinely complex: don&rsquo;t write a longer comment &mdash;\n+schedule a 15-minute call. Async threads are not the right\n+tool for unresolved disagreement.\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">Pasting a comment into your AI assistant and posting back the polished result <strong>reads as polish</strong> &mdash; engineers spot it within two threads. The polish gives it away. Two specific sentences beat four AI-generated paragraphs every time.</p>\n+\n+    <h2>🔄 Recovery from a Handoff That Went Sideways</h2>\n+\n+    <ol class=\"map-timeline\">\n+      <li class=\"map-timeline-item\" data-step=\"1\">\n+        <h4>In the meeting: one sentence</h4>\n+        <p><em>&ldquo;That&rsquo;s fair. Let me re-do this and bring it back. What would make the next version land for you?&rdquo;</em> Don&rsquo;t defend further. Don&rsquo;t litigate. <strong>Engineers respect a PM who absorbs feedback; they distrust one who argues the comments away.</strong></p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"2\">\n+        <h4>List every comment, even the ones that felt off</h4>\n+        <p>Treat each one as data, not as judgment. The unfair-feeling ones still tell you something about how the spec landed.</p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"3\">\n+        <h4>Sort into the three flavors</h4>\n+        <p>Provenance, scope, technical reality. Address each in the shape that fits.</p>\n+      </li>\n+      <li class=\"map-timeline-item\" data-step=\"4\">\n+        <h4>Bring it back &mdash; lead with what changed and why</h4>\n+        <p><em>&ldquo;Eight comments incorporated, two declined with reasons, one deferred. Decision log updated. Provenance gaps now annotated inline.&rdquo;</em> Turns a rough first review into the story of a PM who listened &mdash; <strong>the most durable trust there is</strong>.</p>\n+      </li>\n+    </ol>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\"><strong>Don&rsquo;t apologize for using AI.</strong> The room didn&rsquo;t reject the spec because it was AI-augmented &mdash; it rejected it because the spec wasn&rsquo;t honest enough about what it was confident in. The recovery is to be <em>more</em> honest, not to use less AI.</p>\n+\n+    <h2>🔬 The Smell Test for Handoff</h2>\n+\n+    <div class=\"smell-test\">\n+      <p><strong>The tell.</strong> An engineer points at a sentence, paragraph, or AC and asks, &ldquo;Where did this come from?&rdquo; You hesitate, look at it again, and realize you&rsquo;re not sure.</p>\n+      <p><strong>The check.</strong> Before the meeting, scan the spec. For each AC, each metric, each edge case &mdash; can you answer &ldquo;where did this come from&rdquo; in one short sentence? <em>&ldquo;Support ticket dashboard.&rdquo; &ldquo;My interview with X.&rdquo; &ldquo;AI brainstorm; I judged it in-scope.&rdquo; &ldquo;Assumption I made because we needed a placeholder.&rdquo;</em> Any of those is fine. <strong>Hesitation is the tell.</strong></p>\n+      <p><strong>The fix.</strong> Annotate the hesitating lines before review. Most often a parenthetical: <code>[ASSUMPTION]</code>, <code>[from support ticket #4421]</code>, <code>[my call &mdash; not yet validated]</code>. <strong>Three minutes of this saves twenty minutes of review.</strong></p>\n+    </div>\n+\n+    <h2>🚧 What Does NOT Help: Silent Expansion</h2>\n+\n+    <table class=\"map-compare\">\n+      <thead>\n+        <tr>\n+          <th>❌ Silent expansion</th>\n+          <th>✅ Marked rewrite</th>\n+        </tr>\n+      </thead>\n+      <tbody>\n+        <tr>\n+          <td>Engineering raises a question; PM asks AI to &ldquo;flesh out&rdquo; the spec; three new paragraphs appear</td>\n+          <td>Same revision &mdash; but <strong>marked with a date</strong> and a one-line decision-log entry</td>\n+        </tr>\n+        <tr>\n+          <td>No diff highlighted, no log entry, no mention in the next review</td>\n+          <td>Engineering can see at a glance what changed since their last read</td>\n+        </tr>\n+        <tr>\n+          <td>Spec is the same length; trust profile is broken</td>\n+          <td>Spec is the same length; trust profile is intact</td>\n+        </tr>\n+        <tr>\n+          <td>Cuts forgotten too &mdash; bulk-invite quietly disappears with no log</td>\n+          <td>Cuts logged the same way: <em>&ldquo;Removed bulk-invite per K.&rsquo;s comment; moving to follow-up spec.&rdquo;</em></td>\n+        </tr>\n+      </tbody>\n+    </table>\n+\n+    <h2>🧭 The Mid-Build Check-In</h2>\n+\n+    <p style=\"text-align:center;\">The handoff isn&rsquo;t a single event. The spec keeps mattering all the way through the build.</p>\n+\n+    <div class=\"map-flow\">\n+      <div class=\"map-flow-step\">📅 Standing 15-min weekly<br><small>PM + 1 engineer, no agenda</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">🔍 Catch small misreads<br><small>before they become big</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">📝 Update decision log<br><small>when reality contradicts spec</small></div>\n+      <span class=\"map-flow-arrow\">&rarr;</span>\n+      <div class=\"map-flow-step\">📋 Spec stays in sync<br><small>with what&rsquo;s being built</small></div>\n+    </div>\n+\n+    <p style=\"text-align:center; font-style:italic; opacity:0.85; margin-top:0.5rem;\">Cadence beats depth. <strong>15 minutes weekly catches more than 60 minutes monthly</strong> &mdash; remembering a month of facts is too expensive. Without the check-in, the spec slowly becomes fiction: technically the source of truth, but no one is reading it because it doesn&rsquo;t reflect the current state.</p>\n+\n+    <div class=\"driver-box\">\n+      <p><strong>What&rsquo;s yours: you sign the spec, the AI doesn&rsquo;t.</strong> When the spec ships, your name is on it. When something goes wrong six weeks later and the team holds a post-mortem, no one is going to accept &ldquo;the assistant suggested it&rdquo; as an explanation &mdash; nor should they. The assistant has no skin in the game; you do. That&rsquo;s the source of the role&rsquo;s leverage. Engineering can move fast on your spec because someone with judgment and accountability stood behind every load-bearing claim. <strong>Annotate honestly. Disclose plainly. Push back when you&rsquo;re right; fold gracefully when you&rsquo;re not. Never let the AI be the answer to &ldquo;why is this here.&rdquo; The answer is always you.</strong></p>\n+    </div>\n+\n+    <h2>📒 Key Terms</h2>\n+\n+    <dl class=\"map-terms\">\n+      <dt>Provenance</dt>\n+      <dd>Where a claim came from &mdash; ticket, interview, dashboard, AI brainstorm, your guess. The first new ask engineers bring to spec reading in 2026.</dd>\n+\n+      <dt>Confidence</dt>\n+      <dd>How sure you are about a claim, on a scale from &ldquo;measured&rdquo; to &ldquo;assumption I made because the conversation needed something there.&rdquo; The second new ask.</dd>\n+\n+      <dt>Inline annotation</dt>\n+      <dd>The lightest provenance signal: <code>[CONFIRMED &mdash; source]</code> or <code>[ASSUMPTION]</code> next to load-bearing claims. Two markers, no taxonomy, no tooling. Learn in one sentence.</dd>\n+\n+      <dt>Load-bearing claim</dt>\n+      <dd>A sentence the spec actually depends on &mdash; a number, a behavior, a metric, an edge case. The product&rsquo;s name doesn&rsquo;t need a citation; the 40% number does.</dd>\n+\n+      <dt>AI-assistance disclosure</dt>\n+      <dd>One line at the top of the spec naming that AI was used and that you reviewed and edited the output. Ends the wondering before it starts.</dd>\n+\n+      <dt>Open-questions block</dt>\n+      <dd>3&ndash;5 explicit unresolved questions placed right after the problem statement (not the appendix), each with a named owner. In async, each gets a default behavior if no one weighs in.</dd>\n+\n+      <dt>Decision log</dt>\n+      <dd>One dated line per change at the top of the spec, in chronological order. The receipt that says <em>&ldquo;I changed something on purpose, here&rsquo;s why, here&rsquo;s when.&rdquo;</em> Records cuts as well as additions.</dd>\n+\n+      <dt>Three flavors of pushback</dt>\n+      <dd>Provenance, scope, technical reality. Each wants a different response; mistaking one for another is where reviews go sideways.</dd>\n+\n+      <dt>Live-prompting</dt>\n+      <dd>Opening your AI assistant during the review meeting and reading suggestions back to engineering in real time. Lands badly &mdash; the spec is being rewritten under them by something they can&rsquo;t question. <strong>Take notes; re-draft after.</strong></dd>\n+\n+      <dt>Two-sentence rule</dt>\n+      <dd>Async comment response: sentence one acknowledges the specific point; sentence two states your call (agree+update, disagree+explain, or defer with a date). Beats a polished AI-generated essay.</dd>\n+\n+      <dt>Silent expansion</dt>\n+      <dd>Asking AI to &ldquo;flesh out&rdquo; the spec post-review and quietly shipping new paragraphs without a log entry. The most common quiet trust-eroder.</dd>\n+\n+      <dt>Mid-build check-in</dt>\n+      <dd>A standing 15-minute weekly with one engineer. Catches small misreads cheaply and keeps the spec in sync with reality. Cadence beats depth.</dd>\n+\n+      <dt>The trust dividend</dt>\n+      <dd>The cumulative payoff of these conventions: easier maintenance, shorter reviews, future-you remembers what you decided, the team gradually treats AI-augmented specs as unremarkable.</dd>\n+    </dl>\n+\n+    <h2>❓ Quick Quiz</h2>\n+\n+    <div class=\"map-quiz\">\n+      <details>\n+        <summary>What are the two new asks engineers bring to spec reading in 2026?</summary>\n+        <p class=\"quiz-answer\"><strong>Provenance</strong> (where did this claim come from?) and <strong>confidence</strong> (how sure are you?). The headline asks &mdash; clear problem, scope, testable AC, named decisions &mdash; haven&rsquo;t changed. The two new ones have crept in alongside, because engineers know AI now sits behind a non-trivial portion of spec prose. The conventions in this chapter make those two answers <strong>visible by default</strong>.</p>\n+      </details>\n+      <details>\n+        <summary>What are the four trust-building conventions, in order of rollout?</summary>\n+        <p class=\"quiz-answer\"><strong>1. Open-questions block at the top</strong> (lowest friction, highest immediate value &mdash; start here). <strong>2. Inline annotations</strong> on load-bearing claims (<code>[CONFIRMED &mdash; source]</code> / <code>[ASSUMPTION]</code>). <strong>3. AI-assistance disclosure line</strong> at the top of the spec. <strong>4. Decision log</strong> &mdash; one dated line per change at the top. Roll them out one at a time, not all four at once &mdash; each one proves itself before the next lands.</p>\n+      </details>\n+      <details>\n+        <summary>What are the three flavors of engineering pushback, and how does each want to be answered?</summary>\n+        <p class=\"quiz-answer\"><strong>Provenance pushback</strong> (&ldquo;where did this come from?&rdquo;) &mdash; answer plainly with the source or mark it as an assumption. <strong>Scope pushback</strong> (&ldquo;do we need this in v1?&rdquo;) &mdash; weigh against the problem statement; if the cut still solves it, take the cut. <strong>Technical-reality pushback</strong> (&ldquo;our system doesn&rsquo;t work that way&rdquo;) &mdash; almost always update the spec; their domain knowledge is exactly the thing AI couldn&rsquo;t give you.</p>\n+      </details>\n+      <details>\n+        <summary>Why not live-prompt your AI assistant during the review meeting?</summary>\n+        <p class=\"quiz-answer\">Because engineering is in the room to talk to <em>you</em>, not to a chat window. The moment a model-generated suggestion enters the conversation second-hand, the review stops being a calibration with the PM and becomes a debate with an opaque third party. <strong>Engineers experience that as the spec being rewritten under them, in real time, by something they can&rsquo;t question directly.</strong> Take notes; re-draft after; bring the revision back marked.</p>\n+      </details>\n+      <details>\n+        <summary>What&rsquo;s the smell test for handoff?</summary>\n+        <p class=\"quiz-answer\">The tell: an engineer points at a sentence and asks, &ldquo;Where did this come from?&rdquo; and you hesitate. The check: before the meeting, scan the spec &mdash; for each AC, metric, and edge case, can you answer &ldquo;where did this come from?&rdquo; in one short sentence? <strong>Hesitation is the tell.</strong> The fix: annotate the hesitating lines with <code>[ASSUMPTION]</code> or a source. Three minutes of this saves twenty minutes of review.</p>\n+      </details>\n+      <details>\n+        <summary>What&rsquo;s the recovery move when a handoff goes sideways?</summary>\n+        <p class=\"quiz-answer\">In the meeting: one sentence &mdash; <em>&ldquo;That&rsquo;s fair. Let me re-do this and bring it back. What would make the next version land for you?&rdquo;</em> Don&rsquo;t defend, don&rsquo;t litigate. After the meeting: list every comment (even the ones that felt off), sort into provenance / scope / technical reality, address each in the shape that fits, and bring it back leading with what changed and why. <strong>Engineers respect a PM who absorbs feedback; they distrust one who argues the comments away.</strong> Crucially: <strong>don&rsquo;t apologize for using AI</strong> &mdash; the spec wasn&rsquo;t rejected for being AI-augmented; it was rejected for not being honest enough about what it was confident in.</p>\n+      </details>\n+      <details>\n+        <summary>Why is silent expansion the quietest way to break trust?</summary>\n+        <p class=\"quiz-answer\">Because the spec ends up the same length as before, but engineering has no signal that anything changed. They re-read familiar paragraphs and trust them; new paragraphs slip in alongside, indistinguishable. The fix isn&rsquo;t to stop using AI for rewrites &mdash; it&rsquo;s to <strong>mark every change with a date and a one-line decision-log entry</strong>, including <em>cuts</em>. The spec is the same length either way. The trust profile is completely different.</p>\n+      </details>\n+      <details>\n+        <summary>What do the first five minutes of a spec review tell you?</summary>\n+        <p class=\"quiz-answer\"><strong>Specific questions</strong> = landing well; the spec is concrete enough to engage with directly. <strong>Generic questions</strong> (&ldquo;what problem are we solving?&rdquo;) = landing poorly; needs a re-frame, not a tweak &mdash; admit it in the meeting. <strong>Quiet glances + provenance questions in clusters</strong> = the spec is reading as too polished; AI-skepticism reflex firing. <strong>Name the elephant explicitly:</strong> <em>&ldquo;Anything in here read like AI rather than thought through?&rdquo;</em></p>\n+      </details>\n+      <details>\n+        <summary>Why does the mid-build check-in matter as much as the handoff itself?</summary>\n+        <p class=\"quiz-answer\">Because the handoff isn&rsquo;t a single event &mdash; the spec keeps mattering through the build, and the trust margin set up at handoff either grows or erodes depending on what happens in the middle weeks. A standing <strong>15-minute weekly with one engineer</strong> catches small misreads before they become big ones, and updates the decision log when reality contradicts the spec. Without it, the spec slowly becomes fiction. <strong>Cadence beats depth</strong> &mdash; weekly 15s catch more than monthly hours.</p>\n+      </details>\n+    </div>\n+\n+    <div class=\"map-summary\">\n+      <h3>Key Takeaways</h3>\n+      <ul>\n+        <li class=\"map-summary-item\"><strong>The handoff is where trust is built or burned.</strong> Engineers decide in 3&ndash;5 minutes whether the spec is one they trust or one they have to defend themselves against.</li>\n+        <li class=\"map-summary-item\">Two new asks in 2026: <strong>provenance</strong> (where did this come from?) and <strong>confidence</strong> (how sure are you?). The conventions make both visible by default.</li>\n+        <li class=\"map-summary-item\">Default trust shifted: in 2020, every claim was assumed grounded. <strong>In 2026, every claim could be from a model unless the spec says otherwise.</strong></li>\n+        <li class=\"map-summary-item\">The four conventions: <strong>inline annotations, AI-assistance disclosure, open questions at the top, decision log.</strong> No tooling needed &mdash; just text patterns.</li>\n+        <li class=\"map-summary-item\">Two markers, no taxonomy: <strong><code>[CONFIRMED &mdash; source]</code> and <code>[ASSUMPTION]</code></strong>. Annotate only load-bearing claims, not every sentence.</li>\n+        <li class=\"map-summary-item\"><strong>&ldquo;Assumption&rdquo; isn&rsquo;t a confession &mdash; it&rsquo;s a hand-off.</strong> &ldquo;Here&rsquo;s the call I made; I&rsquo;d welcome a better answer.&rdquo; Engineers love this.</li>\n+        <li class=\"map-summary-item\">Open questions go <strong>at the top</strong>, after the problem statement. Named owners, default behaviors in async. Specs that lead with their open questions have shorter, more useful reviews.</li>\n+        <li class=\"map-summary-item\">Three flavors of pushback: <strong>provenance</strong> (answer plainly), <strong>scope</strong> (weigh against the problem statement), <strong>technical reality</strong> (almost always update the spec).</li>\n+        <li class=\"map-summary-item\">Hold or fold: <strong>fold when they name a constraint, expose a marked assumption, or offer a concrete alternative</strong>. <strong>Hold when they re-litigate a product call, shift scope, or anchor on cost.</strong></li>\n+        <li class=\"map-summary-item\">When you can&rsquo;t tell in the moment: <em>&ldquo;Let me think about this and come back tomorrow.&rdquo;</em> Underused, costs nothing, signals seriousness.</li>\n+        <li class=\"map-summary-item\"><strong>Don&rsquo;t live-prompt your AI assistant during the review.</strong> Take notes, re-draft after. Slightly longer cycle, much higher trust margin.</li>\n+        <li class=\"map-summary-item\">Comment etiquette: <strong>two sentences</strong>. Sentence 1 acknowledges; sentence 2 states the call. AI-generated essay-replies signal you didn&rsquo;t actually engage.</li>\n+        <li class=\"map-summary-item\">Smell test for handoff: <strong>can you answer &ldquo;where did this come from?&rdquo; for every AC, metric, and edge case in one sentence?</strong> Hesitation is the tell. Three minutes of pre-meeting marking saves twenty minutes of review.</li>\n+        <li class=\"map-summary-item\">Decision log = the receipt. <strong>One dated line per change, including cuts.</strong> ~1 minute per edit. Future-you, six months later, will thank you.</li>\n+        <li class=\"map-summary-item\">Don&rsquo;t silently expand the spec post-review &mdash; <strong>mark every change with a date and a log entry</strong>. Same length, completely different trust profile.</li>\n+        <li class=\"map-summary-item\">When recovery is needed: <em>&ldquo;That&rsquo;s fair. Let me re-do this and bring it back.&rdquo;</em> Don&rsquo;t defend; don&rsquo;t apologize for using AI. <strong>Be more honest, not less AI.</strong></li>\n+        <li class=\"map-summary-item\">First five minutes tell you everything: <strong>specific questions = landing; generic questions = re-frame; quiet glances = name the elephant</strong>.</li>\n+        <li class=\"map-summary-item\">Mid-build check-in: standing <strong>15 minutes weekly</strong> with one engineer. Cadence beats depth. Without it, the spec slowly becomes fiction.</li>\n+        <li class=\"map-summary-item\">Most engineers reading your spec also use AI daily &mdash; they&rsquo;re not skeptical of AI as a category, only of <strong>un-grounded claims</strong>. The conventions give two AI-using parties a shared language.</li>\n+        <li class=\"map-summary-item\"><strong>You sign the spec, the AI doesn&rsquo;t.</strong> The byline, the post-mortem, and the leverage are all yours. The answer to &ldquo;why is this here&rdquo; is always you.</li>\n+      </ul>\n+    </div>\n+\n+    <nav class=\"chapter-nav\">\n+      <a href=\"08-seven-smell-tests-map.html\">\n+        <span class=\"nav-direction\">&larr; Previous map</span>\n+        <span class=\"nav-chapter\">8. Validating AI Output: 7 Smell Tests</span>\n+      </a>\n+      <a href=\"../09-engineering-handoff.html\" class=\"next\">\n+        <span class=\"nav-direction\">Back to</span>\n+        <span class=\"nav-chapter\">Chapter 9 &rarr;</span>\n+      </a>\n+    </nav>",
