          "diff_hunk": "@@ -163,43 +167,67 @@ <h2>Model Selection by Task Type</h2>\n       <strong>Don't over-optimize:</strong> Using Haiku for architecture decisions saves money but produces lower quality. The rework cost of fixing a bad architectural plan far exceeds the savings from using a cheaper model. Match the model to the task complexity, not just the price.\n     </div>\n \n-    <h2>Encoding Model Selection in CLAUDE.md</h2>\n+    <h2>Where Model Selection Actually Lives</h2>\n+\n+    <p>It's tempting to write a \"Model Selection Guidelines\" section into CLAUDE.md and call it done. Don't. The main agent in a Claude Code session runs on one model and can't reroute itself mid-turn — when you start a session on Sonnet, every reasoning step in that session is Sonnet. CLAUDE.md is read by the AI on every turn, so prose like \"use Opus for architecture, Haiku for formatting\" is a directive the AI can't act on. It's wasted tokens that look like instructions.</p>\n+\n+    <p>Real model dispatch in 2026 lives in four places — and only two of them are AI-actionable:</p>\n+\n+    <table>\n+      <thead>\n+        <tr><th>Where</th><th>Who decides</th><th>When the model changes</th></tr>\n+      </thead>\n+      <tbody>\n+        <tr><td><code>/model</code> command</td><td>Human, between turns</td><td>Switches the main session; warns it invalidates cache</td></tr>\n+        <tr><td><code>opusplan</code> alias</td><td>Harness</td><td>Opus during plan mode, auto-switches to Sonnet on execute</td></tr>\n+        <tr><td>Skill frontmatter <code>model:</code></td><td>Skill author (read by AI)</td><td>When the AI invokes that skill</td></tr>\n+        <tr><td>Subagent frontmatter <code>model:</code></td><td>Subagent author (read by AI)</td><td>When the main agent dispatches that subagent</td></tr>\n+      </tbody>\n+    </table>\n \n-    <p>You can guide your team's model choices by documenting recommendations directly in your project configuration:</p>\n+    <p>So the right home for \"use Opus for X, Haiku for Y\" is twofold: the <em>frontmatter</em> of the skills and subagents that should run on those models, and a brief team-facing note (in the README, not CLAUDE.md) for which model humans should pick at session start.</p>\n+\n+    <h3>Model picks by task type</h3>\n+\n+    <p>Use this list when you're choosing a session model as a human, or deciding which <code>model:</code> to declare on a skill or subagent:</p>\n+\n+    <ul>\n+      <li><strong>Opus 4.7</strong> — architecture decisions, migration planning, complex debugging (race conditions, state corruption), ADRs, review of critical components.</li>\n+      <li><strong>Sonnet 4.6</strong> — feature implementation following established patterns, test generation, standard PR review, refactoring within a single module, technical documentation.</li>\n+      <li><strong>Haiku 4.5</strong> — formatting and lint fixes, simple string/config edits, commit messages, strictly-templated boilerplate, quick lookups.</li>\n+    </ul>\n+\n+    <h3>The 2026 pattern: encode the model in the skill</h3>\n+\n+    <p>The AI-actionable way to bind a task to a model is the skill's frontmatter. The main agent reads the frontmatter and dispatches the skill on the declared model — no human reminder needed:</p>\n \n     <div class=\"config-block\">\n-      <div class=\"config-header\">CLAUDE.md</div>\n-<pre><code>## Model Selection Guidelines\n-\n-### Use Opus (highest capability) for:\n-- Architecture decisions and module design\n-- Migration planning and dependency analysis\n-- Complex debugging (race conditions, state corruption)\n-- ADR generation and trade-off analysis\n-- Code review of critical system components\n-\n-### Use Sonnet (balanced) for:\n-- Feature implementation following established patterns\n-- Test generation and test refactoring\n-- Code review of standard feature PRs\n-- Refactoring within a single module\n-- Documentation with technical depth\n-\n-### Use Haiku (fastest, cheapest) for:\n-- Formatting and linting fixes\n-- Simple string/config changes\n-- Commit message generation\n-- Boilerplate that follows strict templates\n-- Quick lookups and explanations</code></pre>\n+      <div class=\"config-header\">.claude/skills/extract-module/SKILL.md</div>\n+<pre><code>---\n+name: extract-module\n+description: Extract a feature into its own module using plan-execute-validate.\n+model: claude-opus-4-7\n+---\n+\n+# Extract Module\n+\n+Use this skill when extracting a feature into its own Gradle module.\n+...</code></pre>\n+    </div>\n+\n+    <p>The same idea drives subagents. When the main agent spawns a Task subagent, the subagent's <code>model:</code> field decides what runs there — which is how a Sonnet main session offloads a cheap codebase search to a Haiku subagent without paying Sonnet rates for the grep work. That's the real cost lever: not \"tell the AI to use Haiku in CLAUDE.md,\" but \"make the search subagent <em>be</em> Haiku.\"</p>\n+\n+    <div class=\"warning-box\">\n+      <strong>Anti-pattern: model rules in CLAUDE.md.</strong> If you write \"Use Opus for architecture, Haiku for formatting\" inside CLAUDE.md, the AI loads that text on every single turn (cached, but still riding along) and can't act on it — it has no mechanism to swap its own model. Worse, it dilutes the rules the AI <em>can</em> act on. Keep CLAUDE.md for instructions the AI can execute (architecture rules, naming, forbidden patterns); push model-routing intent into skill/subagent frontmatter where it actually does something.\n     </div>",
