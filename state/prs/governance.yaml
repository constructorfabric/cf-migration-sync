          "node_id": "PRRC_kwDOQ_1nmM6ie3ek",
          "diff_hunk": "@@ -0,0 +1,120 @@\n+# Cyber Fabric Steering Committee Charter\n+\n+## Purpose\n+\n+The Cyber Fabric Steering Committee (SC) provides strategic direction and governance oversight for the Cyber Fabric [project](PROJECT_OVERVIEW.md). The SC exists to ensure the project remains sustainable, technically coherent, and vendor-neutral.\n+\n+## Scope and authority\n+\n+The SC is accountable for:\n+- overall project direction and guiding principles\n+- development process standardization and governance\n+- high-level roadmap and priorities\n+- approval of major architecture and design decisions\n+- intellectual property (IP) hygiene and vendor neutrality, ensuring the open-source project does not incorporate proprietary or commercially-sensitive vendor code\n+\n+## Roles\n+\n+The Steering Committee operates with two roles. Individuals may serve in both roles.\n+\n+### Governance\n+\n+Governance approves project governance, process, and roadmap decisions.\n+\n+Responsibilities:\n+- setting and maintaining governance processes (how decisions are proposed, reviewed, approved, and recorded)\n+- approving and maintaining scope for project roadmaps (backend, frontend, processes)\n+- approving changes to governance documents and project processes\n+- maintaining transparency of decisions through GitHub issues and pull requests\n+- resolving governance and process escalations that cannot be settled by maintainers through normal review\n+\n+### Architects\n+\n+Architects approve technical direction and architecture decisions.\n+\n+Responsibilities:\n+- defining and maintaining technical direction and architecture principles\n+- reviewing and approving key technical decision artifacts (PRDs, ADRs, design documents, implementation flow documents)\n+- ensuring cross-module technical coherence (security, scalability, maintainability)\n+- resolving technical escalations that cannot be settled by maintainers through normal review\n+\n+## Membership\n+\n+SC members represent participating organizations and are expected to act in the best interests of the project.\n+\n+### Participating organizations\n+\n+| Company | Profile | Primary contact |\n+| --- | --- | --- |\n+| Acronis | Cyber Protection | vz@acronis.com |\n+| Constructor tech | Educational platform | ao@constructor.tech |\n+| Virtuzzo | Infrastructure platform | sd@virtuzzo.com |\n+| Hypernetix | AI platform and services | artifizer@gmail.com |\n+\n+### Governance members\n+\n+| Member | GitHub account | Organization |\n+| --- | --- | --- |\n+| Alexander Andreev | artifizer | Acronis, Hypernetix |\n+| Vladimir Zatsepin | `TODO` | Acronis |\n+| Andrey Omelyanchuk | netjerikhet | Acronis |\n+| Yuliia Lysenko | `TODO` | Virtuzzo |\n+\n+### Architects members - Backend\n+\n+| Member | GitHub account | Organization |\n+| --- | --- | --- |\n+| Alexander Andreev | artifizer | Acronis, Hypernetix |\n+| Max Panfilov | ainetx | Acronis |\n+| Alexey Tarasov | nonameffh | Constructor tech |\n+| Ivan Tsyganov | pr0tey | Constructor tech |\n+| Viacheslav Katyukha | entropyshift | Virtuzzo |\n+| `TODO` | `TODO` | Virtuzzo |\n+\n+### Architects members - Frontend\n+\n+| Member | GitHub account | Organization |\n+| --- | --- | --- |\n+| `TODO` | `TODO` | Acronis |\n+| `TODO` | `TODO` | Constructor tech |\n+| `TODO` | `TODO` | Virtuzzo |\n+\n+### Other members\n+\n+Other roles can participate in discussions and execution. Unless explicitly stated, these roles do not vote on SC decisions.\n+\n+| Member | GitHub account | Role |\n+| --- | --- | --- |\n+| Vitaly Panteleev | frontgeeks | Project coordinator |\n+| `TODO` | `TODO` | Observer, Chain Stack |\n+\n+## Decision-making",
