          "diff_hunk": "@@ -1 +1,74 @@\n+# SECURITY.md\n \n+## Security Policy\n+\n+This policy applies to **all repositories within the Cyber Fabric Foundation GitHub organization**.\n+\n+It defines shared governance requirements for repositories managed under the organization and applies to all members, maintainers, administrators, contributors, teams, and participating organizations with access to any repository in the organization.\n+\n+The foundation includes multiple members with their own governance, regulatory, legal, and security obligations, and **each participating member may define additional local requirements, approvals, or controls alongside this shared organization-wide policy**.\n+\n+Nothing in this document prevents stricter controls from being applied by any participating member.\n+\n+## Shared Approval Requirements\n+\n+The following GitHub organization or repository changes require **mandatory prior review and approval from Acronis IT/Security**.",
