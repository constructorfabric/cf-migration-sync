          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<!-- This is an auto-generated comment: failure by coderabbit.ai -->\n\n> [!CAUTION]\n> ## Review failed\n> \n> The pull request is closed.\n\n<!-- end of auto-generated comment: failure by coderabbit.ai -->\n\n<details>\n<summary>ℹ️ Recent review info</summary>\n\n<details>\n<summary>⚙️ Run configuration</summary>\n\n**Configuration used**: defaults\n\n**Review profile**: CHILL\n\n**Plan**: Free\n\n**Run ID**: `a6dd9107-06bd-4817-947e-14b9cd5086f1`\n\n</details>\n\n<details>\n<summary>📥 Commits</summary>\n\nReviewing files that changed from the base of the PR and between 706a31026b13064d8e5c2e7b85e20d55ba0c86a8 and 56a672d3a8e25e3edb8326570babbf735e17f7c9.\n\n</details>\n\n<details>\n<summary>📒 Files selected for processing (3)</summary>\n\n* `src/back_roadmap_to_xls.py`\n* `src/config.yaml`\n* `src/requirements.txt`\n\n</details>\n\n</details>\n\n---\n\n\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nThis pull request enhances the roadmap export functionality by adding a new Roadmap sheet with grid-based layouts and visual shape rendering. Changes include a revised data model supporting Type and Group fields, progress value parsing, swimlane-based grouping, configuration-driven customization with team colors and user aliases, and post-processing logic to inject floating shapes into the XLSX via OOXML manipulation.\n\n## Changes\n\n|Cohort / File(s)|Summary|\n|---|---|\n|**Core Roadmap Export Logic** <br> `src/back_roadmap_to_xls.py`|Significantly expanded with roadmap sheet generation featuring grid-based layout, shape injection via OOXML/.rels, new data model fields (Type, Group, Team), progress parsing from field values, swimlane grouping and ordering, global Summary sheet aggregation, and multi-sheet per-group Issues output. Modified GraphQL query, row construction, and done/progress detection logic.|\n|**Configuration & Dependencies** <br> `src/config.yaml`, `src/requirements.txt`|Added new configuration file defining swimlane order/labels, team color mappings, user-to-team assignments, and default team color. Updated dependencies with PyYAML for YAML config parsing.|\n\n## Sequence Diagram(s)\n\n```mermaid\nsequenceDiagram\n    participant Client\n    participant GraphQL as GraphQL API\n    participant Processor as Data Processor\n    participant SheetWriter as Sheet Writer\n    participant XLSXProcessor as XLSX Post-Processor\n    \n    Client->>Processor: Trigger export with config\n    Processor->>GraphQL: Fetch project data with issueType\n    GraphQL-->>Processor: Return items with types & statuses\n    \n    Processor->>Processor: Build rows (Type, Group, Team, Progress)\n    Processor->>Processor: Group rows by swimlane\n    \n    Processor->>SheetWriter: Create Summary sheet (aggregations)\n    SheetWriter-->>Processor: Summary complete\n    \n    Processor->>SheetWriter: Create Roadmap sheet (grid header, positioning)\n    SheetWriter-->>Processor: Roadmap complete\n    \n    Processor->>SheetWriter: Create Issues sheets (per-group)\n    SheetWriter-->>Processor: All sheets created\n    \n    Processor->>XLSXProcessor: Save XLSX and post-process\n    XLSXProcessor->>XLSXProcessor: Parse grid positions, inject shapes via OOXML/.rels\n    XLSXProcessor->>XLSXProcessor: Apply team coloring & commitment rendering\n    XLSXProcessor->>XLSXProcessor: Rewrite ZIP with modified OOXML\n    XLSXProcessor-->>Processor: XLSX finalized\n    \n    Processor-->>Client: Export complete\n```\n\n## Estimated Code Review Effort\n\n🎯 4 (Complex) | ⏱️ ~60 minutes\n\n## Poem\n\n> 🐰 A roadmap takes shape, colored by team,  \n> Grid-lined horizons of engineering dreams,  \n> Swimlanes and progress in harmonious flow,  \n> From config to OOXML, watch the vision grow! 🎨\n\n</details>\n\n<!-- walkthrough_end -->\n\n\n<!-- tips_start -->\n\n---\n\n> [!NOTE]\n> <details>\n> <summary>🎁 Summarized by Cod