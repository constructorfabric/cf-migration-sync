          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<details>\n<summary>ℹ️ Recent review info</summary>\n\n<details>\n<summary>⚙️ Run configuration</summary>\n\n**Configuration used**: defaults\n\n**Review profile**: CHILL\n\n**Plan**: Free\n\n**Run ID**: `79d601c6-d6c2-4028-a125-ac356d674665`\n\n</details>\n\n<details>\n<summary>📥 Commits</summary>\n\nReviewing files that changed from the base of the PR and between 40c5d7e196213bbd85d5553bf487ff29a6d7634c and b132abbb41b5790b4fc4c6ace9e29725b4efb814.\n\n</details>\n\n<details>\n<summary>📒 Files selected for processing (1)</summary>\n\n* `src/github_org_audit_to_xlsx.py`\n\n</details>\n\n<details>\n<summary>🚧 Files skipped from review as they are similar to previous changes (1)</summary>\n\n* src/github_org_audit_to_xlsx.py\n\n</details>\n\n</details>\n\n---\n\n\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nAdds email fields and new users to `src/config.yaml`. Introduces a new CLI Python script that audits a GitHub organization via `gh api`, gathers repository metadata, security and integration signals, branch protections, webhooks, and exports a styled Excel workbook with multiple worksheets.\n\n## Changes\n\n|Cohort / File(s)|Summary|\n|---|---|\n|**Configuration Data** <br> `src/config.yaml`|Added `email` fields to existing users `Artifizer` and `MikeFalcon77`. Added four new users (`vzhuman`, `gaidar`, `netjerikhet`, `dobrovols`) with `alias`, `team`, and `email`. Added top-level `branches` array with an entry mapping `repo: frontx` to `branch: develop`.|\n|**GitHub Org Audit Exporter** <br> `src/github_org_audit_to_xlsx.py`|New executable CLI script. Implements `GhApiError`, `SheetColumnSpec`, and `GitHubOrgAuditExporter`. Loads YAML config, concurrently queries `gh api` for repos, contributors, collaborators, branch protections, security settings, apps/integrations, webhooks, Dependabot/CodeQL signals, and generates a multi-sheet styled `.xlsx` (`Overview`, `Admins`, `Mergers`, `Access to Security alerts`, `Integrations`, `Webhooks`) with formatting, validation, hyperlinks, and autosized columns.|\n\n## Sequence Diagram\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant CLI as \"Main / CLI\"\n    participant Config as \"Config Loader (FS)\"\n    participant Exporter as \"GitHubOrgAuditExporter\"\n    participant GH as \"GitHub API (gh api)\"\n    participant Workbook as \"Excel Workbook (openpyxl)\"\n    participant FS as \"File System\"\n\n    User->>CLI: run script with args\n    CLI->>Config: load YAML config\n    Config-->>CLI: config data\n    CLI->>Exporter: instantiate exporter\n    Exporter->>GH: list repositories\n    GH-->>Exporter: repo list\n    par Concurrent repo queries\n        Exporter->>GH: fetch contributors & collaborators\n        Exporter->>GH: fetch branch protections\n        Exporter->>GH: fetch apps/integrations & installations\n        Exporter->>GH: fetch webhooks\n        Exporter->>GH: fetch security/Dependabot/CodeQL signals\n        GH-->>Exporter: responses\n    end\n    Exporter->>Workbook: write sheets & apply styles/validation\n    Exporter->>FS: return workbook object\n    CLI->>FS: save workbook to output path\n    FS-->>CLI: file saved\n    CLI->>User: print completion message\n```\n\n## Estimated Code Review Effort\n\n🎯 4 (Complex) | ⏱️ ~45 minutes\n\n## Poem\n\n> 🐰 I hopped through config, nibbling mails so sweet,  \n> New users sprout and branches find their beat,  \n> I threaded through APIs, fetched secrets with care,  \n> And tucked results in sheets, all tidy and fair,  \n> A rabbit's audit dance — swift, neat, and fleet.\n\n</details>\n\n<!-- walkthrough_end -->\n\n\n<!-- tips_start -->\n\n---\n\n> [!NOTE]\n> <details>\n> <summary>🎁 Summarized by CodeRabbit Free</summary>\n> \n> Your organization is on the Free plan. CodeRabbit will generate a high-level summary and a walkthrough for each pull request. For a comprehensive line-by-line review, please upgrade your subscription to CodeRabbit Pro by visiting <https://app.coderabbit.ai/login>.\n> \n> </details>\n\n<sub>Comment `@coderabbitai help` to get the list of available commands and usage tips.</sub>\n\n<!-- tips_end -->\n\n<!-- internal state start -->\n\n\n<!--  -->\n\n<!-- internal state end -->",
