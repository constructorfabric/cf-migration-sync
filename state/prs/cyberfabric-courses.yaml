          "body": "Or better: CDSL is a Markdown-based contextual domain-specific language for writing LLM-friendly specifications of behavior, scenarios, algorithms, states, and transitions.\n\n```suggestion\nDescription: This module teaches the Contextual DSL (CDSL) used for writing algorithms, actor flows, and state machines in DESIGN and FEATURE artifacts. CDSL is a plain-English behavior description language with structured control flow keywords, mandatory phase tokens, instruction IDs, and implementation checkboxes.\n```",
