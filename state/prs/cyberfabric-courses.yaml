          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<!-- This is an auto-generated comment: review paused by coderabbit.ai -->\n\n> [!NOTE]\n> ## Reviews paused\n> \n> It looks like this branch is under active development. To avoid overwhelming you with review comments due to an influx of new commits, CodeRabbit has automatically paused this review. You can configure this behavior by changing the `reviews.auto_review.auto_pause_after_reviewed_commits` setting.\n> \n> Use the following commands to manage reviews:\n> - `@coderabbitai resume` to resume automatic reviews.\n> - `@coderabbitai review` to trigger a single review.\n> \n> Use the checkboxes below for quick actions:\n> - [ ] <!-- {\"checkboxId\": \"7f6cc2e2-2e4e-497a-8c31-c9e4573e93d1\"} --> ▶️ Resume reviews\n> - [ ] <!-- {\"checkboxId\": \"e9bb8d72-00e8-4f67-9cb2-caf3b22574fe\"} --> 🔍 Trigger review\n\n<!-- end of auto-generated comment: review paused by coderabbit.ai -->\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nThis PR introduces a comprehensive Constructor Studio course blueprint document that structures a complete curriculum from foundational concepts through advanced operator and extension authoring tracks, governance and team adoption, and capstone certification, with appendices for command reference and learner journey sequences.\n\n## Changes\n\n**Constructor Studio Course Blueprint**\n\n| Layer / File(s) | Summary |\n|---|---|\n| **Problem statement, course frame, and foundation principles** <br> `courses/constructor-studio-draft.md` | Course introduction establishes software development context and explains how Constructor Studio addresses AI-assisted flows. Defines target audience, course tracks, standard terminology, and foundational mental models for artifact-first delivery. |\n| **Getting started and core operator workflows** <br> `courses/constructor-studio-draft.md` | Local setup, CLI installation, and repository initialization. Operator daily workflows cover plan/generate/analyze/review/validate loop, prompt patterns, and Protocol Guard routing. Artifact registry, stable IDs, cross-artifact links, code traceability, and deterministic validation. |\n| **Advanced operator scenarios and extension authoring** <br> `courses/constructor-studio-draft.md` | Brownfield handling, multi-repo workspaces, PR review workflows, storytelling modes, and troubleshooting. Kit architecture, manifest design, artifact kinds, rules/checklists, CDSL, workflow/skill authoring, delegation/subagents, and extension testing. |\n| **Governance, team adoption, and certification** <br> `courses/constructor-studio-draft.md` | Team operating model, CI integration gating, review readiness, and version management. Capstone scenario with operator and author paths; certification review module with rubric and evidence checklist. |\n| **Command reference and learner journey maps** <br> `courses/constructor-studio-draft.md` | Appendix A: command and terminology reference for product/CLI names and standard chat/workflow/kit patterns. Appendix B: recommended completion sequences for operator, extension author, and team adoption paths. |\n\n## Estimated code review effort\n\n🎯 2 (Simple) | ⏱️ ~10 minutes\n\n## Poem\n\n> I hop through notes, a curriculum bright,\n> From problem to capstone, each module alight,\n> Operators and authors learn step by step,\n> Commands and artifacts traced in each prep,\n> A rabbit cheers learning—joy in sight! 🐇📘\n\n</details>\n\n<!-- walkthrough_end -->\n<!-- tips_start -->\n\n---\n\n> [!NOTE]\n> <details>\n> <summary>🎁 Summarized by CodeRabbit Free</summary>\n> \n> Your organization is on the Free plan. CodeRabbit will generate a high-level summary and a walkthrough for each pull request. For a comprehensive line-by-line review, please upgrade your subscription to CodeRabbit Pro by visiting <https://app.coderabbit.ai/login>.\n> \n> </details>\n\n\n<sub>Comment `@coderabbitai help` to get the list of available commands and usage tips.</sub>\n\n<!-- tips_end -->\n<!-- internal state start -->\n\n\n<!--  -->\n\n<!-- internal state end -->",
