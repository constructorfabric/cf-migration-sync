          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<details>\n<summary>ℹ️ Recent review info</summary>\n\n<details>\n<summary>⚙️ Run configuration</summary>\n\n**Configuration used**: defaults\n\n**Review profile**: CHILL\n\n**Plan**: Free\n\n**Run ID**: `f548e522-aa16-4740-be92-569f1ce64c0d`\n\n</details>\n\n<details>\n<summary>📥 Commits</summary>\n\nReviewing files that changed from the base of the PR and between 3192b20fbe61e82abe066ac617283e6949333cbd and f992a1a22372894958d3df98d8d1788efa1a7e19.\n\n</details>\n\n<details>\n<summary>📒 Files selected for processing (2)</summary>\n\n* `courses/cyberfabric-all-course-content.md`\n* `courses/cyberware-modkit-hands-on.md`\n\n</details>\n\n</details>\n\n---\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nThis pull request updates course documentation to include a hands-on ModKit tutorial and restructures the conceptual course around Cyber Ware (Rust). It adds a two-document orientation, architecture status markers, rebrands the repository ecosystem, introduces a new ModKit technical anatomy module, and provides a complete 14-lesson step-by-step guide for building a ModKit module.\n\n## Changes\n\n**Course Content and ModKit Hands-On Tutorial**\n\n|Layer / File(s)|Summary|\n|---|---|\n|**Course foundation: orientation and architecture status markers** <br> `courses/cyberfabric-all-course-content.md`|Adds two-document set introduction linking learners to the hands-on companion, and introduces architecture status markers (`[implemented]` vs `[planned]`) with guidance on where to verify current capability status in MODULES.md.|\n|**Repository ecosystem reorganization and Cyber Ware rebranding** <br> `courses/cyberfabric-all-course-content.md`|Revises repository guide, repository map table, and Cyber Pilot/SDLC kit descriptions to emphasize artifact pipeline traceability; corrects Insight repository links; replaces \"CyberFabric Core\" with \"Cyber Ware (Rust)\" including security posture and MODULES.md status marker guidance; updates additional repository entries.|\n|**ModKit technical anatomy module** <br> `courses/cyberfabric-all-course-content.md`|Adds new large module section covering ModKit layers (SDK/API/domain/infra), security data path pipeline, extensibility via GTS and ClientHub, compile-time enforcement via Dylint, REST/OperationBuilder and canonical error handling, and host runtime lifecycle and deployment topologies.|\n|**Systematic ecosystem rebranding throughout course** <br> `courses/cyberfabric-all-course-content.md`|Removes optional practical activities in AI acceleration and \"What Cyber Fabric is not\" modules, updates AI-native contrast table reference, and systematically updates repository references and adoption language (deployment-topology-agnostic delivery via `runtime.type`, plugin-based extensibility, and deployment shapes from single-process to Kubernetes) in contribution guidance and positioning sections.|\n|**Hands-on ModKit tutorial: introduction and document structure** <br> `courses/cyberware-modkit-hands-on.md`|Introduces the `notes` ModKit module hands-on tutorial, scope (REST endpoints), relationship to `users-info` reference template, intended audience, and prerequisite assumptions; establishes the 14-lesson sequence and module/SDK concepts expected of readers.|\n|**Hands-on ModKit tutorial: scaffolding through error mapping** <br> `courses/cyberware-modkit-hands-on.md`|Lessons 1–9 guide repo orientation, SDK contract declaration (models, ClientHub trait, GTS constant, OData filter schema, canonical error re-export), persistence infrastructure (SeaORM tenant-scoped entity, per-backend migration and migrator), domain-layer structure (service, local client, DomainError), composition root wiring (module.rs with DB and REST capability registration), and REST endpoint registration via OperationBuilder with auth/authz/license gating, OData affordances, and DomainError-to-CanonicalError error mapping with resource-type string sync test.|\n|**Hands-on ModKit tutorial: hosting, testing, deployment, and final exercises** <br> `courses/cyberware-modkit-hands-on.md`|Lessons 10–14 provide hosting guidance (in-process workspace inclusion vs standalone `notes-server`), black-box integration testing with in-memory SQLite and cross-tenant isolation assertion, local Dylint execution, out-of-process deployment via YAML, final exercise options (SSE, audit/metrics, plugin, FIPS), and explicit enumeration of intentionally excluded topics with mapping back to the conceptual course.|\n\n## Estimated code review effort\n\n🎯 2 (Simple) | ⏱️ ~12 minutes\n\n## Poem\n\n> 📚 A rabbit hops through courses bright,\\\n> Linking theory with hands-on light,\\\n> ModKit lessons bloom in order clear—\\\n> From SDK contracts to deploy right here,\\\n> Cyber Ware reborn, the path is set! 🦉\n\n</details>\n\n<!-- walkthrough_end -->\n<!-- tips_start -->\n\n---\n\n> [!NOTE]\n> <details>\n> <summary>🎁 Summarized by CodeRabbit Free</summary>\n> \n> Your organization is on the Free plan. CodeRabbit will generate a high-level summary and a walkthrough for each pull request. For a comprehensive line-by-line review, please upgrade your subscription to CodeRabbit Pro by visiting <https://app.coderabbit.ai/login>.\n> \n> </details>\n\n\n<sub>Comment `@coderabbitai help` to get the list of available commands and usage tips.</sub>\n\n<!-- tips_end -->\n<!-- internal state start -->\n\n\n<!--  -->\n\n<!-- internal state end -->",
