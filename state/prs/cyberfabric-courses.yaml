        "body": "Two main outcomes:\r\n\r\ncourses/cyberfabric-all-course-content.md\r\n  - fix factual errors in repository names, paths, and links (CyberFabric Core → Cyber Ware (Rust); docs/MANIFEST.md → - replace \"Kubernetes-native delivery\" with the real three-topology framing (single-node / multi-node bare-metal / Kubernetes via runtime.type)\r\n  - mark commodity SaaS capabilities (billing, invoicing, …) as illustrative, not as the current cyberware-rust inventory; list the actual inventory\r\n  - replace \"exact names are less important\" with the real cyberware-sdlc artifact chain (PRD → UPSTREAM_REQS → DESIGN → ADR → DECOMPOSITION → FEATURE)\r\n  - narrow \"supports most languages, stacks\" to the Rust-implementation + companion-repos reality\r\n  - point security navigation at docs/security/SECURITY.md and docs/arch/authorization/ instead of the root SECURITY.md stub\r\n  - introduce [implemented] / [planned] markers and an opening note on current state vs target architecture\r\n  - add new top-level module \"Cyber Ware / ModKit technical anatomy\" with seven subsections (ModKit hierarchy, security data path, GTS + ClientHub, Dylint, REST/errors/OData, HostRuntime lifecycle + three topologies, hands-on pointer) and five testable technical learning outcomes\r\n  - remove duplicate \"AI-Assisted coding vs AI-Native delivery\" table and three of five templated \"Optional practical activity\" blocks\r\n  - add three cross-links to the new hands-on companion\r\n\r\ncourses/cyberware-modkit-hands-on.md (new)\r\n  - 14-lesson, ~1400-line hands-on for building a first ModKit module (`notes`), grounded in examples/modkit/users-info as the canonical reference\r\n  - covers prerequisites, repo orientation, two-crate scaffolding, SDK contract (plain-Rust models, GTS resource type, ODataFilterable schema, re-exported CanonicalError), SeaORM entity with #[secure], migrations, repository, domain service with ports, composition root via #[modkit::module], OperationBuilder REST registration, RFC-9457 error mapping via #[resource_error] on a unit struct, host-binary wiring (in cyberware-example-server or a standalone notes-server), black-box integration test with in-memory SQLite and a PEP-shaped MockAuthZResolver, make dylint, and OoP deployment via runtime.type: oop\r\n  - cross-linked back to §\"Cyber Ware / ModKit technical anatomy\" of the conceptual course; every reference path verified to exist in cyberware-rust\n\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n\n## Summary by CodeRabbit\n\n* **Documentation**\n  * Updated course materials with guidance on current vs. target architecture and implementation status markers.\n  * Added comprehensive hands-on tutorial for building ModKit modules, including REST API design, persistence setup, and integration testing patterns.\n  * Refined repository references and ecosystem naming throughout course content for consistency.\n\n<!-- review_stack_entry_start -->\n\n[![Review Change Stack](https://storage.googleapis.com/coderabbit_public_assets/review-stack-in-coderabbit-ui.svg)](https://app.coderabbit.ai/change-stack/cyberfabric/cyberfabric-courses/pull/4?utm_source=github_walkthrough&utm_medium=github&utm_campaign=change_stack)\n\n<!-- review_stack_entry_end -->\n\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
