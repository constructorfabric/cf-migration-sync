        "body": "**Markdown formatting cleanup**\r\n\r\nComprehensive formatting pass on `courses/cyberfabric-all-course-content.md` to fix inconsistencies, broken syntax, and structural issues inherited from rich-text source material.\r\n\r\n**Changes**\r\n\r\n- Proper heading hierarchy — Established consistent # → ## → ### structure.\r\n- Standalone sub-section titles converted from plain text or **bold** to proper headings.\r\n- Non-breaking spaces removed.\r\n- Double blank lines collapsed.\r\n- Broken bold/italic syntax fixed.\r\n- Dangling markup fixed.\r\n- Typos and structural errors / inconsistencies fixed.\r\n- HTML comment artefacts removed.\r\n- Trailing spaces and backslashes removed.\r\n- Added `tools/headingify-standalone-titles.awk` — Reusable `awk` script for converting standalone title lines to Markdown headings.\r\n\r\nStill reading it! (interesting material btw). More issues can pop-up, but this PR is crowded already.\r\n\r\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n## Summary by CodeRabbit\n\n* **Chores**\n  * Added a new developer tool to auto-convert standalone title-like lines in Markdown into third-level headings, preserving other content unchanged.\n  * Tool unwraps bold-wrapped titles before converting and skips lines that are lists, tables, code fences, comments, indented, or end with punctuation, reducing manual Markdown cleanup.\n\n<!-- review_stack_entry_start -->\n\n[![Review Change Stack](https://storage.googleapis.com/coderabbit_public_assets/review-stack-in-coderabbit-ui.svg)](https://app.coderabbit.ai/change-stack/cyberfabric/cyberfabric-courses/pull/2?utm_source=github_walkthrough&utm_medium=github&utm_campaign=change_stack)\n\n<!-- review_stack_entry_end -->\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
