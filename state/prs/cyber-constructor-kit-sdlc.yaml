        "body": "BREAKING CHANGES:\r\n- CLI binary `cpt` → `cfc`\r\n- Skill `cypilot-sdlc` → `cf-constructor-sdlc`\r\n- Workflows `cypilot-pr-review`/`-pr-status`/`-migrate-openspec` → `cf-constructor-*`\r\n- Slash-commands `/cypilot-generate`, `/cypilot-analyze` → `/cf-constructor-*`\r\n- Path variable `{cypilot_path}` → `{cf-constructor-path}`; `{cypilot_mode}` → `{cf-constructor-mode}`\r\n- Workflow frontmatter field `cypilot:` → `cf-constructor:`\r\n- Skill directory `.core/skills/cypilot/` → `.core/skills/cf-constructor/`\r\n- Repo paths `cyberfabric/cyber-pilot{,-kit-sdlc}` → `cyberfabric/cyber-constructor{,-kit-sdlc}`\r\n- Legacy adapter dir `.cypilot-adapter/` → `.cf-constructor-adapter/`\r\n- Documentation: `Cypilot DSL (CDSL)` → `Cyber Constructor DSL (CDSL)` (CDSL acronym preserved)\r\n\r\nStable interop preserved (no consumer migration required):\r\n- `cpt-{system}-{kind}-{slug}` artifact ID prefix\r\n- `@cpt-flow`/`-algo`/`-state`/`-dod`/`-begin`/`-end` code traceability markers\r\n- `@cpt:root-agents` AGENTS.md root marker\r\n\r\nBackward-compat fallbacks in scripts/pr.py:\r\n- `cf-constructor-path` TOML key tried first; legacy `cypilot_path` as fallback\r\n- Auto-detect candidates: (.cfc, cfc, cf-constructor, .cypilot, cypilot)\r\n- Python aliases preserved: `_CYPILOT_REL`, `CYPILOT_PATH`, `_read_cypilot_path`\r\n\r\nPrompt vs CLI distinction:\r\n- `cf-constructor <verb>` for AI skill prompts (QUICKSTART/BROWNFIELD/GREENFIELD/MONOLITH guides)\r\n- `cfc <verb>` for CLI commands (SKILL.md, TAXONOMY, artifact rules, workflows)\r\n\r\nNote: parent product script file (cypilot.py) rename deferred; backward-compat aliases above keep this kit functional against both old and new parent layouts.\n\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n\n## Summary by CodeRabbit\n\n## Release Notes\n\n* **Documentation**\n  * Rebranded kit from \"Cyber Pilot\" to \"Cyber Constructor\" across all guides, rules, and templates.\n  * Updated CLI command prefix from `cypilot`/`cpt` to `cf-constructor`/`cfc` in all user-facing documentation and examples.\n  * Updated workflow and skill identifiers to reflect new branding.\n\n* **Chores**\n  * Updated kit metadata version to 2.0.0.\n  * Updated configuration paths and variables to use `cf-constructor-path` naming conventions with backward-compatibility support.\n  * Updated `.gitignore` to include Python extension modules and new configuration directories.\n\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
