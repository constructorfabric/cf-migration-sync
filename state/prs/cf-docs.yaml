          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nAdded VitePress documentation site: config, theme and styling, npm scripts, and many markdown pages (mostly TODO placeholders) plus updated .gitignore to ignore node_modules and VitePress cache.\n\n## Changes\n\n|Cohort / File(s)|Summary|\n|---|---|\n|**VitePress Config & Theme** <br> `docs/.vitepress/config.mts`, `docs/.vitepress/theme/index.ts`, `docs/.vitepress/theme/style.css`|New VitePress config exporting site metadata, themeConfig (search, nav, sidebar, edit links, lastUpdated, social), theme entrypoint extending default Layout with an enhanceApp hook, and CSS overrides for colors, buttons, hero, custom blocks, and DocSearch.|\n|**Root Docs & Examples** <br> `docs/index.md`, `docs/api-examples.md`, `docs/markdown-examples.md`|Added homepage (hero, actions, features), a runtime API examples page showing `useData()` usage, and a page demonstrating markdown extensions (shiki highlighting, custom containers).|\n|**Intro Section Placeholders** <br> `docs/intro/introduction.md`, `docs/intro/architecture.md`, `docs/intro/faq.md`, `docs/intro/core/*`, `docs/intro/tutorials/notes-app.md`|Added multiple introduction/core/tutorial pages; currently all contain `# TODO` placeholders.|\n|**Reference Section Placeholders** <br> `docs/reference/api-reference.md`, `docs/reference/modkit.md`, `docs/reference/modkit/*.md`, `docs/reference/system-sdks*`|Added reference and library documentation files (modkit, system-sdks, and subpages); all currently contain `# TODO` placeholders.|\n|**Repo & Build Config** <br> `.gitignore`, `package.json`|`.gitignore` updated to exclude `/node_modules` and `docs/.vitepress/cache`. `package.json` added with devDependency `vitepress@^2.0.0-alpha.17` and scripts: `docs:dev`, `docs:build`, `docs:preview`.|\n\n## Estimated code review effort\n\n🎯 3 (Moderate) | ⏱️ ~20 minutes\n\n## Poem\n\n> 🐇 I hopped through folders, green and spry,  \n> Configured pages beneath the sky,  \n> Theme and styles in tidy rows,  \n> Placeholders wait where content grows,  \n> ✨ Docs are planted — off I fly!\n\n</details>\n\n<!-- walkthrough_end -->\n\n\n<!-- pre_merge_checks_walkthrough_start -->\n\n<details>\n<summary>🚥 Pre-merge checks | ✅ 3</summary>\n\n<details>\n<summary>✅ Passed checks (3 passed)</summary>\n\n|     Check name     | Status   | Explanation                                                                                                                                                                                                        |\n| :----------------: | :------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n|  Description Check | ✅ Passed | Check skipped - CodeRabbit’s high-level summary is enabled.                                                                                                                                                        |\n|     Title check    | ✅ Passed | The title accurately and specifically summarizes the main change: establishing a VitePress documentation site with its configuration and initial content structure. It matches the primary focus of the changeset. |\n| Docstring Coverage | ✅ Passed | No functions found in the changed files to evaluate docstring coverage. Skipping docstring coverage check.                                                                                                         |\n\n</details>\n\n<sub>✏️ Tip: You can configure your own custom pre-merge checks in the settings.</sub>\n\n</details>\n\n<!-- pre_merge_checks_walkthrough_end -->\n\n<!-- finishing_touch_checkbox_start -->\n\n<details>\n<summary>✨ Finishing Touches</summary>\n\n<details>\n<summary>🧪 Generate unit tests (beta)</summary>\n