          "diff_hunk": "@@ -0,0 +1,448 @@\n+# Cyber Constructor — Vision\n+\n+## Overview\n+\n+For decades, writing code was the bottleneck. Every org chart, process, and tool investment assumed that \"getting the code done\" was the slowest, most expensive step in software delivery. Then AI changed the equation overnight. Claude Code, Cursor, Copilot, Devin — these tools can draft in minutes what used to take days. Code generation is no longer the constraint.\n+\n+But most organizations haven't gotten faster. The bottleneck has simply moved — to everything *around* the code: capturing requirements, making architecture decisions, coordinating across teams, validating compliance, managing releases, running operations, and transferring knowledge. These activities still run on scattered wikis, tribal knowledge, and manual checklists. AI accelerated code generation, but not *complex software systems delivery*.\n+\n+This problem intensifies in large ecosystems where a single feature spans multiple services and teams. Cross-team dependencies are difficult to track, work is split across repositories and planning boards, integration gaps surface late, and end-to-end testing has no natural home. Even modest cross-component improvements require significant coordination overhead and frequently produce incomplete implementations and delivery delays. The platform needs a coordination layer that lets teams reason about, implement, and validate changes across services within a single environment — while keeping individual service repositories autonomous.\n+\n+**Cyber Constructor** exists to close that gap. It is a single, intelligent system that models the entire software delivery lifecycle — from an initial idea through requirements, architecture, code, testing, release, and operations — as a connected, machine-readable, AI-native domain. Content lives in Git. Metadata lives in a database. A pluggable web server exposes editors, dashboards, and automation. An index/RAG layer makes everything searchable and retrievable. And a **kit system** lets teams, vendors, and the community extend every dimension: new entity types, new integrations, new workflows, new UIs.\n+\n+The result: every artifact is linked, every decision is traceable, every process is automatable, and every human and AI agent operates on the same structured, versioned, auditable foundation.\n+\n+---\n+\n+## High-Level Architecture\n+\n+```\n+┌──────────────────────────────────────────────────────────────────┐\n+│                        Pluggable UI Layer                        │\n+│  (React / kit-contributed panels, dashboards, editors, viewers)  │\n+├──────────────────────────────────────────────────────────────────┤\n+│                     Web Server / API Gateway                     │\n+│  (REST + WebSocket, auth, routing, kit plugin host)              │\n+├───────────┬───────────────┬──────────────┬───────────────────────┤\n+│  Backend  │  Index / RAG  │   Database   │  Git Storage          │\n+│  Services │  Server       │  (metadata,  │  (content: specs,     │\n+│  (agents, │  (semantic    │   UI state,  │   templates, rules,   │\n+│  workflows│   search,     │   indexes,   │   code — one or       │\n+│  scripts) │   embeddings) │   caches)    │   many repos)         │\n+├───────────┴───────────────┴──────────────┴───────────────────────┤\n+│                          Kit System                              │\n+│  Each kit bundles: metadata schemas, templates, validation       │\n+│  rules/scripts, UI plugins, backend handlers, connectors         │\n+└──────────────────────────────────────────────────────────────────┘\n+```\n+\n+### Key Architectural Decisions\n+\n+- **Content lives in Git** — all specs, templates, rules, and code are stored in Git repos (single or multi-repo). Git is the source of truth; the system reads from and writes to repos.\n+- **Database stores metadata only** — UI state, computed indexes, caches, user preferences, and navigation metadata live in the database. Never content.\n+- **Pluggable web server** — hosts a pluggable UI (frontend panels, editors, dashboards contributed by kits) and a pluggable backend (workflows, AI agents, scripts, API handlers, webhooks, event processors contributed by kits).\n+- **Index / RAG server** — a dedicated service maintains semantic embeddings and search indexes over Git content for retrieval-augmented generation and hybrid search.\n+- **Kits are the unit of extensibility** — each kit is a self-contained package that may include: metadata schemas, document templates, validation rules/scripts, UI plugins (panels, wizards, dashboards), backend handlers, and integration connectors.\n+- **Structured ID system** — every artifact carries a stable, typed identifier (e.g., `{system}-{kind}-{slug}`) with code tags for bidirectional design-to-code traceability. Cross-references are deterministically validated; link integrity is enforced in CI.\n+\n+---\n+\n+## Guiding Principles\n+\n+1. **Structured over freeform** — every artifact is machine-validatable, linkable, and queryable.\n+2. **Traceability by construction** — links are first-class, not afterthoughts.\n+3. **AI-native, human-governed** — AI drafts, humans decide; every AI action is attributable and reversible.\n+4. **Determinism-first, LLM last** — everything that can be validated, checked, or enforced without an LLM is handled by deterministic scripts. AI is reserved for reasoning, creativity, and natural-language understanding. Same input → same output, regardless of which agent runs the command.\n+5. **Open fabric** — interoperate with the tools teams already use; never become a walled garden.\n+6. **Measurable outcomes** — every capability ties back to flow metrics (DORA, lead time, rework, incident rate).\n+7. **Single discovery point** — one workspace to understand the entire development surface layout; new developers, operators, and AI agents should not need to visit dozens of repositories to grasp the system.\n+8. **Code modularity, centralized orchestration** — each service remains a standalone repository with its own maintainers and release cycle; common workflows (build, test, deploy, validate) are executable from a central coordination layer.\n+\n+---\n+\n+## Delivery Priorities\n+\n+> Priorities reflect **build order**, not importance. P1 items are built first because everything else depends on them.\n+\n+- **P1 — Foundation & Core Loop** — Domain model, platform backbone, core kits, basic validation, Git + MCP integration.\n+- **P2 — Core Differentiation** — AI-powered authoring, semantic validation, traceability graph.\n+- **P3 — Collaboration & Depth** — Per-role workflows, visualization, team adoption drivers, remaining kits.\n+- **P4 — Scale & Maturity** — Analytics, education, governance, compliance, marketplace.\n+\n+---\n+---\n+\n+# Part A: Core System\n+\n+The Core System provides the universal domain model, storage, web UI, search, scripting, AI capabilities, integrations, audit, content authoring, and collaboration. It is the platform that all kits build on.\n+\n+Every entity in the domain model has a **core schema** (stable base attributes shared by all instances) and an **extendable metadata envelope** (kit-specific fields that depend on the origin — e.g., GitHub PR details, Jira ticket fields, Snyk vulnerability data). Kits enrich entities without changing the core schema.\n+\n+---\n+\n+## 1. Core Extensible Domain Model\n+\n+Every entity type below carries a stable core schema plus an open metadata envelope. Kits extend metadata, connectors populate it, and scripts/AI agents reason over it. People and scripts can also create and update entities directly.\n+\n+### 1.1 People & Organization\n+\n+- p1 - **Profiles** - internal org. profiles (categoeries, expertise tags, )",
