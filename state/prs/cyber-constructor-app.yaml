          "updated_at": "2026-05-06T13:29:27Z",
          "body": "Suggestion: make prompt extensibility an explicit platform concept. A good model would be to treat every prompt as an extensible template, where the final prompt is the result of rendering a base template plus kit-defined extensions/overrides. In other words, a prompt should be a first-class reusable template artifact, not just static text. That would fit well with the existing ideas around kits, workflows, templates, and structured artifacts.",
