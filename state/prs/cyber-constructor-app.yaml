          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nA README.md is added providing a high-level overview of the Cyber Constructor project with sections on purpose, mission, values, architecture, and structure. A comprehensive docs/VISION.md document details the system architecture, core components, kit framework, delivery priorities, and user scenarios for the platform.\n\n## Changes\n\n**Project Vision & Documentation**\n\n|Layer / File(s)|Summary|\n|---|---|\n|**Project Overview** <br> `README.md`|High-level entry point documenting why Cyber Constructor exists, its mission, core values, how it works, organizational structure, and a reference to the detailed vision document.|\n|**Architecture & Design** <br> `docs/VISION.md`|Comprehensive vision document covering high-level architecture (with ASCII diagram), key architectural decisions, delivery priorities (P1–P4), and the Core System comprising 11 sections: domain model, Web UI, search/RAG/knowledge graph, base scripts, AI agents, integrations, audit, content authoring, collaboration, feedback collection, and developer tools.|\n|**Kit Framework & Scenarios** <br> `docs/VISION.md`|Part B outlines the Kit system (Documentation, Integration, Role-Specific, Operational & Automation, and Scenario & Workflow kits) and user scenario examples demonstrating validation and rapid prototyping workflows. Out of Scope section clarifies boundaries.|\n\n## Estimated code review effort\n\n🎯 2 (Simple) | ⏱️ ~12 minutes\n\n---\n\n> 🐰 *A vision laid plain in words so bright,*  \n> *Architecture sketched for all to sight,*  \n> *Kits and cores in harmony dance,*  \n> *Cyber Constructor's grand expanse!*  \n> *With README guiding, and docs so deep,*  \n> *This roadmap's treasures we shall keep.* 🗺️\n\n</details>\n\n<!-- walkthrough_end -->\n\n<!-- pre_merge_checks_walkthrough_start -->\n\n<details>\n<sum