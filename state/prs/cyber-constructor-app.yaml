          "created_at": "2026-05-06T13:38:22Z",
          "updated_at": "2026-05-06T13:38:22Z",
          "body": "Suggestion: explicitly call out the risk around Custom Objects and kit-defined schemas. The vision currently makes extensibility a strength, but it would help to state that uncontrolled extension can fragment the shared domain model, weaken validation/search/graph consistency, and reduce interoperability across kits. It would be useful to mark this as a known design risk that must be mitigated in a future DESIGN or ADR, with clear rules for minimum schema contracts, linking/validation requirements, and governance of new object types.",
