          "diff_hunk": "@@ -0,0 +1,448 @@\n+# Cyber Constructor — Vision\n+\n+## Overview\n+\n+For decades, writing code was the bottleneck. Every org chart, process, and tool investment assumed that \"getting the code done\" was the slowest, most expensive step in software delivery. Then AI changed the equation overnight. Claude Code, Cursor, Copilot, Devin — these tools can draft in minutes what used to take days. Code generation is no longer the constraint.\n+\n+But most organizations haven't gotten faster. The bottleneck has simply moved — to everything *around* the code: capturing requirements, making architecture decisions, coordinating across teams, validating compliance, managing releases, running operations, and transferring knowledge. These activities still run on scattered wikis, tribal knowledge, and manual checklists. AI accelerated code generation, but not *complex software systems delivery*.\n+\n+This problem intensifies in large ecosystems where a single feature spans multiple services and teams. Cross-team dependencies are difficult to track, work is split across repositories and planning boards, integration gaps surface late, and end-to-end testing has no natural home. Even modest cross-component improvements require significant coordination overhead and frequently produce incomplete implementations and delivery delays. The platform needs a coordination layer that lets teams reason about, implement, and validate changes across services within a single environment — while keeping individual service repositories autonomous.\n+\n+**Cyber Constructor** exists to close that gap. It is a single, intelligent system that models the entire software delivery lifecycle — from an initial idea through requirements, architecture, code, testing, release, and operations — as a connected, machine-readable, AI-native domain. Content lives in Git. Metadata lives in a database. A pluggable web server exposes editors, dashboards, and automation. An index/RAG layer makes everything searchable and retrievable. And a **kit system** lets teams, vendors, and the community extend every dimension: new entity types, new integrations, new workflows, new UIs.\n+\n+The result: every artifact is linked, every decision is traceable, every process is automatable, and every human and AI agent operates on the same structured, versioned, auditable foundation.\n+\n+---\n+\n+## High-Level Architecture\n+\n+```\n+┌──────────────────────────────────────────────────────────────────┐\n+│                        Pluggable UI Layer                        │\n+│  (React / kit-contributed panels, dashboards, editors, viewers)  │\n+├──────────────────────────────────────────────────────────────────┤\n+│                     Web Server / API Gateway                     │\n+│  (REST + WebSocket, auth, routing, kit plugin host)              │\n+├───────────┬───────────────┬──────────────┬───────────────────────┤\n+│  Backend  │  Index / RAG  │   Database   │  Git Storage          │\n+│  Services │  Server       │  (metadata,  │  (content: specs,     │\n+│  (agents, │  (semantic    │   UI state,  │   templates, rules,   │\n+│  workflows│   search,     │   indexes,   │   code — one or       │\n+│  scripts) │   embeddings) │   caches)    │   many repos)         │\n+├───────────┴───────────────┴──────────────┴───────────────────────┤\n+│                          Kit System                              │\n+│  Each kit bundles: metadata schemas, templates, validation       │\n+│  rules/scripts, UI plugins, backend handlers, connectors         │\n+└──────────────────────────────────────────────────────────────────┘\n+```\n+\n+### Key Architectural Decisions\n+\n+- **Content lives in Git** — all specs, templates, rules, and code are stored in Git repos (single or multi-repo). Git is the source of truth; the system reads from and writes to repos.\n+- **Database stores metadata only** — UI state, computed indexes, caches, user preferences, and navigation metadata live in the database. Never content.\n+- **Pluggable web server** — hosts a pluggable UI (frontend panels, editors, dashboards contributed by kits) and a pluggable backend (workflows, AI agents, scripts, API handlers, webhooks, event processors contributed by kits).\n+- **Index / RAG server** — a dedicated service maintains semantic embeddings and search indexes over Git content for retrieval-augmented generation and hybrid search.\n+- **Kits are the unit of extensibility** — each kit is a self-contained package that may include: metadata schemas, document templates, validation rules/scripts, UI plugins (panels, wizards, dashboards), backend handlers, and integration connectors.\n+- **Structured ID system** — every artifact carries a stable, typed identifier (e.g., `{system}-{kind}-{slug}`) with code tags for bidirectional design-to-code traceability. Cross-references are deterministically validated; link integrity is enforced in CI.\n+\n+---\n+\n+## Guiding Principles\n+\n+1. **Structured over freeform** — every artifact is machine-validatable, linkable, and queryable.\n+2. **Traceability by construction** — links are first-class, not afterthoughts.\n+3. **AI-native, human-governed** — AI drafts, humans decide; every AI action is attributable and reversible.\n+4. **Determinism-first, LLM last** — everything that can be validated, checked, or enforced without an LLM is handled by deterministic scripts. AI is reserved for reasoning, creativity, and natural-language understanding. Same input → same output, regardless of which agent runs the command.\n+5. **Open fabric** — interoperate with the tools teams already use; never become a walled garden.\n+6. **Measurable outcomes** — every capability ties back to flow metrics (DORA, lead time, rework, incident rate).\n+7. **Single discovery point** — one workspace to understand the entire development surface layout; new developers, operators, and AI agents should not need to visit dozens of repositories to grasp the system.\n+8. **Code modularity, centralized orchestration** — each service remains a standalone repository with its own maintainers and release cycle; common workflows (build, test, deploy, validate) are executable from a central coordination layer.\n+\n+---\n+\n+## Delivery Priorities\n+\n+> Priorities reflect **build order**, not importance. P1 items are built first because everything else depends on them.\n+\n+- **P1 — Foundation & Core Loop** — Domain model, platform backbone, core kits, basic validation, Git + MCP integration.\n+- **P2 — Core Differentiation** — AI-powered authoring, semantic validation, traceability graph.\n+- **P3 — Collaboration & Depth** — Per-role workflows, visualization, team adoption drivers, remaining kits.\n+- **P4 — Scale & Maturity** — Analytics, education, governance, compliance, marketplace.\n+\n+---\n+---\n+\n+# Part A: Core System\n+\n+The Core System provides the universal domain model, storage, web UI, search, scripting, AI capabilities, integrations, audit, content authoring, and collaboration. It is the platform that all kits build on.\n+\n+Every entity in the domain model has a **core schema** (stable base attributes shared by all instances) and an **extendable metadata envelope** (kit-specific fields that depend on the origin — e.g., GitHub PR details, Jira ticket fields, Snyk vulnerability data). Kits enrich entities without changing the core schema.\n+\n+---\n+\n+## 1. Core Extensible Domain Model\n+\n+Every entity type below carries a stable core schema plus an open metadata envelope. Kits extend metadata, connectors populate it, and scripts/AI agents reason over it. People and scripts can also create and update entities directly.\n+\n+### 1.1 People & Organization\n+\n+- p1 - **Profiles** - internal org. profiles (categoeries, expertise tags, )\n+- p1 - **Tenants** (organizations → departments → teams — hierarchical org model with isolation, permissions, and ownership boundaries)\n+- p1 - **Users** (authenticated identity, linked profile, external identity mappings — SSO/SAML/OIDC subject, API keys, bot tokens — with per-tenant role assignments and permission grants)\n+- p2 - **Actors** (product or system personas used in design and analysis — user types, buyer segments, API consumers, internal roles — with goals, JTBD, pain points, and journey stages)\n+\n+\n+### 1.2 Documentation & Knowledge\n+\n+- p1 - **Document Categories** (opportunity, research, requirements, design, ADRs, decomposition, operations, security, release, test plan, tutorials, public documentation, marketing materials, sales enablement — classifies every document by SDLC purpose; includes visibility scope: private/internal vs public/customer-facing)\n+- p1 - **Document Statuses** (draft → preview → final, with approvers list, approval chain, and status-transition rules)\n+- p1 - **Document Artifacts** (templates, checklists, guides, prompts, workflows, acceptance criteria — each document category ships its own artifact set)\n+\n+### 1.3 Engineering & Code\n+\n+- p1 - **Projects** (top-level grouping of repositories, components, and teams — with name, description, owning team, linked roadmap items, milestone targets, and access policies; supports an umbrella coordination-repo pattern that links autonomous service repositories through submodules or similar mechanisms, providing a single place to navigate, standardize, prototype, test, and operate the system end-to-end)\n+- p1 - **Repositories** (url, owners, maintainers, access rules, branches, protection rules, build/test configuration, README overview, lifecycle status, CI/CD pipeline configuration, settings)\n+- p1 - **Components** (internal/external, category, description, maturity level, lifecycle status, API contracts, dependencies, relationship, owning team)\n+- p1 - **Code Changes** (pull requests with review status and metrics, commits with metadata and diffs — linked to tasks, components, and releases)\n+- p1 - **Git Artifact Categories** (code, non-code/docs, tests, CI actions, binary assets — classification of every file in a repository)\n+- p1 - **APIs Registry** (REST endpoints, gRPC services, SDKs — versioned contracts, owners, consumers, breaking-change tracking)\n+- p1 - **Foundational requirements** - (architecture, security, scalability, Quality, operations, deployment)\n+\n+### 1.4 Security & Compliance\n+\n+- p1 - **Known Vulnerabilities Registry** (CVEs, severity, affected components, remediation status, SLA deadlines, linked advisories)\n+- p1 - **Security Scanner Findings** (SAST, DAST, SCA, container scan results — linked to component, repo, team, and remediation task)\n+- p1 - **Approvals** (review gates, sign-off records, policy compliance evidence — attachable to any reviewable entity)\n+- p1 - **Sign-Off Certificates** (formal compliance attestations, security review sign-offs, audit-ready records with timestamp and signer)\n+- p1 - **Security Fix SLAs** (severity-based fix deadlines — critical/high/medium/low with target resolution hours, escalation rules, breach notifications, and per-team/per-component override policies)\n+\n+### 1.5 Build, Release & Deployment\n+\n+- p1 - **Build Artifacts** (binaries, container images, SBOMs, provenance attestations — linked to source commit and build pipeline)\n+- p1 - **Deployments** (target environments/locations, deployment scripts, TCO estimates, environment variables, health status)\n+- p1 - **Releases** (fix versions, linked milestones + target dates, included changes, linked PRDs/ADRs/designs)\n+- p1 - **Milestones** (scope complete, feature complete, code freeze, GA — with target dates, entry/exit criteria, and completion tracking)\n+- p1 - **Release Notes / Changelog** (auto-generated or authored, audience-targeted, linked to release and included changes)\n+\n+### 1.6 Planning & Tracking\n+\n+- p1 - **Roadmap Items** (products, swimlanes/categories, topics, features — linked to milestones, owning teams, and strategy docs)\n+- p1 - **Tasks** (epics, dev tasks, bugs, QA tasks — assignee, status, priority, estimation, linked artifacts and code changes)\n+- p1 - **Configurations** (feature flags, regions, environment configs, A/B experiments, runtime parameters — versioned and auditable)\n+\n+### 1.7 Quality & Observability\n+\n+- p1 - **Test Plans** (strategy, scope, entry/exit criteria, linked requirements and acceptance criteria)\n+- p1 - **Test Categories** (unit, integration, end-to-end, performance, security, compliance, upgrade)\n+- p1 - **Test Results** (CI code coverage reports, performance test results, security test results — linked to category, build, component, and release)\n+- p2 - **Production Alerts** (severity, owning team, linked runbooks, auto-correlated to component and deployment)\n+- p2 - **Production Incidents** (timeline, impact scope, root cause, linked postmortem, owning team, affected releases)\n+- p3 - **Advisories** (security advisories, deprecation notices, breaking-change warnings — published to affected consumers)\n+\n+### 1.8 Ecosystem & External\n+\n+- p2 - **Systems** (URL, administrators, access instructions, terms of service, SLA — external tools and services the org depends on)\n+- p3 - **AI Models** (text/visual/multimodal AI models, paid/free, capability matrix, usage policies, token cost tracking)\n+\n+### 1.9 Extensibility\n+\n+- p1 - **Custom Objects** (kit-defined entity types with custom schemas and metadata — any kit can register new domain types that participate in search, linking, validation, and the knowledge graph)\n+\n+---\n+\n+## 2. Web UI\n+\n+A pluggable web application that renders, edits, and navigates the domain model. Kits contribute panels, viewers, and dashboards.\n+\n+- p1 - **Content Viewer** (WYSIWYG rendering of Markdown and structured docs with embedded diagrams, cross-links, and metadata panels; bidirectional Git ↔ Viewer navigation)\n+- p1 - **Content Editor** (WYSIWYG editor with raw Markdown toggle, schema-aware autocompletion, frontmatter validation, and live preview)\n+- p1 - **Inline Pending Changes** (pending changes from open PRs visible inline in documents with per-snippet review and approval)\n+- p1 - **PR Review Dashboard** (unified PR view across all repos — review metrics, comment analytics, stale PR detection)\n+- p1 - **Task Extraction** (Markdown checkboxes as structured tasks with assignees, deadlines, and task dashboard)\n+- p2 - **Collaboration UI** (inline comments, threaded discussions, notifications, inline task creation, @mentions)\n+- p2 - **Dashboards & Reporting** (kit-contributed dashboards for releases, security, test coverage, velocity, JIRA views)\n+- p3 - **Multi-modal Viewers** (Mermaid, PlantUML, D2, Excalidraw, draw.io rendering with interactive navigation)\n+- p3 - **Knowledge Graph Explorer** (visual graph of entities, relationships, and traceability chains)\n+\n+---\n+\n+## 3. Search / RAG / Index / Knowledge Graph\n+\n+A dedicated service layer that makes every entity in the domain model searchable, retrievable, and interconnected.\n+\n+- p1 - **Hybrid Search** (lexical + semantic + graph-based retrieval across all domain entities and Git content)\n+- p1 - **Semantic Embeddings** (auto-indexed embeddings of all docs, code, and metadata for RAG-powered queries)\n+- p1 - **Knowledge Graph** (unified graph of all entities and relationships — bidirectional traceability from requirement to telemetry)\n+- p1 - **Auto-Generated Tags** (word-cloud extraction per document, custom user tags, tag-based filtering and combined tag + text search)\n+- p1 - **Cross-Repo Document Linking** (stable unique document IDs, `[[doc:ID]]` link syntax, backlinks, cross-system URI schemes, link validation on save)\n+- p1 - **Permission-Aware Retrieval** (every query respects tenant, team, and user-role scoping)\n+- p1 - **Citation Grounding** (every AI response includes source-of-truth citations with links to originating artifacts)\n+- p2 - **Impact Analysis** (graph queries: \"what breaks if I change this?\" with change propagation suggestions)\n+- p3 - **Explainability** (\"why this answer?\" transparency for all AI-generated responses)\n+\n+---\n+\n+## 4. Base Scripts (Deterministic Validators)\n+\n+Rule-based, non-AI validation that runs on every artifact change. Guarantees structural correctness before AI or humans review. All artifacts are file-backed and inspectable (diffable, reviewable in Git); a configured subset is deterministically enforceable — the same validators run locally, in CI, and on the server, surfacing drift through broken links and failed checks rather than ad-hoc reconstruction.\n+\n+- p1 - **Schema Validators** (frontmatter fields, IDs, statuses, owners — every entity conforms to its core schema)\n+- p1 - **Required Sections** (enforce mandatory and optional headings/sections per document category)\n+- p1 - **Mandatory References** (e.g., every Design must reference a PRD section; every Release must link to a Milestone)\n+- p1 - **Link Integrity** (no broken internal/external refs, no orphan documents, no dangling cross-references)\n+- p1 - **Style & Formatting Linters** (consistent Markdown style, naming conventions, terminology enforcement)\n+- p2 - **Custom Validation Rules** (kit-contributed validators that run in the same pipeline — e.g., security-kit checks SBOM presence)\n+\n+---\n+\n+## 5. Base AI Agents & Workflows\n+\n+AI-powered capabilities built into the core system. Operate over any domain model entity.\n+\n+- p2 - **Consistency Validation** (cross-document contradiction detection, drift between intent and implementation, terminology enforcement)\n+- p2 - **Semantic Validation** (content-category verification — is this section actually a \"Goal\" or a \"Requirement\"?)\n+- p2 - **Summarization** (auto-summaries of any artifact — one-liner, paragraph, or deep-dive, audience-adaptive)\n+- p2 - **PR Review & Comment Analysis** (AI-assisted review with severity classification, comment clustering, resolution suggestions)\n+- p2 - **Draft Generation** (generate document drafts from raw notes, calls, tickets, or related artifacts with clarifying questions)\n+- p2 - **Execution Plans** (large tasks decompose into bounded, self-contained phase files with all rules, constraints, and context inlined; each phase has budget limits, binary acceptance criteria, and lifecycle tracking — executable by any agent without platform-specific knowledge)\n+- p3 - **Brainstorming** (divergent ideation, convergent synthesis, pre-mortem, red-team, stakeholder perspective simulation)\n+- p4 - **Storytelling** (multi-modal narration — speech, text, charts, slide decks, walkthroughs — from any set of artifacts)\n+- p4 - **Skill Improvement Loop** (learn from human corrections, PR comments, and reverted changes to improve AI agents over time)\n+\n+---\n+\n+## 6. Base Integrations\n+\n+Core connectors that ship with the platform. Kits extend this with deeper, origin-specific integrations.\n+\n+- p1 - **Git / GitHub / GitLab** (bidirectional sync, PR/MR decoration, CI/CD hooks, pluggable VCS backend, multi-repo workspace federation — cross-repo traceability without merging repositories, each repo keeping its own configuration; support for umbrella coordination repositories that attach service repos via Git submodules so that IDE and AI tools can navigate and apply changes across the right repositories from a single workspace)\n+- p1 - **MCP (Model Context Protocol)** (server endpoints for AI agents to read/write domain entities, permission-scoped)\n+- p1 - **REST API & Token Management** (programmatic API for CI, scripts, and AI agents; personal API tokens with expiration, scope, and revocation)\n+- p1 - **Jira / YouTrack** (bidirectional task sync, inline JIRA badges with live status, ticket auto-generation from decomposition)\n+- p3 - **Atlassian Confluence** (page import and conversion to structured domain entities)\n+- p3 - **Slack / Teams** (notifications, slash commands, chat-to-artifact capture)\n+- p3 - **Security Scanners** (unified vulnerability feed from Snyk, Trivy, Semgrep, SonarQube, Dependabot)\n+- p4 - **Observability Platforms** (Datadog, PagerDuty, OTel — telemetry ingest, incident-to-postmortem pipeline)\n+\n+---\n+\n+## 7. Audit\n+\n+Append-only, tamper-evident record of everything that happens in the system.\n+\n+- p1 - **Change Log** (every entity creation, update, and deletion — by whom, when, and what changed)\n+- p1 - **Provenance Tracking** (who or what generated each section — human, AI model + prompt, or script)\n+- p2 - **Diff Views** (structured before/after comparison for any entity at any point in time)\n+- p4 - **Signed History** (tamper-evident, cryptographically signed audit trail for compliance)\n+- p4 - **Time Travel** (view any artifact as it existed at any historical point)\n+\n+---\n+\n+## 8. Content Authoring\n+\n+The workflow for creating, validating, reviewing, and publishing content within the domain model.\n+\n+- p1 - **Authoring Flow** (create → validate → review → approve → publish — configurable per document category)\n+- p1 - **Status Management** (draft → preview → final, with transition rules, approval gates, and notification triggers)\n+- p1 - **Validation Pipeline** (on every save: deterministic validators run first, then AI validators, then human review if needed)\n+- p2 - **Behavioral Specifications** (plain-English spec language embedded in Markdown — actor flows, algorithms, state descriptions — translatable to code with traceability tags, deterministically parseable for implementation tracking)\n+- p2 - **Review Process** (unified review surface for docs and code, reviewer routing by ownership, AI pre-review with severity classification)\n+- p2 - **Approval Gates** (policy-as-code enforcement — e.g., security review required for any PII-touching design)\n+- p2 - **Traceability Enforcement** (every artifact must link to its upstream and downstream dependencies before promotion)\n+\n+---\n+\n+## 9. Collaboration\n+\n+Real-time and asynchronous collaboration across humans and AI agents, scoped to domain model entities.\n+\n+- p1 - **Inline Comments** (threaded discussions with resolution tracking, line-anchoring that survives content changes, document-level comments)\n+- p2 - **Notifications** (configurable per-document/folder/space subscriptions via email, Slack, Teams; opt-in model)\n+- p2 - **AI + Human Chat** (per-artifact chat rooms with scoped context, mixed participants, decision capture into artifacts)\n+- p2 - **@Mentions & Assignments** (mention any actor, assign follow-up tasks, track resolution inline)\n+- p3 - **Inline Tasks** (create tasks directly from comments or discussions, linked to the originating artifact)\n+- p4 - **Real-Time Co-Editing** (multi-cursor collaborative editing on docs and diagrams, CRDT-based conflict resolution)\n+- p4 - **Digests** (daily/weekly AI-summarized change digests, personalized by role and team)\n+\n+---\n+\n+## 10. Feedback Collector\n+\n+A cross-cutting subsystem that captures every piece of feedback — from humans and AI — across the entire platform, creating a unified corpus for analysis, learning, and continuous improvement.\n+\n+- p1 - **Comment Harvesting** (collect all inline comments, PR review comments, chat messages, and approval notes into a normalized feedback store, tagged by source entity, author, and timestamp)\n+- p1 - **AI Feedback Capture** (record every AI-generated suggestion, review comment, and validation finding — with model, prompt, confidence score, and whether the human accepted, modified, or rejected it)\n+- p2 - **Feedback Classification** (auto-tag feedback by type — question, suggestion, blocker, nit, praise, concern — using lightweight AI classification)\n+- p2 - **Feedback Analytics** (dashboards: feedback volume by team/repo/category, resolution rates, recurring themes, sentiment trends, AI acceptance rates)\n+- p3 - **Insight Mining** (extract recurring patterns — frequent reviewer concerns, repeated design mistakes, common checklist gaps — and surface them as actionable recommendations)\n+- p3 - **Feedback-to-Action Pipeline** (turn feedback patterns into concrete outputs: new checklist items, updated templates, refined AI prompts, new validation rules)\n+\n+---\n+\n+## 11. Developer Tools & Agentic Interfaces\n+\n+Extending the platform beyond the web UI — into IDEs, terminals, CI pipelines, and AI coding agents — so that domain model context, validation, and automation are available where the work happens. The platform generates native integration entry points for all major AI coding tools (Claude Code, Cursor, Windsurf, Copilot, Codex); workflows are portable across tools, not locked to one.\n+\n+### IDE Extensions\n+\n+- p1 - **IDE Plugin** (VS Code / Cursor / Windsurf — document browsing, rich preview, editing with inline validation, inline comments, and search)\n+- p1 - **Syntax & Schema Validators in IDE** (same deterministic validators as Section 4, run on save — frontmatter, required sections, link integrity, style linters)\n+- p2 - **Semantic Validators in IDE** (AI-powered consistency and content-category checks surfaced as IDE diagnostics before commit)\n+- p2 - **Visual Elements** (render diagrams, JIRA badges, and cross-link previews inline in the IDE editor)\n+- p3 - **Chat with Context** (IDE-embedded chat scoped to the currently open artifact — summarize, refine, brainstorm, or generate drafts)\n+\n+### CLI Tools\n+\n+- p1 - **CLI Client** (headless access to core platform operations — query domain model, run validators, trigger syncs, manage tokens, script batch operations)\n+- p1 - **Local Validators** (run schema and link-integrity checks locally before commit or in CI pipelines — same rule set as the server)\n+- p2 - **Scaffold & Init** (generate new documents, repos, or kit projects from templates via command line)\n+- p2 - **Bulk Operations** (batch import, tag, link, or update domain model entities from scripts or CI jobs)\n+- p3 - **Report Generation** (export dashboards, traceability matrices, or release readiness reports as Markdown/HTML/PDF from the terminal)\n+\n+### Agentic Flows\n+\n+- p1 - **MCP Integration for AI Agents** (AI coding agents pull requirements, designs, and ADRs into code-generation context; push code-change summaries and PR metadata back into the platform)\n+- p2 - **Pre-Commit Hooks** (pluggable Git hooks that run validators and update domain model metadata on commit)\n+- p2 - **CI/CD Pipeline Actions** (GitHub Actions / GitLab CI steps for validation, link checks, release-note generation, and domain-model sync)\n+- p3 - **Agent-to-Agent Orchestration** (platform agents delegate tasks to IDE agents and vice versa — e.g., \"update the design doc after this code change\")\n+\n+---\n+---\n+\n+# Part B: Kits\n+\n+## What Kits Are\n+\n+A **kit** is the unit of extensibility in Cyber Constructor. It is a self-contained package that plugs into the core system to specialize, enrich, and extend it for a specific domain, tool, workflow, or role.\n+\n+Kits do four things:\n+\n+1. **Define origin-specific metadata** — extend core entities with fields specific to a source system (e.g., GitHub PR details, Jira custom fields, Snyk vulnerability enrichment), including cross-references between origin objects.\n+2. **Populate the domain model** — connectors and adapters fetch data from external systems and create/update domain model entities with the kit-defined metadata.\n+3. **Provide scripts and workflows** — deterministic validators, AI agents, and automation pipelines that operate on the domain model entities the kit manages.\n+4. **Provide visualization interfaces** — UI panels, dashboards, editors, and views tailored to the kit's entities and scenarios.\n+\n+People and scripts also create content (Markdown files, code, tasks) and update domain model entities directly — kits are not the only way data enters the system.\n+\n+---\n+\n+## Documentation Kits\n+\n+Each documentation kit ships templates, checklists, validation rules, AI authoring/review prompts, and UI panels for a specific document category. Vendors and teams can define their own.\n+\n+- p1 - **BRD Kit** (business case, executive summary, market opportunity templates; cost-benefit analysis and ROI worksheets; stakeholder impact assessment; strategic alignment checklists linking to OKRs/company goals)\n+- p1 - **PRD Kit** (lean PRD, full PRD, RFC-style, one-pager templates; checklists for problem clarity and success metrics; persona and JTBD templates; acceptance criteria generation)\n+- p1 - **Design Kit** (HLD/LLD templates; scalability, security, cost checklists; C4 diagrams; capacity planning worksheets; threat modeling and FMEA templates)\n+- p1 - **ADR Kit** (Nygard/MADR templates; decision lifecycle — proposed → accepted → superseded; trade-off matrices; reversibility classification)\n+- p1 - **Decomposition Kit** (epic → feature → story → task breakdown; dependency mapping; estimation frameworks; phased delivery planning)\n+- p1 - **Code Kit** (repo structure conventions; coding standards and linter configs; API design guidelines; testing strategy templates; code review checklists)\n+- p3 - **Operations Kit** (runbooks, playbooks, on-call rotation, incident response templates, postmortem/RCA templates, SLO/SLA/error-budget policies)\n+- p3 - **Security & Compliance Kit** (threat models, DPIA, SOC 2/ISO/HIPAA/GDPR mappings, secrets management policies, SBOM templates, vulnerability SLA policies)\n+- p3 - **Release & Change Kit** (release notes, feature flag lifecycle, migration/deprecation plans, customer communication templates)\n+- p3 - **Test Plan Kit** (test strategy/plan templates, test case/report templates, performance/chaos test plans, UAT templates linked to acceptance criteria)\n+\n+---\n+\n+## Integration Kits\n+\n+Each integration kit provides a deep, bidirectional connector for a specific external system — with origin-specific metadata, sync logic, and UI views.\n+\n+- p1 - **GitHub Kit** (PR metadata, commit details, branch rules, Actions integration, CODEOWNERS sync, repo lifecycle management)\n+- p1 - **GitLab Kit** (MR metadata, pipeline integration, protected branches, GitLab CI sync)\n+- p1 - **MCP Kit** (tool definitions for all domain operations, context-provider interfaces for IDE-embedded AI agents)\n+- p1 - **Jira Kit** (epic/story/task sync with custom field mapping, JQL filters, status transitions, sprint board data)\n+- p3 - **YouTrack Kit** (issue sync, agile board data, custom workflows, time tracking)\n+- p3 - **Confluence Kit** (page import, structured conversion, bidirectional link maintenance)\n+- p3 - **Slack Kit** (notifications, slash commands, chat-to-artifact capture, thread-based review flows)\n+- p3 - **Teams Kit** (notifications, adaptive cards, channel-scoped artifact feeds)\n+- p3 - **Snyk Kit** (vulnerability feed, fix PR suggestions, SBOM correlation, license compliance)\n+- p3 - **Trivy Kit** (container/IaC scan results, severity mapping, component correlation)\n+- p3 - **Semgrep Kit** (SAST findings, custom rule results, PR annotations)\n+- p3 - **SonarQube Kit** (code quality metrics, technical debt tracking, quality gate results)\n+- p4 - **Datadog Kit** (SLO/SLI ingest, alert correlation, dashboard links)\n+- p4 - **PagerDuty Kit** (incident sync, on-call schedule import, escalation policy mapping)\n+- p4 - **OTel Kit** (OpenTelemetry trace/metric ingest, service map correlation)\n+\n+---\n+\n+## Role-Specific Kits\n+\n+Kits that bundle AI agents, workflows, and dashboards tailored to a specific persona.\n+\n+- p2 - **Product Manager Kit** (idea intake/triage, PRD authoring with AI refinement, acceptance criteria generation, roadmap visualization, release GTM drafting)\n+- p2 - **Architect Kit** (pattern/building-block suggestions, PRD → Design generation, architecture validation, ADR workflows, tech radar, reference architecture library)\n+- p3 - **Engineering Manager Kit** (PR review dashboards, team velocity analytics, capacity planning, bottleneck heatmaps, DORA metrics)\n+- p3 - **Security Engineer Kit** (vulnerability posture dashboard, scanner findings triage, compliance mapping, SBOM analysis, threat model reviews)\n+- p4 - **SRE Kit** (SLO tracking, incident-to-postmortem pipeline, runbook suggestions, capacity sanity checks, alert-to-component correlation)\n+- p4 - **Educator Kit** (tutorial auto-generation, course creation from artifact corpus, onboarding path builder, quiz generation)\n+\n+---\n+\n+## Operational & Automation Kits\n+\n+Kits that package practical, reusable scripts, guidelines, and automation recipes that an organization or team can share, version, and enforce across projects.\n+\n+- p1 - **Repo Management Kit** (repository scaffolding scripts, branch protection setup, CODEOWNERS generation, PR template enforcement, stale-branch cleanup, repo health-check reports, naming convention validators)\n+- p1 - **Deployment Kit** (environment provisioning scripts, deployment checklists, rollback procedures, canary/blue-green workflow templates, environment variable management, TCO estimation helpers)\n+- p2 - **CI/CD Pipeline Kit** (reusable pipeline templates for build/test/deploy, matrix test configurations, artifact promotion scripts, pipeline health dashboards, flaky-test detection)\n+- p2 - **Log & Incident Analysis Kit** (log aggregation query templates, error-pattern detection scripts, incident triage runbooks, automated RCA draft from log patterns, alert-to-runbook linking)\n+- p3 - **Infrastructure-as-Code Kit** (Terraform/Pulumi module templates, drift detection scripts, cost estimation validators, resource tagging enforcement, IaC review checklists)\n+- p3 - **Database Operations Kit** (migration script templates, schema change review checklists, rollback procedures, data integrity validators, performance baseline scripts)\n+- p3 - **Secrets & Config Kit** (secrets rotation scripts, configuration drift detection, environment parity validators, vault integration helpers, sensitive-data-in-code scanners)\n+\n+---\n+\n+## Scenario & Workflow Kits\n+\n+Kits that implement cross-cutting workflows spanning multiple entity types and roles.\n+\n+- p2 - **Review Workflow Kit** (unified doc/code review surface, reviewer routing, AI pre-review, approval gates, SLA tracking)\n+- p2 - **Traceability Kit** (bidirectional linking enforcement, impact analysis, change propagation, orphan detection)\n+- p3 - **Release Readiness Kit** (release gates: test pass + security review + compliance sign-off; readiness dashboard; go/no-go checklist)\n+- p3 - **Onboarding Kit** (personalized ramp guides per role/team, auto-generated from team artifacts, mentor pairing, progress tracking)\n+- p4 - **Continuous Improvement Kit** (template evolution from postmortems, A/B testing of process changes, reuse/componentization detection, quality/risk scoring)\n+- p4 - **Analytics Kit** (DORA metrics, stage-level cycle time, bottleneck heatmaps, rework/churn analytics, predictive incident likelihood)\n+\n+---\n+---\n+\n+# Cyber Constructor - User Scenarios Examples\n+\n+### 1. Validate an Idea Before Committing Teams (Product Manager)",
