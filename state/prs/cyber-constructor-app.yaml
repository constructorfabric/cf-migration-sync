          "created_at": "2026-05-06T14:13:22Z",
          "updated_at": "2026-05-06T14:13:22Z",
          "body": "Suggestion: explicitly define the two supported orchestration modes in the vision. One mode is LLM-led orchestration, where an agent decides the next action and invokes deterministic tools and/or other agents as executors. The second mode is deterministic workflow orchestration, where a configurable workflow defines the sequence and the LLM acts as an executor within that flow. Making both modes explicit would clarify the platform model and help separate agent autonomy from workflow-driven execution.",
