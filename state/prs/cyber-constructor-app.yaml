          "diff_hunk": "@@ -0,0 +1,39 @@\n+# Cyber Constructor\n+\n+An intelligent, AI-native system that unifies the entire software delivery lifecycle — from requirements to production — into a single, connected, machine-readable domain.\n+\n+## Why\n+\n+AI has made code generation fast and cheap. The bottleneck has moved to everything *around* the code: requirements, architecture, coordination, compliance, releases, and operations. Cyber Constructor closes that gap.\n+\n+## Mission\n+\n+Model the entire software delivery lifecycle — from idea to production — as a connected, machine-readable, AI-native domain where every artifact is linked, every decision is traceable, every process is automatable, and every human and AI agent operates on the same structured, versioned, auditable foundation.\n+\n+## Values\n+\n+1. **Structured over freeform** — every artifact is machine-validatable, linkable, and queryable.\n+2. **Traceability by construction** — links are first-class, not afterthoughts.\n+3. **AI-native, human-governed** — AI drafts, humans decide; every AI action is attributable and reversible.\n+4. **Deterministic where it matters** — IDs, schemas, and reconciliation are deterministic; creativity lives inside guardrails.\n+5. **Open fabric** — interoperate with the tools teams already use; never become a walled garden.\n+6. **Measurable outcomes** — every capability ties back to flow metrics (DORA, lead time, rework, incident rate).\n+\n+## How It Works\n+\n+- **Content lives in Git** — specs, templates, rules, and code are the source of truth\n+- **Metadata lives in a database** — UI state, indexes, caches; never content\n+- **Pluggable web server** — kit-contributed UI panels, editors, dashboards, and backend workflows\n+- **Index / RAG server** — semantic search and retrieval over all content\n+- **Kits extend everything** — metadata schemas, connectors, scripts, AI agents, and visualizations\n+\n+## Structure\n+\n+```\n+docs/\n+  VISION.md    — Vision, domain model, core system, and kit architecture\n+```",
