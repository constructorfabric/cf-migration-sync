          "updated_at": "2026-05-06T14:40:08Z",
          "body": "Suggestion: add a short architectural vocabulary / taxonomy section that explicitly separates platform primitives from packaging/runtime forms. Right now the document uses kits, workflows, agents, tools, validation pipelines, and scenario/workflow kits in ways that are individually plausible, but their boundaries are not yet fully clear. It would help to define, for example: tool = atomic operation; agent = reasoning actor that invokes tools; workflow = constrained sequence/guardrails; kit = extension package that can contribute metadata, tools, workflows, agents, and UI. That clarification would make the platform model easier to reason about and reduce ambiguity around core responsibilities versus extension packaging.",
