          "body": "_⚠️ Potential issue_ | _🔴 Critical_\n\n<details>\n<summary>🧩 Analysis chain</summary>\n\n🏁 Script executed:\n\n```shell\n#!/bin/bash\n# Verify if other locale files under richtext/i18n are also untranslated\n\necho \"Checking for English-only content in RichText i18n files...\"\nfd -e json . src/screensets/demo/screens/richtext/i18n/ --exec sh -c 'echo \"File: {}\"; grep -c \"\\\"title\\\": \\\"Rich Text\\\"\" {} && echo \"  -> Contains English placeholder\"'\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 3446\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check if en.json and ar.json are identical\necho \"=== Comparing en.json and ar.json ===\"\ndiff src/screensets/demo/screens/richtext/i18n/en.json src/screensets/demo/screens/richtext/i18n/ar.json && echo \"Files are IDENTICAL\" || echo \"Files DIFFER\"\n\n# Check a few other locale files to see if they differ from ar.json\necho -e \"\\n=== Comparing ar.json vs fr.json ===\"\ndiff src/screensets/demo/screens/richtext/i18n/ar.json src/screensets/demo/screens/richtext/i18n/fr.json | head -10 && echo \"Files are IDENTICAL\" || echo \"Files DIFFER (showing first 10 lines)\"\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 187\n\n---\n\n🏁 Script executed:\n\n```shell\n# Search for actual translated content patterns\necho \"=== Looking for translated content in richtext i18n files ===\"\nrg \"[\\u0600-\\u06FF]|[\\u0400-\\u04FF]|[\\u4E00-\\u9FFF]|[\\u3040-\\u309F]\" src/screensets/demo/screens/richtext/i18n/ || echo \"No non-Latin translations found\"\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 165\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check how the i18n system is configured and loads translations\necho \"=== Searching for i18n configuration and usage ===\"\nrg -t js -t ts \"richtext.*i18n|i18n.*richtext\" src/ --max-count=5\nrg \"import.*from.*richtext.*i18n\" src/ --max-count=5\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 122\n\n---\n\n🏁 Script executed:\n\n```shell\n# Check if translations exist elsewhere in the codebase with different naming\necho \"=== Searching for alternate translation patterns ===\"\nrg -i \"arabic|عربي|ar.*translation\" src/ --max-count=5\n\n# Look for any TODO/FIXME comments related to richtext translations\necho -e \"\\n=== Searching for translation TODOs ===\"\nrg -i \"todo|fixme|wip\" src/screensets/demo/screens/richtext/i18n/ \n\n# Check git history for any recent changes to these files\necho -e \"\\n=== Checking git status of i18n files ===\"\ngit ls-files src/screensets/demo/screens/richtext/i18n/ | wc -l && echo \"Total i18n files tracked\"\n```\n\nRepository: cyberfabric/cyber-wiki-front\n\nLength of output: 3563\n\n---\n\n\n\n</details>\n\n**Arabic translations are completely missing.**\n\nThis Arabic (`ar`) locale file contains 100% English text. All values from lines 2-43 should be translated to Arabic (العربية).\n\nThis renders the Arabic locale completely non-functional—Arabic-speaking users will see an entirely English interface.\n\nPlease provide proper Arabic translations for:\n- UI labels and messages (title, loading, saving, error states)\n- Mode labels (read/edit/source)\n- Action labels (save, copy operations, word wrap)\n- Toolbar controls (formatting, headings, blocks, lists)\n- Context menu items\n- Statistics labels\n\nNote: The same issue affects all 36 locale files in `src/screensets/demo/screens/richtext/i18n/` (ar, en, fr, de, es, it, ja, ko, zh, ru, etc.)—all are identical copies containing only English content. Consider addressing this systemic i18n gap across all supported languages.\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/screensets/demo/screens/richtext/i18n/ar.json` around lines 1 - 44, The\nar.json file currently contains English strings for keys like \"title\",\n\"loading\", \"mode_read\", \"mode_edit\", \"mode_source\", \"save\", \"saving\", \"unsaved\",\n\"error\", \"copy_md\", \"copy_code\", \"copy_text\", \"word_wrap\" and nested keys under\n\"toolbar\" (e.g.,\n\"bold\",\"italic\",\"strike\",\"code\",\"formatting\",\"headings\",\"h1\",\"h2\",\"h3\",\"blocks\",\"bullet_list\",\"ordered_list\",\"quote\"),\n\"context\" (e.g.,\n\"format\",\"paragraph\",\"insert\",\"horizontal_rule\",\"cut\",\"copy\",\"paste\") and\n\"stats\" (\"words\",\"chars\",\"lines\"); replace every English value with accurate\nArabic translations (العربية) preserving the exact JSON keys and structure,\nensure proper RTL phrasing and punctuation, and then audit the other files in\nsrc/screensets/demo/screens/richtext/i18n/ (all locale files) to provide correct\ntranslations per language or restore their localized content instead of copies\nof English.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:triton:puma:c8069c9e-02c4-4b2d-8a1f-91b95c65ae1b -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
