          "body": "_⚠️ Potential issue_ | _🟠 Major_\n\n**Render a failure state for document load errors.**\n\n`src/screensets/demo/actions/editorActions.ts:10-21` already emits `EditorEvents.DocumentLoadFailed`, and `src/screensets/demo/effects/editorEffects.ts:16-32` stores that failure in the editor slice. This branch only checks `editorState.document`, so a failed fetch stays on the loading placeholder forever and gives the user no retry path.\n\n\n\nAlso applies to: 187-200\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/screensets/demo/screens/editor/components/EditorInner.tsx` around lines\n169 - 171, The component currently only checks editorState.document so when\ndocument fetch fails (EditorEvents.DocumentLoadFailed) the UI stays stuck on the\nloading placeholder; update the EditorInner render logic to detect the failure\nstored in the editor slice (e.g., editorState.error or a documentLoadFailed\nflag) and render a failure state with an error message and a retry control that\ncalls loadEditorDocument; apply the same check/failure UI in both places where\nthe loading placeholder is used (the initial load block and the later render\nblock) so users can see the error and retry.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:932fcec4-6513-40e7-9e7e-c5cf532109f0 -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
