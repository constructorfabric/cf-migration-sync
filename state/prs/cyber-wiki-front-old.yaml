          "body": "_⚠️ Potential issue_ | _🔴 Critical_\n\n**Hardcoded `localhost` will break every non-local environment.**\n\nIn a deployed browser, `http://localhost:8000` points to the end user's own machine, not your backend. Login/logout will fail outside local dev, and HTTPS pages will also hit mixed-content errors. Move the host into runtime config or use same-origin `/api/...` URLs.\n\n\n<details>\n<summary>Example if the frontend is reverse-proxied to the API</summary>\n\n```diff\n-const API_BASE_URL = 'http://localhost:8000';\n-\n export const authApi = {\n@@\n-    const response = await fetch(`${API_BASE_URL}/api/auth/v1/login`, {\n+    const response = await fetch('/api/auth/v1/login', {\n@@\n-    const response = await fetch(`${API_BASE_URL}/api/auth/v1/logout`, {\n+    const response = await fetch('/api/auth/v1/logout', {\n```\n</details>\n\n\nAlso applies to: 37-40\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/screensets/auth/api/auth.ts` around lines 7 - 21, The API_BASE_URL\nconstant is hardcoded to 'http://localhost:8000', which breaks non-local and\nHTTPS deployments; change API_BASE_URL to be driven from runtime configuration\n(e.g., read from an injected runtime config object or a build env like\nprocess.env.PUBLIC_API_BASE_URL) and default to an empty string for same-origin\ncalls to avoid mixed-content (so endpoints become\n`${API_BASE_URL}/api/auth/v1/...` with API_BASE_URL === '' by default). Update\nthe authApi constant usages (notably authApi.login and the other endpoints\naround lines 37-40) to use this runtime-backed API_BASE_URL and ensure\ncredentials/header behavior is preserved. Ensure the config value is documented\nor provided during deployment and falls back safely to same-origin if not set.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:ec77ed43-8d27-480c-8719-a38dfe0e264c -->\n\n<!-- This is an auto-generat