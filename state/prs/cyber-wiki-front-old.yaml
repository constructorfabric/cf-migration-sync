          "body": "_⚠️ Potential issue_ | _🔴 Critical_\n\n**PUT handler mutates and returns the wrong document.**\n\nThe mock for `PUT /api/editor/documents/notes-1` updates `mockDocuments[mockDefaultDocumentId]` (Lines 18-20) and returns it (Line 22), but it should operate on `mockDocuments['notes-1']`. This breaks the API contract: when `saveDocument('notes-1', content)` is called, the returned document will have the wrong `id`, causing `setDocumentSaved` in the Redux slice to overwrite the editor state with the default document instead of the saved one.\n\n\n<details>\n<summary>🐛 Proposed fix</summary>\n\n```diff\n  'PUT /api/editor/documents/notes-1': (requestData) => {\n    const data = requestData as Record<string, unknown> | undefined;\n    const content = data?.content;\n-   if (typeof content === 'string' && mockDocuments[mockDefaultDocumentId]) {\n-     mockDocuments[mockDefaultDocumentId].content = content;\n-     mockDocuments[mockDefaultDocumentId].updatedAt = new Date().toISOString();\n+   if (typeof content === 'string' && mockDocuments['notes-1']) {\n+     mockDocuments['notes-1'].content = content;\n+     mockDocuments['notes-1'].updatedAt = new Date().toISOString();\n    }\n-   return mockDocuments[mockDefaultDocumentId];\n+   return mockDocuments['notes-1'];\n  },\n```\n</details>\n\n<!-- suggestion_start -->\n\n<details>\n<summary>📝 Committable suggestion</summary>\n\n> ‼️ **IMPORTANT**\n> Carefully review the code before committing. Ensure that it accurately replaces the highlighted code, contains no missing lines, and has no issues with indentation. Thoroughly test & benchmark the code to ensure it meets the requirements.\n\n```suggestion\n  'PUT /api/editor/documents/notes-1': (requestData) => {\n    const data = requestData as Record<string, unknown> | undefined;\n    const content = data?.content;\n    if (typeof content === 'string' && mockDocuments['notes-1']) {\n      mockDocuments['notes-1'].content = content;\n      mockDocuments['notes