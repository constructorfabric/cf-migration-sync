          "body": "_⚠️ Potential issue_ | _🟠 Major_\n\n**Save failures are silently swallowed - users receive no feedback.**\n\nUnlike `loadEditorDocument` which emits `DocumentLoadFailed` on error, `saveEditorDocument` only logs to console. This means:\n- Users won't know their changes failed to persist\n- The UI `saving` state may remain stale\n- The `error` field in `editorSlice` (which has `setEditorError`) is never populated for save failures\n\nAdd a `DocumentSaveFailed` event to communicate errors to the UI.\n\n\n<details>\n<summary>Proposed fix</summary>\n\nFirst, add the event in `src/screensets/demo/events/editorEvents.ts`:\n```diff\n export enum EditorEvents {\n   DocumentLoaded = 'demo/editor/documentLoaded',\n   DocumentLoadFailed = 'demo/editor/documentLoadFailed',\n   ContentUpdated = 'demo/editor/contentUpdated',\n   DocumentSaved = 'demo/editor/documentSaved',\n+  DocumentSaveFailed = 'demo/editor/documentSaveFailed',\n }\n\n declare module '@hai3/react' {\n   interface EventPayloadMap {\n     [EditorEvents.DocumentLoaded]: { document: EditorDocument };\n     [EditorEvents.DocumentLoadFailed]: { error: string };\n     [EditorEvents.ContentUpdated]: { content: string };\n     [EditorEvents.DocumentSaved]: { document: EditorDocument };\n+    [EditorEvents.DocumentSaveFailed]: { error: string };\n   }\n }\n```\n\nThen update the action:\n```diff\n export const saveEditorDocument = (id: string, content: string): void => {\n   void apiRegistry.getService(EditorApiService).saveDocument(id, content).then((document) => {\n     eventBus.emit(EditorEvents.DocumentSaved, { document });\n   }).catch((err: unknown) => {\n+    const message = err instanceof Error ? err.message : String(err);\n     console.warn('[editor] saveEditorDocument failed:', err);\n+    eventBus.emit(EditorEvents.DocumentSaveFailed, { error: message });\n   });\n };\n```\n\n</details>\n\n<!-- suggestion_start -->\n\n<details>\n<summary>📝 Committable suggestion</summary>\n\n> ‼️ **IMPORTANT**\n> Carefully review the code before committing. Ensure that it accurately replaces the highlighted code, contains no missing lines, and has no issues with indentation. Thoroughly test & benchmark the code to ensure it meets the requirements.\n\n```suggestion\nexport const saveEditorDocument = (id: string, content: string): void => {\n  void apiRegistry.getService(EditorApiService).saveDocument(id, content).then((document) => {\n    eventBus.emit(EditorEvents.DocumentSaved, { document });\n  }).catch((err: unknown) => {\n    const message = err instanceof Error ? err.message : String(err);\n    console.warn('[editor] saveEditorDocument failed:', err);\n    eventBus.emit(EditorEvents.DocumentSaveFailed, { error: message });\n  });\n};\n```\n\n</details>\n\n<!-- suggestion_end -->\n\n<details>\n<summary>🧰 Tools</summary>\n\n<details>\n<summary>🪛 GitHub Check: SonarCloud Code Analysis</summary>\n\n[failure] 34-34: Remove this use of the \"void\" operator.\n\nSee more on https://sonarcloud.io/project/issues?id=cyberfabric_cyber-wiki-front&issues=AZ1oZsFiO3px3FwJaBUd&open=AZ1oZsFiO3px3FwJaBUd&pullRequest=3\n\n</details>\n\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/screensets/demo/actions/editorActions.ts` around lines 33 - 38, Add a new\nEditorEvents.DocumentSaveFailed constant in editorEvents.ts and update\nsaveEditorDocument to emit that event on failure: after calling\nEditorApiService.saveDocument inside saveEditorDocument, replace the\nconsole.warn in the catch with eventBus.emit(EditorEvents.DocumentSaveFailed, {\nid, error: err }) (include the document id and the caught error) so the UI can\nupdate saving state and setEditorError; keep the successful path emitting\nEditorEvents.DocumentSaved as-is.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:ocelot:1b00d0f1-48ac-49ff-a0c4-f85a8509cf26 -->\n\n<!-- This is an auto-generated comment by