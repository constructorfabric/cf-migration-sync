          "body": "_⚠️ Potential issue_ | _🟠 Major_\n\n**Add accessible names to the icon-only controls.**\n\nThese controls render only icons, so the tooltip text does not give them an accessible name. Screen-reader and voice-control users will hit unlabeled buttons for the overflow menu, save action, and mode toggle unless you add localized `aria-label`s.\n\n\n\nAlso applies to: 451-453, 462-464\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/screensets/demo/screens/richtext/components/MdRenderer.tsx` around lines\n153 - 155, The icon-only Button elements in MdRenderer.tsx (e.g., the Button\nwrapping MoreHorizontalIcon and the other icon-only Buttons referenced) need\naccessible names: add aria-label props with localized descriptive strings (use\nthe existing i18n utility or a t(...) call) to each icon-only Button (e.g.,\naria-label={t('richtext.overflowMenu')}, aria-label={t('richtext.save')},\naria-label={t('richtext.toggleMode')}); keep existing tooltips and sizing but\nensure each Button component has a meaningful, localizable aria-label to give\nscreen-reader and voice-control users an accessible name.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:1505384e-b6fe-46ae-8ce6-1ee4c3253bfa -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
