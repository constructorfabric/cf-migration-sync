          "body": "_⚠️ Potential issue_ | _🟠 Major_\n\n**Remove the auth debug log before merge.**\n\nThis prints the current user object and token to the browser console on every auth change.\n\n\n<details>\n<summary>Proposed fix</summary>\n\n```diff\n-import { useEffect } from 'react';\n import { useAppSelector, type RootState } from '@hai3/react';\n import { LoginPage } from '../pages/Login';\n import { AppRouter } from '@hai3/react';\n import { Layout } from '@/app/layout';\n import { StudioOverlay } from '@hai3/studio';\n@@\n-  // Debug log\n-  useEffect(() => {\n-    console.log('[AuthenticatedApp] Auth state:', { user, token, isAuthenticated });\n-  }, [user, token, isAuthenticated]);\n-\n   // Show login page if not authenticated\n   if (!isAuthenticated) {\n     return <LoginPage />;\n   }\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@src/app/AuthenticatedApp.tsx` around lines 21 - 24, The temporary debug\nuseEffect in AuthenticatedApp that calls console.log('[AuthenticatedApp] Auth\nstate:', { user, token, isAuthenticated }) should be removed to avoid printing\nsensitive user/token data; locate the useEffect referencing user, token,\nisAuthenticated in AuthenticatedApp and delete the console.log line or the\nentire useEffect block (or replace it with a non-sensitive telemetry call if\nneeded).\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:grasshopper:ec77ed43-8d27-480c-8719-a38dfe0e264c -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->",
