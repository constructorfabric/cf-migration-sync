          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\n<!-- This is an auto-generated comment: review paused by coderabbit.ai -->\n\n> [!NOTE]\n> ## Reviews paused\n> \n> It looks like this branch is under active development. To avoid overwhelming you with review comments due to an influx of new commits, CodeRabbit has automatically paused this review. You can configure this behavior by changing the `reviews.auto_review.auto_pause_after_reviewed_commits` setting.\n> \n> Use the following commands to manage reviews:\n> - `@coderabbitai resume` to resume automatic reviews.\n> - `@coderabbitai review` to trigger a single review.\n> \n> Use the checkboxes below for quick actions:\n> - [ ] <!-- {\"checkboxId\": \"7f6cc2e2-2e4e-497a-8c31-c9e4573e93d1\"} --> ▶️ Resume reviews\n> - [ ] <!-- {\"checkboxId\": \"e9bb8d72-00e8-4f67-9cb2-caf3b22574fe\"} --> 🔍 Trigger review\n\n<!-- end of auto-generated comment: review paused by coderabbit.ai -->\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nAdds a new migrate-openspec workflow and supporting metadata: project version bumped to 1.2.0, manifest resource for the workflow, SKILL.md migration documentation, whatsnew entry, and a new workflow spec describing an 8‑phase OpenSpec → Cypilot SDLC migration pipeline.\n\n## Changes\n\n|Cohort / File(s)|Summary|\n|---|---|\n|**Version & Configuration** <br> `conf.toml`|Bumped project version from `1.1.1` to `1.2.0`.|\n|**Manifest & Resource Declaration** <br> `manifest.toml`|Added new `[[resources]]` entry `workflow_migrate_openspec` pointing to `workflows/migrate-openspec.md` (type: `file`, `user_modifiable = false`).|\n|**Top-level Documentation** <br> `SKILL.md`|Inserted MIGRATION section, added `migrate-openspec` to Workflows list, documented migration commands, routing logic, discovery/interaction details, and updated PRD-related references.|\n|**Release Notes** <br> `whatsnew.toml`|Added `1.2.0` entry describing the migrate-openspec workflow, configuration, migration phases, and Code Verification Protocol.|\n|**Workflow Specification (new)** <br> `workflows/migrate-openspec.md`|New comprehensive workflow (~1132 lines) defining an 8‑phase migration pipeline, Source→Target mappings, verification protocol, CLI usage, discrepancy logging, artifact registration, gated reviews, and error-handling.|\n\n## Sequence Diagram(s)\n\n```mermaid\nsequenceDiagram\n  participant User as User / CLI\n  participant Workflow as Migrate-OpenSpec Workflow\n  participant Repo as Git Repository\n  participant Registry as artifacts.toml Registry\n\n  User->>Workflow: invoke migrate-openspec CLI\n  Workflow->>Repo: scan repo, extract OpenSpec artifacts\n  Workflow->>Workflow: run phased transforms (inventory → PRD → DESIGN → ADRs → ...)\n  Workflow->>Repo: create PRs, place code markers\n  Workflow->>Registry: register generated artifacts\n  Registry->>Workflow: validate registrations & traceability\n  Workflow->>User: emit migration-report and discrepancy-log\n```\n\n## Estimated code review effort\n\n🎯 3 (Moderate) | ⏱️ ~25 minutes\n\n## Poem\n\n> 🐰 I hop through specs and YAML bright,  \n> Phase by phase I chase the light,  \n> I mark the code and stitch the trace,  \n> I log the gaps and find their place,  \n> A migration snug, with thumping delight.\n\n</details>\n\n<!-- walkthrough_end -->\n\n<!-- pre_merge_checks_walkthrough_start -->\n\n<details>\n<summary>🚥 Pre-merge checks | ✅ 3</summary>\n\n<details>\n<summary>✅ Passed checks (3 passed)</summary>\n\n|     Check name     | Status   | Explanation                                                                                                                                                                  |\n| :----------------: | :------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n|  Description