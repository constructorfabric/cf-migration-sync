template.md\n      {scripts}: cypilot/config/kits/sdlc/scripts\n      {skill}: cypilot/config/kits/sdlc/SKILL.md\n      {workflow_pr_review}: cypilot/config/kits/sdlc/workflows/pr-review.md\n      {workflow_pr_status}: cypilot/config/kits/sdlc/workflows/pr-status.md\n\n  Total: 50 variables resolved\n```",
