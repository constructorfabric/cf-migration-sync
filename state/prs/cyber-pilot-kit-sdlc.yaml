        "body": "- New migrate-openspec workflow that converts any project's OpenSpec artifacts (proposals, specs, designs, tasks)\r\n  into Cypilot SDLC documents (PRD, DESIGN, ADR, FEATURE, DECOMPOSITION) with code-verified traceability\r\n- Fully parameterized — all project-specific values discovered at runtime via artifacts.toml or user prompts\r\n- Includes OpenSpec Format Reference appendix so agents understand the source format without external docs\n\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n## Summary by CodeRabbit\n\n* **New Features**\n  * Added a packaged OpenSpec → Cypilot SDLC migration workflow with multi‑phase processing, verification checkpoints, deterministic validation, artifact traceability, and routing to trigger migration when patterns are detected.\n  * Registered the migration workflow as a packaged resource.\n\n* **Documentation**\n  * Added comprehensive migration docs: migration commands/workflows, configuration, format reference, CLI usage, routing/interaction steps, PRD terminology updates, and a 1.2.0 \"what's new\" entry.\n\n* **Chores**\n  * Bumped release version to 1.2.0 and updated workflow listing in top-level docs.\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
