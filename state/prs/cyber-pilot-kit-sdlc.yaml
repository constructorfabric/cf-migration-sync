          "body": "_⚠️ Potential issue_ | _🟡 Minor_\n\n**FEATURE output path and reference links are likely inconsistent.**  \nWith files at `features/feature-{slug}/FEATURE.md`, default template-style references like `../PRD.md`/`../DESIGN.md` resolve incorrectly; guidance should explicitly require `../../PRD.md` and `../../DESIGN.md`.\n\n<details>\n<summary>Suggested patch</summary>\n\n```diff\n-3. §1 Feature Context: Overview, Purpose (reference PRD fr/nfr IDs), Actors, References\n+3. §1 Feature Context: Overview, Purpose (reference PRD fr/nfr IDs), Actors, References\n+   - If FEATURE is at `features/feature-{slug}/FEATURE.md`, use:\n+     - PRD: `../../PRD.md`\n+     - DESIGN: `../../DESIGN.md`\n```\n</details>\n\n<details>\n<summary>🧰 Tools</summary>\n\n<details>\n<summary>🪛 markdownlint-cli2 (0.21.0)</summary>\n\n[warning] 754-754: Fenced code blocks should have a language specified\n\n(MD040, fenced-code-language)\n\n</details>\n\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@workflows/migrate-openspec.md` around lines 750 - 763, The FEATURE output\npath guidance for files created at\n{artifacts_output}/features/feature-{slug}/FEATURE.md uses relative references\nthat will resolve incorrectly; update the instructions in the feature template\nguidance so all cross-file links inside FEATURE.md explicitly point two levels\nup (e.g., use ../../PRD.md and ../../DESIGN.md instead of ../PRD.md and\n../DESIGN.md), and update any example/reference lines that mention relative\npaths or link resolution to reflect the correct ../../ prefix for both PRD and\nDESIGN references and any other sibling files referenced from FEATURE.md.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:hawk -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commit 117ea1a",
