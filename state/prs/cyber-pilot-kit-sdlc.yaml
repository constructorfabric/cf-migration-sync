        "body": "## Summary\n\n- **Bug**: `scripts/pr.py` was reporting 0 unresolved code comments even when review threads existed with `isResolved=false` and `isOutdated=false`.\n- **Root cause 1**: `unresolved_threads` was filtered only on `isResolved=false`, so outdated threads (`isOutdated=true`) were included in the count while genuinely actionable threads could be silently miscounted.\n- **Root cause 2**: The loop building `code_threads` had an `if not humans: continue` guard that skipped any thread where all comments came from bots. Since automated reviewers (e.g. `coderabbitai`) post real actionable threads that need PR author attention, these were all dropped.\n\n## Fix\n\nTwo minimal changes in `status()` in `scripts/pr.py`:\n\n1. Added `and not t.get(\"isOutdated\")` to the `unresolved_threads` filter so only genuinely actionable (non-outdated) threads are counted and listed.\n2. Removed the `if not humans: continue` guard — bot-authored review threads still need to be addressed by the PR author and should appear in the \"Unreplied Code Comments\" section.\n\n## Test plan\n\n- [ ] Run `pr.py status <PR_NUMBER>` on a PR that has review threads with `isResolved=false` and `isOutdated=false`.\n- [ ] Verify the \"Code comments\" header row now shows the correct non-zero unresolved count.\n- [ ] Verify each unresolved non-outdated thread appears in the \"Unreplied Code Comments\" section.\n- [ ] Verify threads with `isOutdated=true` do NOT appear as unresolved code comments.\n\n> Originally submitted as cyberfabric/cyber-pilot#116 — redirected here per @ainetx's review comment.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n\n<!-- This is an auto-generated comment: release notes by coderabbit.ai -->\n\n## Summary by CodeRabbit\n\n* **Refactor**\n  * Updated PR thread filtering logic to more accurately track unresolved discussion threads, including those containing bot-generated comments in review workflows.\n\n<!-- end of auto-generated comment: release notes by coderabbit.ai -->",
