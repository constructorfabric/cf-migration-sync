          "body": "Please read manifest.toml and use paths resolution as `{variable_name}`, for example\n`id = \"decomposition_template\"` -> `{decomposition_template}`\n\nreal example: https://github.com/cyberfabric/cyber-pilot-kit-sdlc/blob/main/artifacts/DECOMPOSITION/rules.md?plain=1#L6-L9\n\nSKILL is trained to resolve them using `cpt info` / `cpt resolve-vars` commands\n\n```\nviator@Maxim-Panfilov-Acronis-MacBook-Pro cyber-repo % cpt resolve-vars\n\n  Resolved Variables\n  ▸ System\n      {cypilot_path}: cypilot\n      {project_root}: .\n\n  ▸ Kit: sdlc (48 variables)\n      {adr_checklist}: cypilot/config/kits/sdlc/artifacts/ADR/checklist.md\n      {adr_example}: templates/ADR/examples/example.md\n      {adr_rules}: cypilot/config/kits/sdlc/artifacts/ADR/rules.md\n      {adr_template}: templates/ADR/template.md\n      {agents}: cypilot/config/kits/sdlc/AGENTS.md\n      {codebase_checklist}: cypilot/config/kits/sdlc/codebase/checklist.md\n      {codebase_rules}: cypilot/config/kits/sdlc/codebase/rules.md\n      {constraints}: cypilot/config/kits/sdlc/constraints.toml\n      {decomposition_checklist}: cypilot/config/kits/sdlc/artifacts/DECOMPOSITION/checklist.md\n      {decomposition_example}: templates/DECOMPOSITION/examples/example.md\n      {decomposition_rules}: cypilot/config/kits/sdlc/artifacts/DECOMPOSITION/rules.md\n      {decomposition_template}: templates/DECOMPOSITION/template.md\n      {design_checklist}: cypilot/config/kits/sdlc/artifacts/DESIGN/checklist.md\n      {design_example}: templates/DESIGN/examples/example.md\n      {design_rules}: cypilot/config/kits/sdlc/artifacts/DESIGN/rules.md\n      {design_template}: templates/DESIGN/template.md\n      {feature_checklist}: cypilot/config/kits/sdlc/artifacts/FEATURE/checklist.md\n      {feature_example}: templates/FEATURE/examples/example.md\n      {feature_rules}: cypilot/config/kits/sdlc/artifacts/FEATURE/rules.md\n      {feature_template}: templates/FEATURE/template.md\n      {library_analytics}