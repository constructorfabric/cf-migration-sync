          "body": "_⚠️ Potential issue_ | _🟠 Major_\n\n<details>\n<summary>🧩 Analysis chain</summary>\n\n🌐 Web query:\n\n`In Roslyn for C#, what syntax node type does `UsingDirectiveSyntax.Name` use for `using static global::System.Console;`, and is semantic symbol resolution the recommended way to match the referenced type robustly?`\n\n💡 Result:\n\nIn Roslyn for C#, the UsingDirectiveSyntax.Name property uses NameSyntax as its type for the directive using static global::System.Console;. This is explicitly stated in the official Microsoft documentation, which notes that both normal using X.Y.Z; and using static X.Y.Z; directives always have a Name property of type NameSyntax (or NameSyntax? in nullable reference types contexts). Yes, semantic symbol resolution is the recommended way to match the referenced type robustly. Use the SemanticModel.GetSymbolInfo(usingDirective.Name) method to obtain the ISymbol (typically INamedTypeSymbol for using static targeting a type like Console), which resolves the fully qualified type even with aliases, global qualifiers, or complex scenarios. This approach is demonstrated in multiple Roslyn usage examples and is standard practice for semantic analysis over pure syntax matching, as syntax alone (e.g., string comparison on Name.ToString) is fragile to formatting, aliases, and qualified names.\n\nCitations:\n\n- 1: https://learn.microsoft.com/en-us/dotnet/api/microsoft.codeanalysis.csharp.syntax.usingdirectivesyntax.name?view=roslyn-dotnet-5.0.0\n- 2: https://learn.microsoft.com/en-us/dotnet/api/microsoft.codeanalysis.csharp.syntax.usingdirectivesyntax.name?view=roslyn-dotnet-4.14.0\n- 3: https://learn.microsoft.com/en-us/dotnet/api/microsoft.codeanalysis.csharp.syntax.usingdirectivesyntax?view=roslyn-dotnet-5.0.0\n- 4: https://stackoverflow.com/questions/39451235/find-usingdirectivesyntax-that-belongs-to-invocationexpressionsyntax\n- 5: https://stackoverflow.com/questions/36407563/how-can-i-get-the-fully-qualified-namespace-from-a-using-directive-in-roslyn\n\n---\n\n🏁 Script executed:\n\n```shell\ncat -n analyzers/DE13_common_patterns/CyberFabric.Analyzers.NoConsoleUsage/NoConsoleUsageAnalyzer.cs | head -100\n```\n\nRepository: cyberfabric/cyberfabric-core-csharp\n\nLength of output: 4732\n\n---\n\n\n\n</details>\n\n**`using static` detection is too syntax-specific and can be bypassed.**\n\nLines 70–73 only match `System.Console` as `QualifiedNameSyntax` with specific `IdentifierNameSyntax` patterns, so forms like `using static global::System.Console;` are not caught. The `global::` qualifier produces an `AliasQualifiedNameSyntax` where `Left` is not an `IdentifierNameSyntax`, causing the pattern match to fail. Prefer semantic symbol resolution against `consoleType` (already available from line 40).\n\n<details>\n<summary>🔧 Proposed fix</summary>\n\n```diff\n-                if (usingDirective.StaticKeyword.IsKind(SyntaxKind.StaticKeyword) &&\n-                    usingDirective.Name is QualifiedNameSyntax qualifiedName &&\n-                    qualifiedName.Right is IdentifierNameSyntax { Identifier.Text: \"Console\" } &&\n-                    qualifiedName.Left is IdentifierNameSyntax { Identifier.Text: \"System\" })\n+                if (usingDirective.StaticKeyword.IsKind(SyntaxKind.StaticKeyword))\n                 {\n-                    syntaxContext.ReportDiagnostic(\n-                        Diagnostic.Create(\n-                            Rule,\n-                            usingDirective.GetLocation()\n-                            ));\n+                    var symbol = syntaxContext.SemanticModel\n+                        .GetSymbolInfo(usingDirective.Name, syntaxContext.CancellationToken)\n+                        .Symbol as INamedTypeSymbol;\n+\n+                    if (symbol is not null && SymbolEqualityComparer.Default.Equals(symbol, consoleType))\n+                    {\n+                        syntaxContext.ReportDiagnostic(\n+                            Diagnostic.Create(\n+                                Rule,\n+                                usingDirective.GetLocation()\n+                            ));\n+                    }\n                 }\n```\n</details>\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn\n`@analyzers/DE13_common_patterns/CyberFabric.Analyzers.NoConsoleUsage/NoConsoleUsageAnalyzer.cs`\naround lines 70 - 73, The current pattern-match on usingDirective to detect\n`using static System.Console` is too syntax-specific and misses forms like\n`using static global::System.Console`; instead resolve the using directive\nagainst the semantic model and compare the target symbol to the already-obtained\nconsoleType. Specifically, when checking a UsingDirectiveSyntax with\nStaticKeyword, call semanticModel.GetSymbolInfo(usingDirective.Name).Symbol (or\nGetTypeInfo) and test whether that symbol (or its original definition) equals\nthe consoleType INamedTypeSymbol you retrieved earlier, rather than relying on\nQualifiedNameSyntax/IdentifierNameSyntax shape matching.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:hawk -->\n\n<!-- This is an auto-generated reply by CodeRabbit -->\n\n✅ Addressed in commit 70a50f8",
