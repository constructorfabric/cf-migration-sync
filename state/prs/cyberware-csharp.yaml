          "body": "_⚠️ Potential issue_ | _🟡 Minor_\n\n**Test method names reference incorrect diagnostic ID.**\n\nThe test methods `Task_Result_reports_CA0005` (line 12) and `GetAwaiter_GetResult_reports_CA0005` (line 29) reference \"CA0005\", but the `NoTaskResultAnalyzer` declares `DiagnosticId = \"DE1303\"` (see `analyzers/DE13_common_patterns/CyberFabric.Analyzers.NoTaskResult/NoTaskResultAnalyzer.cs:15`).\n\nWhile the tests will pass because `Verify.Diagnostic()` defaults to the analyzer's declared ID, the misleading names will cause confusion when searching for or documenting diagnostics.\n\n<details>\n<summary>✏️ Suggested fix</summary>\n\n```diff\n     [Fact]\n-    public async Task Task_Result_reports_CA0005()\n+    public async Task Task_Result_reports_DE1303()\n     {\n         // ...\n     }\n \n     [Fact]\n-    public async Task GetAwaiter_GetResult_reports_CA0005()\n+    public async Task GetAwaiter_GetResult_reports_DE1303()\n     {\n         // ...\n     }\n```\n</details>\n\n<!-- suggestion_start -->\n\n<details>\n<summary>📝 Committable suggestion</summary>\n\n> ‼️ **IMPORTANT**\n> Carefully review the code before committing. Ensure that it accurately replaces the highlighted code, contains no missing lines, and has no issues with indentation. Thoroughly test & benchmark the code to ensure it meets the requirements.\n\n```suggestion\n    [Fact]\n    public async Task Task_Result_reports_DE1303()\n    {\n        var code = @\"\nusing System.Threading.Tasks;\nclass C\n{\n    static void M()\n    {\n        var t = Task.FromResult(1);\n        var x = t.Result;\n    }\n}\";\n        var (line, col) = AnalyzerTestHelper.GetLineColumn(code, \"t.Result\");\n        await Verify.VerifyAnalyzerAsync(code, Verify.Diagnostic().WithLocation(line, col));\n    }\n\n    [Fact]\n    public async Task GetAwaiter_GetResult_reports_DE1303()\n    {\n        var code = @\"\nusing System.Threading.Tasks;\nclass C\n{\n    static void M()\n    {\n        Task.CompletedTask.GetAwaiter().GetResult();\n    }\n}\";\n        var (line, col) = AnalyzerTestHelper.GetLineColumn(code, \"Task.CompletedTask.GetAwaiter().GetResult()\");\n        await Verify.VerifyAnalyzerAsync(code, Verify.Diagnostic().WithLocation(line, col));\n    }\n```\n\n</details>\n\n<!-- suggestion_end -->\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@analyzers/Tests/CyberFabric.Analyzers.Tests/NoTaskResultAnalyzerTests.cs`\naround lines 11 - 42, The test method names Task_Result_reports_CA0005 and\nGetAwaiter_GetResult_reports_CA0005 reference the wrong diagnostic ID (CA0005)\nwhile the analyzer NoTaskResultAnalyzer defines DiagnosticId = \"DE1303\"; rename\nthe test methods to reference DE1303 (e.g., Task_Result_reports_DE1303 and\nGetAwaiter_GetResult_reports_DE1303) so the method names match\nNoTaskResultAnalyzer.DiagnosticId and remove potential confusion when searching\nor documenting diagnostics.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:medusa:ocelot -->\n\n<!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commit 6a71a78",
