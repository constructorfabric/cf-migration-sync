          "body": "_⚠️ Potential issue_ | _🟠 Major_\n\n<details>\n<summary>🧩 Analysis chain</summary>\n\n🏁 Script executed:\n\n```shell\n#!/bin/bash\nset -euo pipefail\n\necho \"Analyzer checks:\"\nrg -n -C2 'ConfiguredTaskAwaitable|IsTaskOrTaskOfT|GetAwaiter|GetResult' \\\n  analyzers/DE13_common_patterns/DE1303_no_task_result/NoTaskResultAnalyzer.cs || true\n\necho\necho \"Test coverage checks:\"\nrg -n -C2 'ConfigureAwait|GetAwaiter\\(\\)\\.GetResult\\(\\)|\\.Result' \\\n  analyzers/Tests/CyberFabric.Analyzers.Tests/NoTaskResultAnalyzerTests.cs || true\n```\n\nRepository: cyberfabric/cyberfabric-core-csharp\n\nLength of output: 2433\n\n---\n\n🏁 Script executed:\n\n```shell\ncat -n analyzers/Tests/CyberFabric.Analyzers.Tests/NoTaskResultAnalyzerTests.cs\n```\n\nRepository: cyberfabric/cyberfabric-core-csharp\n\nLength of output: 1867\n\n---\n\n🌐 Web query:\n\n`ConfigureAwait return type ConfiguredTaskAwaitable .NET framework`\n\n💡 Result:\n\nThe ConfigureAwait method on Task and Task<TResult> returns a ConfiguredTaskAwaitable (or ConfiguredTaskAwaitable<TResult> for generic tasks). This is a struct in the System.Runtime.CompilerServices namespace that enables configured awaits on a task, controlling whether the continuation should run on the captured synchronization context. Key details from official Microsoft documentation: - Signature for Task: public System.Runtime.CompilerServices.ConfiguredTaskAwaitable ConfigureAwait(bool continueOnCapturedContext); - Signature for Task<TResult>: public System.Runtime.CompilerServices.ConfiguredTaskAwaitable<TResult> ConfigureAwait(bool continueOnCapturedContext); - There is also an overload using ConfigureAwaitOptions (available in .NET 8+), which returns the same types. - Available in .NET Framework starting from 4.5, as well as .NET Core/5+ and .NET Standard. Usage example: var awaitable = someTask.ConfigureAwait(false); await awaitable; // Continues without capturing the original context This prevents potential deadlocks in UI/ASP.NET contexts by not marshaling back to the original synchronization context when continueOnCapturedContext is false. ConfiguredTaskAwaitable is intended for immediate awaiting and not for passing around as a return type from methods; prefer returning Task directly.\n\nCitations:\n\n- 1: https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task-1.configureawait?redirectedfrom=MSDN&view=net-6.0\n- 2: https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task-1.configureawait?view=net-10.0\n- 3: https://msdn.microsoft.com/library/system.threading.tasks.task.configureawait\n- 4: https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.configureawait?view=net-10.0\n- 5: https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.configureawait?view=net-8.0\n- 6: https://learn.microsoft.com/en-us/dotnet/api/system.runtime.compilerservices.configuredtaskawaitable?view=net-10.0\n- 7: https://learn.microsoft.com/en-us/dotnet/api/system.runtime.compilerservices.configuredtaskawaitable?view=net-8.0\n\n---\n\n\n\n</details>\n\n**`ConfigureAwait(...).GetAwaiter().GetResult()` currently bypasses DE1303**\n\nLines 66–69 only check for `Task`/`Task<T>` as the `GetAwaiter` receiver via `IsTaskOrTaskOfT()`. The common pattern `task.ConfigureAwait(false).GetAwaiter().GetResult()` is not detected because `ConfigureAwait()` returns `ConfiguredTaskAwaitable` or `ConfiguredTaskAwaitable<T>` (from `System.Runtime.CompilerServices`), which fail the type check. This is a functional gap: the analyzer misses a real blocking-wait variant used in production code to manage synchronization context behavior.\n\nAdd support for `ConfiguredTaskAwaitable` and `ConfiguredTaskAwaitable<T>` types in the receiver check (lines 66–69 and helper method 90–102). Also add test coverage for this pattern.\n\n<details>\n<summary>Suggested patch</summary>\n\n```diff\n@@\n     private const string TaskTypeName = \"System.Threading.Tasks.Task\";\n     private const string GenericTaskTypeName = \"System.Threading.Tasks.Task`1\";\n+    private const string ConfiguredTaskAwaitableTypeName = \"System.Runtime.CompilerServices.ConfiguredTaskAwaitable\";\n+    private const string GenericConfiguredTaskAwaitableTypeName = \"System.Runtime.CompilerServices.ConfiguredTaskAwaitable`1\";\n@@\n             var taskType = compilationStartContext.Compilation.GetTypeByMetadataName(TaskTypeName);\n             var taskOfTType = compilationStartContext.Compilation.GetTypeByMetadataName(GenericTaskTypeName);\n+            var configuredTaskAwaitableType =\n+                compilationStartContext.Compilation.GetTypeByMetadataName(ConfiguredTaskAwaitableTypeName);\n+            var configuredTaskAwaitableOfTType =\n+                compilationStartContext.Compilation.GetTypeByMetadataName(GenericConfiguredTaskAwaitableTypeName);\n             if (taskType is null || taskOfTType is null)\n                 return;\n@@\n                     case IInvocationOperation { TargetMethod.Name: \"GetResult\" } outer when\n                         SkipConversions(outer.Instance) is IInvocationOperation inner &&\n                         inner.TargetMethod.Name == \"GetAwaiter\" &&\n-                        IsTaskOrTaskOfT(inner.Instance?.Type, taskType, taskOfTType):\n+                        IsBlockingWaitReceiver(\n+                            inner.Instance?.Type,\n+                            taskType,\n+                            taskOfTType,\n+                            configuredTaskAwaitableType,\n+                            configuredTaskAwaitableOfTType):\n@@\n-    private static bool IsTaskOrTaskOfT(ITypeSymbol? type, INamedTypeSymbol task, INamedTypeSymbol taskOfT)\n+    private static bool IsBlockingWaitReceiver(\n+        ITypeSymbol? type,\n+        INamedTypeSymbol task,\n+        INamedTypeSymbol taskOfT,\n+        INamedTypeSymbol? configuredTaskAwaitable,\n+        INamedTypeSymbol? configuredTaskAwaitableOfT)\n     {\n         if (type is null)\n             return false;\n         if (type is INamedTypeSymbol named)\n         {\n             if (SymbolEqualityComparer.Default.Equals(named.OriginalDefinition, task))\n                 return true;\n             if (SymbolEqualityComparer.Default.Equals(named.OriginalDefinition, taskOfT))\n                 return true;\n+            if (configuredTaskAwaitable is not null &&\n+                SymbolEqualityComparer.Default.Equals(named.OriginalDefinition, configuredTaskAwaitable))\n+                return true;\n+            if (configuredTaskAwaitableOfT is not null &&\n+                SymbolEqualityComparer.Default.Equals(named.OriginalDefinition, configuredTaskAwaitableOfT))\n+                return true;\n         }\n         return false;\n     }\n```\n</details>\n\nAlso applies to: 90–102\n\n<details>\n<summary>🤖 Prompt for AI Agents</summary>\n\n```\nVerify each finding against the current code and only fix it if needed.\n\nIn `@analyzers/DE13_common_patterns/DE1303_no_task_result/NoTaskResultAnalyzer.cs`\naround lines 66 - 69, The pattern matching case that detects\nGetAwaiter().GetResult() (the switch case matching IInvocationOperation with\nTargetMethod.Name == \"GetResult\" and inner.TargetMethod.Name == \"GetAwaiter\")\nonly treats Task/Task<T> as valid receivers; update that check to also accept\nConfiguredTaskAwaitable and ConfiguredTaskAwaitable<T> (i.e., extend the\nIsTaskOrTaskOfT logic) so calls like\ntask.ConfigureAwait(false).GetAwaiter().GetResult() are detected. Modify the\nhelper method IsTaskOrTaskOfT to recognize the\nSystem.Runtime.CompilerServices.ConfiguredTaskAwaitable and\nConfiguredTaskAwaitable<T> types (and their generic form) in addition to\nTask/Task<T>, and add unit tests that exercise the\nConfigureAwait(...).GetAwaiter().GetResult() pattern to ensure coverage.\n```\n\n</details>\n\n<!-- fingerprinting:phantom:poseidon:hawk -->\n\n<!-- This is an auto-generated reply by CodeRabbit -->",
