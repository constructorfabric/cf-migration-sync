          "body": "`@javiers451`, understood — I'll note that for now. Would you like me to open a follow-up GitHub issue to track the gap where `task.ConfigureAwait(false).GetAwaiter().GetResult()` is not detected by `NoTaskResultAnalyzer` (DE1303)?\n\n---\n\n<details>\n<summary>✏️ Learnings added</summary>\n\n```\nLearnt from: javiers451\nRepo: cyberfabric/cyberfabric-core-csharp PR: 1\nFile: analyzers/DE13_common_patterns/DE1303_no_task_result/NoTaskResultAnalyzer.cs:66-69\nTimestamp: 2026-03-20T08:28:52.442Z\nLearning: In `cyberfabric/cyberfabric-core-csharp`, the `NoTaskResultAnalyzer` (DE1303) at `analyzers/DE13_common_patterns/DE1303_no_task_result/NoTaskResultAnalyzer.cs` intentionally does not cover `task.ConfigureAwait(false).GetAwaiter().GetResult()` (i.e., `ConfiguredTaskAwaitable`/`ConfiguredTaskAwaitable<T>` receivers). This is a known, accepted limitation deferred for a later PR. Do not flag this as a bug in the current implementation.\n```\n\n> Note: Learnings are effective only in the context of similar code segments. To apply general coding guidelines, please configure [review instructions](https://docs.coderabbit.ai/guides/review-instructions). You can manage existing learnings in the [app](https://app.coderabbit.ai/learnings).\n\n</details>\n\n\n\n---\n\n<details>\n<summary>🧠 Learnings used</summary>\n\n```\nLearnt from: javiers451\nRepo: cyberfabric/cyberfabric-core-csharp PR: 1\nFile: analyzers/DE13_common_patterns/DE1301_no_async_void/NoAsyncVoidAnalyzer.cs:40-63\nTimestamp: 2026-03-20T08:25:35.753Z\nLearning: In the `cyberfabric-core-csharp` repository (`analyzers/DE13_common_patterns/DE1301_no_async_void/NoAsyncVoidAnalyzer.cs`), `NoAsyncVoidAnalyzer` intentionally covers only regular methods via `RegisterSymbolAction(SymbolKind.Method)`. Async-void lambdas and async-void local functions are explicitly out of scope and will be handled by separate dedicated analyzers in the same solution. Do not flag the absence of lambda/local-function coverage as a bug in `NoAsyncVoidAnalyzer`.\n```\n\n</details>\n\n\n\n<!-- This is an auto-generated reply by CodeRabbit -->",
