          "body": "<!-- This is an auto-generated comment: summarize by coderabbit.ai -->\nNo actionable comments were generated in the recent review. 🎉\n\n<details>\n<summary>ℹ️ Recent review info</summary>\n\n<details>\n<summary>⚙️ Run configuration</summary>\n\n**Configuration used**: defaults\n\n**Review profile**: CHILL\n\n**Plan**: Pro\n\n**Run ID**: `794c0b27-5fe4-4041-b759-a0fa1e9875ff`\n\n</details>\n\n<details>\n<summary>📥 Commits</summary>\n\nReviewing files that changed from the base of the PR and between 23afe1b06f06ee6eba5826de9d231f2f0d3ef20b and 153dac9c72395691a1c46ca708601fd1ea67f8a1.\n\n</details>\n\n<details>\n<summary>⛔ Files ignored due to path filters (1)</summary>\n\n* `img/OVERVIEW.drawio.svg` is excluded by `!**/*.svg`\n\n</details>\n\n<details>\n<summary>📒 Files selected for processing (1)</summary>\n\n* `VISION.md`\n\n</details>\n\n</details>\n\n---\n\n\n<!-- walkthrough_start -->\n\n<details>\n<summary>📝 Walkthrough</summary>\n\n## Walkthrough\n\nAdded a new documentation file `VISION.md` describing the product direction for \"Cyber Arc,\" the next evolution of \"Cyber Pilot.\" The document outlines core concepts, target workflows, unified skill capabilities across multiple agents, server-mode features, and product direction principles.\n\n## Changes\n\n|Cohort / File(s)|Summary|\n|---|---|\n|**Documentation** <br> `VISION.md`|New documentation file defining Cyber Arc's product vision, including core concepts (parameterless `arc` CLI, workspace contexts, repository membership evolution), unified Arc skill features (documentation generation, code generation, template enforcement, identifier preservation), server-mode capabilities (centralized web chat, visualization, AI-assisted proxy integrations, change management), and guiding principles (workspace-first, agent-native, traceability-first, minimal footprint).|\n\n## Estimated code review effort\n\n🎯 1 (Trivial) | ⏱️ ~3 minutes\n\n## Poem\n\n> A vision takes shape in words so clear,  \n>